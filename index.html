mpagne","pommeau"]}},tc=[2,6,12,20,30],n4=1.25,Wt=[{n:1,name:"Le village se r\xE9veille",lvl:2,intro:"Le village est bien triste depuis que la vieille ferme a ferm\xE9. Avec vos produits, tout pourrait revivre\u2026"},{n:2,name:"Les bonnes odeurs",lvl:10,intro:"Les habitants reprennent espoir. Gaston r\xEAve de rouvrir l'auberge, et Lucie voudrait retrouver son \xE9cole."},{n:3,name:"Le c\u0153ur du village",lvl:18,intro:"Les visiteurs reviennent\xA0! Rose et Marcel ont eux aussi des projets plein la t\xEAte."},{n:4,name:"La grande f\xEAte",lvl:22,intro:"Il ne reste plus que la mairie. Une fois r\xE9nov\xE9e, tout le village fera la f\xEAte en votre honneur."},{n:5,name:"Le hameau oubli\xE9",lvl:25,map:"hamlet",intro:"De l'autre c\xF4t\xE9 de la rivi\xE8re dort un vieux hameau. Jules et In\xE8s y vivent encore\xA0: aidez-les \xE0 le r\xE9veiller."},{n:6,name:"La grande foire",lvl:31,map:"hamlet",intro:"Le hameau revit\xA0! Pour f\xEAter \xE7a, tout le canton pr\xE9pare une grande foire. Il ne manque plus que vous."},{n:7,name:"Le port endormi",lvl:34,map:"port",intro:"Au bout de la route du hameau, un petit port attend que les bateaux reviennent. La capitaine Morgane compte sur vous."},{n:8,name:"La route des mers",lvl:37,map:"port",intro:"Les bateaux sont revenus\xA0! Brasseurs et chocolatiers voudraient s\u2019installer sur le quai."},{n:9,name:"Les estives",lvl:40,map:"alpine",intro:"L\xE0-haut, les alpages n\u2019attendent que les troupeaux. Bruno le berger et L\xE9a la guide vous montrent le chemin."},{n:10,name:"La f\xEAte de la montagne",lvl:40,map:"alpine",intro:"Toute la vall\xE9e monte \xE0 l\u2019alpage pour la grande f\xEAte de la montagne. Dernier chapitre\xA0: faites-en un souvenir."},{n:11,name:"Le domaine des Coteaux",lvl:40,map:"domaine",intro:"Sur les coteaux, un vieux domaine viticole dort sous les ronces. Margaux et Ma\xEEtre Anselme r\xEAvent de le r\xE9veiller."},{n:12,name:"La grande vente",lvl:40,map:"domaine",intro:"Le domaine revit\xA0! Ma\xEEtre Duval veut y ouvrir la plus belle salle des ventes du pays."},{n:13,name:"L\u2019\xEEle aux Aliz\xE9s",lvl:30,after:5,map:"island",intro:"Depuis le hameau, un vieux bac m\xE8ne \xE0 une \xEEle ti\xE8de et oubli\xE9e. Tiago le passeur et Ma\xEBva la cueilleuse r\xEAvent d\u2019y faire pousser des fruits."},{n:14,name:"Le carnaval des \xEEles",lvl:35,map:"island",intro:"L\u2019\xEEle est en fleurs\xA0! Caf\xE9, rhum et musique\xA0: Tiago et Ma\xEBva pr\xE9parent le plus beau carnaval de la r\xE9gion."},{n:15,name:"La station de recherche",lvl:33,after:5,map:"station",intro:"Au bout du chemin des vergers, une vieille station de recherche agricole dort sous la vigne vierge. La docteure Agathe et Victor le v\xE9t\xE9rinaire veulent la rouvrir\xA0: croiser plantes et animaux, cr\xE9er ses propres vari\xE9t\xE9s."},{n:16,name:"Le Salon de l\u2019agriculture",lvl:36,map:"station",intro:"Vos cr\xE9ations font parler d\u2019elles\xA0! Un conservatoire pour les garder, une ruche pour les surprises, et une grande salle pour le Salon de l\u2019agriculture."}],Ce={station:{id:"station",ch:1,name:"La gare",vid:"marcel",need:{wheat:20,carrot:10,egg:5},before:"La vieille gare est ferm\xE9e depuis des ann\xE9es. Si on la r\xE9pare, le train de marchandises s'arr\xEAtera de nouveau chez nous.",after:"Tchou tchou\xA0! La gare est rouverte\xA0: le train de marchandises passe d\xE9sormais r\xE9guli\xE8rement \xE0 la ferme.",reward:"Le train de marchandises passe \xE0 la ferme",x:14,y:30},fountain:{id:"fountain",ch:1,name:"La fontaine",vid:"odette",need:{radish:12,carrot:15,wood:15},before:"Quand j'\xE9tais petite, toute la place se retrouvait autour de cette fontaine. Elle est \xE0 sec, la pauvre\u2026",after:"L'eau coule de nouveau sur la place\xA0! Les voyageurs s'y arr\xEAtent\xA0: un marchand ambulant passera vous voir de temps en temps.",reward:"Un marchand ambulant visite la ferme",x:50,y:52},bakery:{id:"bakery",ch:1,name:"La boulangerie",vid:"paul",need:{wheat:30,bread:8,egg:10},before:"Ma boulangerie n'a plus de farine ni de clients. Aidez-moi \xE0 rallumer le four, et je vous passerai bien plus de commandes\xA0!",after:"\xC7a sent le pain chaud dans tout le village\xA0! Paul affiche vos commandes\xA0: une place de plus au tableau, et ses commandes paient 20\xA0% de plus.",reward:"+1 commande au tableau, commandes de Paul +20\xA0%",x:82,y:34},inn:{id:"inn",ch:2,name:"L'auberge",vid:"gaston",need:{tomato:20,omelette:4,bread:10,lettuce:12},before:"Une auberge sans cuisine, c'est une maison sans c\u0153ur. Remplissez mon garde-manger et je rouvre\xA0!",after:"L'auberge affiche complet\xA0! Ses clients voyagent en montgolfi\xE8re\xA0: elle se posera dans votre pr\xE9 avec de grosses commandes.",reward:"La montgolfi\xE8re vient chercher des commandes",x:26,y:68},school:{id:"school",ch:2,name:"L'\xE9cole",vid:"lucie",need:{corn:20,cookies:4,feather:10,cornmeal:3},before:"La ma\xEEtresse dit que l'\xE9cole ne rouvrira pas sans toit neuf et sans go\xFBter. Tu m'aides, dis\xA0?",after:"Toute la classe vous remercie\xA0! Les \xE9l\xE8ves apprennent avec vos produits\xA0: toutes les livraisons donnent 10\xA0% d'exp\xE9rience en plus.",reward:"+10\xA0% d\u2019exp\xE9rience sur toutes les livraisons",x:68,y:70},florist:{id:"florist",ch:3,name:"La boutique de fleurs",vid:"rose",need:{lavender:10,strawberry:15,cottonFabric:3,down:2},before:"Ma boutique est toute fan\xE9e. Avec de la lavande et de jolis tissus, je pourrais fleurir tout le village\u2026 et votre ferme aussi\xA0!",after:"La boutique embaume\xA0! Rose vous offre deux parterres de fleurs, et le jury du concours adore votre go\xFBt\xA0: vos d\xE9corations comptent double.",reward:"2 parterres de fleurs offerts, charme des d\xE9corations \xD72 au concours",x:38,y:24},pontoon:{id:"pontoon",ch:3,name:"Le ponton",vid:"marcel",need:{trout:6,smokedTrout:3,wood:40,plank:4,nail:4},before:"Mon ponton prend l'eau de partout. R\xE9pare-le et je te pr\xEAte ma cabane pour ranger tes affaires.",after:"Le ponton est comme neuf\xA0! Marcel vous pr\xEAte sa cabane\xA0: la grange gagne 60 places.",reward:"+60 places dans la grange",x:86,y:76},townhall:{id:"townhall",ch:4,name:"La mairie",vid:"odette",need:{cheese:5,pizza:3,sweater:3,carrotJuice:4,butter:3,paint:5},before:"La mairie, c'est le c\u0153ur du village. Si elle brille de nouveau, on fera la plus belle f\xEAte qu'on ait jamais vue.",after:"Le village a retrouv\xE9 toute sa joie\xA0! On vous nomme citoyen d\u2019honneur\xA0: toutes vos commandes paient 10\xA0% de plus, et vous recevez 3 rubans.",reward:"Commandes +10\xA0%, 3 rubans de concours",x:58,y:14},bridge:{id:"bridge",ch:5,name:"Le pont",vid:"jules",need:{beam:12,nail:20,stone:60,tools:4},before:"Le vieux pont de pierre s\u2019est effondr\xE9 pendant l\u2019orage. Sans lui, personne ne vient plus au hameau.",after:"Le pont tient bon\xA0! Mon neveu Th\xE9o peut enfin traverser\xA0: il sera votre commis de ferme.",reward:"Th\xE9o, le commis de ferme, arrose et r\xE9colte une partie du champ",x:22,y:56,map:"hamlet"},washhouse:{id:"washhouse",ch:5,name:"Le lavoir",vid:"ines",need:{stone:50,lavenderSoap:6,dyedWool:4,cloth:10},before:"Le lavoir \xE9tait le c\u0153ur du hameau. On y lavait, on y bavardait\u2026 Il est plein de vase.",after:"Le lavoir chante de nouveau\xA0! Les lavandi\xE8res parlent de votre \xE9tal \xE0 tout le canton\xA0: une place de plus.",reward:"+1 place \xE0 l'\xE9tal",x:54,y:74,map:"hamlet"},windmill:{id:"windmill",ch:5,name:"Le moulin \xE0 vent",vid:"paul",need:{flour:30,beam:10,plank:12,cornmeal:10,sunflowerOil:6},before:"Ce moulin a nourri trois g\xE9n\xE9rations. Si ses ailes tournent encore, je vous moudrai tout ce que vous voudrez.",after:"Les ailes tournent\xA0! Le moulin du hameau aide le v\xF4tre\xA0: le moulin et l\u2019huilerie travaillent 25\xA0% plus vite.",reward:"Moulin et huilerie 25\xA0% plus rapides",x:82,y:34,map:"hamlet"},stud:{id:"stud",ch:6,name:"Le haras",vid:"jules",need:{horseshoe:6,horsehair:20,apple:40,carrot:80},before:"Pour la foire, il faut des chevaux fiers et bien ferr\xE9s. Mes \xE9curies tombent en ruine.",after:"Les chevaux du haras tirent vos wagons et guident les montgolfi\xE8res\xA0: le train et la montgolfi\xE8re paient 15\xA0% de plus.",reward:"Train et montgolfi\xE8re +15\xA0%",x:18,y:26,map:"hamlet"},hall:{id:"hall",ch:6,name:"La salle des f\xEAtes",vid:"gaston",need:{lasagna:4,risotto:4,spongeCake:5,cider:8,paint:6},before:"Une foire sans banquet\xA0? Jamais\xA0! Aidez-moi \xE0 remplir la salle des f\xEAtes, j'ai d\xE9j\xE0 le menu en t\xEAte.",after:"Quel banquet\xA0! On en parlera pendant des ann\xE9es. Une commande de plus au tableau, et les f\xEAtes de saison durent 2 jours de plus.",reward:"+1 commande au tableau, f\xEAtes de saison +2 jours",x:50,y:40,map:"hamlet"},bandstand:{id:"bandstand",ch:6,name:"Le kiosque \xE0 musique",vid:"ines",need:{goldLocket:2,honeyPot:6,greenTea:6,colorSweater:3,vase:6},before:"Le kiosque, c\u2019est l\xE0 que joue la fanfare. Le jour de la foire, je voudrais qu\u2019il soit le plus beau du canton.",after:"La fanfare joue, tout le canton danse\xA0! Le jury du concours est sous le charme\xA0: +25\xA0% de points au concours, et 5 rubans.",reward:"Concours +25\xA0% de points, 5 rubans",x:72,y:70,map:"hamlet"},lighthouse:{id:"lighthouse",ch:7,name:"Le phare",vid:"morgane",need:{stone:120,beam:20,tools:8,paint:6},before:"Sans phare, aucun p\xEAcheur ne sort la nuit. Rallumons-le, et la mer vous ouvrira ses filets.",after:"La lumi\xE8re tourne de nouveau\xA0! Vous pouvez poser un filet en mer depuis l\u2019onglet Nature.",reward:"La p\xEAche en mer au filet (onglet Nature)",x:18,y:30,map:"port"},fishmarket:{id:"fishmarket",ch:7,name:"La cri\xE9e",vid:"yann",need:{trout:15,smokedTrout:8,crate:10,nail:20},before:"Une cri\xE9e sans poisson, c\u2019est un hangar vide. Aide-moi \xE0 la remplir et je t\u2019apprends \xE0 faire des conserves.",after:"La cri\xE9e r\xE9sonne de cris joyeux. La conserverie est \xE0 vendre au magasin.",reward:"La conserverie (au magasin)",x:48,y:58,map:"port"},quay:{id:"quay",ch:7,name:"Le quai",vid:"morgane",need:{beam:30,plank:30,nail:30},before:"Un vrai quai, et les cargos reviendront charger vos produits. Ils paient bien, crois-moi.",after:"Le premier bateau accoste d\xE9j\xE0\xA0! Il reviendra r\xE9guli\xE8rement chercher de grosses commandes.",reward:"Le bateau de livraison vient chercher de grosses commandes",x:78,y:74,map:"port"},brewhouse:{id:"brewhouse",ch:8,name:"La brasserie du port",vid:"yann",need:{wheat:200,crate:15,beam:15,sardine:20},before:"Les marins ont soif\xA0! Une brasserie au bout du quai, et tout le port viendra trinquer.",after:"Sant\xE9\xA0! La brasserie est \xE0 vendre au magasin, et vous pouvez planter du houblon.",reward:"La brasserie et le houblon",x:22,y:64,map:"port"},chocoshop:{id:"chocoshop",ch:8,name:"La chocolaterie",vid:"lucie",need:{sugar:30,milk:40,cream:10,cottonCandy:5},before:"Les bateaux rapportent des f\xE8ves de cacao\xA0! On pourrait ouvrir une chocolaterie, dis\xA0?",after:"\xC7a sent le chocolat jusqu\u2019au phare\xA0! La chocolaterie est au magasin, et le cacaoyer pousse dans la serre.",reward:"La chocolaterie, et le cacao dans la serre",x:56,y:24,map:"port"},shipyard:{id:"shipyard",ch:8,name:"Le chantier naval",vid:"morgane",need:{beam:40,tools:15,paint:10,cloth:20},before:"Avec un chantier naval, je construis un cargo plus rapide. Plus de voyages, plus de commandes\xA0!",after:"Le nouveau cargo file sur l\u2019eau\xA0: le bateau revient plus vite et paie 25\xA0% de plus.",reward:"Bateau 25\xA0% mieux pay\xE9, et de retour une heure plus t\xF4t",x:84,y:36,map:"port"},sheepfold:{id:"sheepfold",ch:9,name:"La bergerie d\u2019altitude",vid:"bruno",need:{wool:80,beam:30,stone:150,feed:200},before:"L\xE0-haut, l\u2019herbe est la meilleure du monde. R\xE9parons la bergerie, et tes b\xEAtes pourront monter aux estives.",after:"La bergerie est pr\xEAte\xA0! Envoyez vos vaches, ch\xE8vres et moutons en transhumance depuis l\u2019onglet Animaux.",reward:"La transhumance (onglet Animaux)",x:20,y:34,map:"alpine"},chalet:{id:"chalet",ch:9,name:"Le chalet",vid:"lea",need:{beam:40,plank:40,tools:20,blueberry:60},before:"Un chalet pour accueillir les randonneurs, et un jardin d\u2019altitude pour le g\xE9n\xE9pi.",after:"Le chalet est chaleureux, et le g\xE9n\xE9pi pousse dans votre champ.",reward:"Le g\xE9n\xE9pi (graines au magasin)",x:52,y:62,map:"alpine"},alpinedairy:{id:"alpinedairy",ch:9,name:"La fromagerie d\u2019alpage",vid:"bruno",need:{milk:120,goatMilk:40,cheese:15,goatCheese:8},before:"Le lait d\u2019alpage, c\u2019est de l\u2019or blanc. Avec une vraie fromagerie, on en fera du beaufort.",after:"Les meules s\u2019alignent dans la cave. La fromagerie d\u2019alpage est au magasin.",reward:"La fromagerie d'alpage (au magasin)",x:82,y:40,map:"alpine"},cablecar:{id:"cablecar",ch:10,name:"Le t\xE9l\xE9ph\xE9rique",vid:"lea",need:{tools:30,nail:60,paint:15,beam:40},before:"Un t\xE9l\xE9ph\xE9rique, et la mont\xE9e aux estives prendra deux fois moins de temps\xA0!",after:"La cabine file au-dessus des sapins\xA0: la transhumance est deux fois plus rapide et emm\xE8ne deux fois plus de b\xEAtes.",reward:"Transhumance deux fois plus rapide, 8 animaux au lieu de 4",x:26,y:70,map:"alpine"},chapel:{id:"chapel",ch:10,name:"La chapelle des neiges",vid:"odette",need:{stone:200,paint:20,scentedCandle:10,flowerPot:10},before:"Toute la vall\xE9e se retrouve \xE0 la chapelle pour la f\xEAte. Elle m\xE9rite de briller de nouveau.",after:"Les cloches sonnent dans toute la vall\xE9e\xA0: les saisons de la ferme commencent (volet Village).",reward:"Les saisons de la ferme, de 4 semaines",x:58,y:28,map:"alpine"},refuge:{id:"refuge",ch:10,name:"Le refuge",vid:"bruno",need:{fondue:4,genepiLiqueur:6,beaufort:6,colorSweater:6},before:"Le refuge, c\u2019est l\xE0 que finit toute belle mont\xE9e. On y f\xEAtera la fin de ton grand voyage.",after:"Quelle f\xEAte\xA0! Toute la vall\xE9e vous acclame. En vendant la ferme, vous pourrez d\xE9sormais choisir une ferme \xE0 th\xE8me. Et 5 rubans\xA0!",reward:"Fermes \xE0 th\xE8me au prestige, 5 rubans",x:84,y:76,map:"alpine"},chai:{id:"chai",ch:11,name:"Le chai",vid:"margaux",need:{grape:40,beam:25,stone:60,tools:6},before:"Sans chai, pas de vin. Aidez-moi \xE0 le relever et nous ferons couler le premier rouge des Coteaux.",after:"Les cuves sont pr\xEAtes\xA0! La cuverie est \xE0 vendre au magasin\xA0: vins rouge, blanc et ros\xE9.",reward:"La cuverie (au magasin) et le vin",x:22,y:34,map:"domaine"},cooperage:{id:"cooperage",ch:11,name:"La tonnellerie",vid:"margaux",need:{wood:120,plank:40,nail:30,beam:15},before:"Un bon vin a besoin d\u2019un bon f\xFBt. Le vieux tonnelier nous a laiss\xE9 ses outils, il manque juste le bois.",after:"Les premiers f\xFBts de ch\xEAne sentent bon le bois chaud. Vos vins et vos cidres vieilliront mieux.",reward:"F\xFBts de ch\xEAne\xA0: vins et cidres vieillissent mieux (+6\xA0%)",x:74,y:28,map:"domaine"},affinage:{id:"affinage",ch:11,name:"La maison de l\u2019affineur",vid:"anselme",need:{cheese:20,goatCheese:12,beaufort:4,crate:10},before:"Je cherche une maison avec une cave fra\xEEche pour affiner mes meules. Je vous apprendrai mes secrets.",after:"Ma cave est parfaite\xA0! Camembert, bleu et comt\xE9 sont \xE0 vous, et votre cave gagne quatre places.",reward:"Camembert, bleu et comt\xE9, +4 places en cave, fromages +6\xA0%",x:48,y:62,map:"domaine"},auctionHall:{id:"auctionHall",ch:12,name:"La salle des ventes",vid:"duval",need:{beam:30,paint:10,cloth:12,stone:80},before:"Une salle des ventes digne de ce nom\xA0: des lustres, des chaises, et un marteau qui claque. Adjug\xE9\xA0?",after:"Adjug\xE9\xA0! La grande vente a lieu chaque soir \xE0 19 h\xA0: collectionneurs, lots rares, et des prix fous.",reward:"La grande vente du soir et ses lots rares",x:20,y:72,map:"domaine"},cidery:{id:"cidery",ch:12,name:"La cidrerie",vid:"margaux",need:{apple:60,cider:10,plank:20,nail:20},before:"Les pommiers des Coteaux donnent un cidre fameux. Il faut juste une cidrerie digne de lui.",after:"La cidrerie tourne\xA0: le pommeau est au pressoir, et le cidre vieillit plus vite (une \xE9tape toutes les 4 h).",reward:"Le pommeau, et un cidre qui vieillit plus vite",x:80,y:66,map:"domaine"},crayere:{id:"crayere",ch:12,name:"La cray\xE8re",vid:"margaux",need:{stone:150,tools:10,whiteWine:10,beam:20},before:"Sous la colline, une vieille carri\xE8re de craie\xA0: la cave id\xE9ale pour le champagne. Il faut la consolider.",after:"Les pupitres sont en place. Champagne brut et ros\xE9\xA0: remuez-les bien, et gare aux bouteilles qui sautent\xA0!",reward:"Le champagne (\xE0 la cuverie)",x:52,y:20,map:"domaine"}};Object.assign(Ce,{ferry:{id:"ferry",ch:13,name:"Le bac",vid:"tiago",need:{plank:40,beam:20,nail:30,cloth:15},before:"Mon vieux bac prend l\u2019eau. R\xE9pare-le, et je t\u2019emm\xE8ne sur l\u2019\xEEle\xA0: la terre y est chaude, tout y pousse\xA0!",after:"Le bac traverse de nouveau\xA0! L\u2019\xEEle s\u2019ouvre dans l\u2019onglet Ferme\xA0: plantations tropicales et verger des \xEEles.",reward:"L\u2019\xEEle\xA0: plantations et verger tropical (onglet Ferme)",x:16,y:70,map:"island"},paillote:{id:"paillote",ch:13,name:"La paillote",vid:"maeva",need:{pineapple:20,banana:20,plank:20,crate:10},before:"Une paillote sur la plage, et on presse des jus toute la journ\xE9e. Il me faut des fruits et du bois.",after:"Les premiers jus coulent\xA0! Le bar \xE0 jus est \xE0 vendre au magasin.",reward:"Le bar \xE0 jus (au magasin)",x:50,y:76,map:"island"},bakehut:{id:"bakehut",ch:13,name:"Le four des \xEEles",vid:"maeva",need:{coconut:20,sweetPotato:40,flour:30,stone:80},before:"Ma grand-m\xE8re faisait des flans coco et des g\xE2teaux de patate douce. Construisons son four\xA0!",after:"\xC7a sent la vanille et la noix de coco\xA0! La p\xE2tisserie des \xEEles est au magasin.",reward:"La p\xE2tisserie des \xEEles (au magasin)",x:80,y:50,map:"island"},roasting:{id:"roasting",ch:14,name:"La br\xFBlerie",vid:"tiago",need:{greenCoffee:30,beam:15,stone:80,tools:8},before:"Les caf\xE9iers donnent bien. Avec une br\xFBlerie, on torr\xE9fie nous-m\xEAmes le meilleur caf\xE9 du pays.",after:"L\u2019odeur du caf\xE9 flotte sur toute l\u2019\xEEle. La br\xFBlerie est au magasin.",reward:"La br\xFBlerie (au magasin)",x:30,y:34,map:"island"},rumhouse:{id:"rumhouse",ch:14,name:"La rhumerie",vid:"tiago",need:{sugarcane:80,crate:15,beam:20,tools:10},before:"La canne \xE0 sucre de ta ferme ferait un rhum fameux. Il me faut des f\xFBts et une distillerie.",after:"Le premier rhum vieillit d\xE9j\xE0 en f\xFBt. La rhumerie est au magasin.",reward:"La rhumerie (au magasin)",x:62,y:26,map:"island"},carnival:{id:"carnival",ch:14,name:"Le kiosque du carnaval",vid:"maeva",need:{tiare:30,islandCocktail:10,coconutFlan:8,paint:10},before:"Pour le carnaval, il faut des fleurs partout, des cocktails et des flans coco pour tout le monde\xA0!",after:"Le carnaval bat son plein, toute la r\xE9gion danse sur la plage. Merci\xA0: voici 5 rubans de concours.",reward:"5 rubans de concours, et la f\xEAte sur l\u2019\xEEle",x:78,y:84,map:"island"}});Object.assign(Ce,{pollination:{id:"pollination",ch:15,name:"La serre de pollinisation",vid:"agathe",need:{plank:30,beam:15,paint:6,honey:20},before:"Pour croiser deux plantes, il faut les faire fleurir c\xF4te \xE0 c\xF4te, \xE0 l\u2019abri. Une serre de pollinisation, voil\xE0 ce qu\u2019il nous faut.",after:"Les premi\xE8res fleurs se croisent\xA0! Vous pouvez croiser vos plantes au labo (onglet Atelier, volet Labo).",reward:"Les croisements de plantes (Atelier, volet Labo)",x:22,y:40,map:"station"},breeding:{id:"breeding",ch:15,name:"L\u2019\xE9table de s\xE9lection",vid:"victor",need:{beam:30,stone:100,feed:150,wool:30},before:"Deux bonnes b\xEAtes font de bons petits. Une \xE9table propre et calme, et je m\u2019occupe du reste.",after:"L\u2019\xE9table est pr\xEAte\xA0: choisissez deux adultes de la m\xEAme esp\xE8ce au labo, et un petit na\xEEtra.",reward:"L\u2019\xE9levage de s\xE9lection (Atelier, volet Labo)",x:74,y:38,map:"station"},lab:{id:"lab",ch:15,name:"Le laboratoire",vid:"agathe",need:{tools:15,stone:80,paint:8,gooseEgg:20},before:"Avec un vrai laboratoire, on lit les g\xE8nes cach\xE9s et on fixe une vari\xE9t\xE9 pour de bon. Il me faut du mat\xE9riel\xA0!",after:"Le laboratoire tourne\xA0: analysez les g\xE8nes cach\xE9s, et fixez vos vari\xE9t\xE9s et vos races pour leur donner un nom.",reward:"Les analyses et la fixation des vari\xE9t\xE9s",x:48,y:66,map:"station"},seedbank:{id:"seedbank",ch:16,name:"Le conservatoire des semences",vid:"agathe",need:{wheat:200,rice:80,plank:30,crate:15},before:"Vos vari\xE9t\xE9s fix\xE9es m\xE9ritent d\u2019\xEAtre gard\xE9es pr\xE9cieusement. Un conservatoire, et vous pourrez en racheter les graines.",after:"Le conservatoire est ouvert\xA0: rachetez les graines de vos vari\xE9t\xE9s et les petits de vos races dans \xAB\xA0Mes cr\xE9ations\xA0\xBB.",reward:"Racheter graines et petits de vos cr\xE9ations",x:18,y:76,map:"station"},selectHive:{id:"selectHive",ch:16,name:"La ruche de s\xE9lection",vid:"victor",need:{honey:40,wax:20,plank:20,lavender:60},before:"Les abeilles butinent d\u2019une fleur \xE0 l\u2019autre et m\xE9langent tout\u2026 Une ruche de s\xE9lection, et les surprises seront plus fr\xE9quentes.",after:"Les abeilles s\u2019en donnent \xE0 c\u0153ur joie\xA0: les mutations sont presque deux fois plus fr\xE9quentes.",reward:"Plus de mutations rares",x:80,y:74,map:"station"},salonHall:{id:"salonHall",ch:16,name:"La salle du Salon",vid:"victor",need:{paint:12,beam:25,cloth:20,cheese:15},before:"Montrons vos plus belles cr\xE9ations \xE0 tout le pays\xA0! Il faut une grande salle pour le Salon de l\u2019agriculture.",after:"Le Salon ouvre ses portes\xA0: un nouveau concours tous les deux jours, avec des rubans \xE0 gagner. Merci\xA0: voici 5 rubans.",reward:"Le Salon de l\u2019agriculture, et 5 rubans",x:50,y:22,map:"station"}});var Jt={odette:{title:"Le carnet de Mamie",steps:[["J\u2019ai retrouv\xE9 le carnet de recettes de ma m\xE8re\xA0! Il commence par les confitures d\u2019antan.",{jam:4}],["Page suivante\xA0: les tartes du dimanche. Tu m\u2019aides \xE0 les refaire\xA0?",{pie:5}],["Et pour finir, un grand go\xFBter pour tout le village, comme autrefois.",{cookies:8,juice:8}]],end:"Le go\xFBter \xE9tait parfait. Ce carnet est \xE0 toi maintenant\xA0: tu en es digne."},gaston:{title:"Le concours de cuisine",steps:[["Je me suis inscrit au concours r\xE9gional\xA0! Il me faut d\u2019abord une sauce irr\xE9prochable.",{sauce:6}],["Le jury go\xFBtera aussi des omelettes. Des \u0153ufs frais, cuits \xE0 la perfection\xA0!",{omelette:6}],["La finale\xA0: mon gratin, avec du bon pain pour saucer.",{gratin:3,bread:10}]],end:"Premier prix\xA0! La m\xE9daille est dans ma cuisine, mais la moiti\xE9 est \xE0 toi."},lucie:{title:"Le spectacle de l\u2019\xE9cole",steps:[["On pr\xE9pare un spectacle\xA0! Il nous faut du tissu pour les costumes.",{cloth:6}],["La ma\xEEtresse veut un go\xFBter pour les r\xE9p\xE9titions. Du pain de ma\xEFs, s\u2019il te pla\xEEt\xA0!",{cornbread:6}],["Le jour J, on d\xE9core la salle avec des fraises et de la confiture pour l\u2019entracte\xA0!",{strawberry:20,jam:4}]],end:"Tout le monde a applaudi\xA0! Je t\u2019ai gard\xE9 une place au premier rang pour la prochaine fois."},paul:{title:"La vitrine de l\u2019\xE9picerie",steps:[["Je refais ma vitrine. Il me faut de la belle farine en sacs.",{flour:15}],["Des baguettes dor\xE9es, bien align\xE9es, \xE7a attire l\u2019\u0153il.",{baguette:10}],["Pour finir, le coin des produits fins\xA0: du miel et du fromage.",{honey:6,cheese:4}]],end:"Les clients s\u2019arr\xEAtent tous devant la vitrine. Merci, associ\xE9\xA0!"},rose:{title:"Le mariage de la fleuriste",steps:[["Je me marie au printemps\xA0! Il me faut de la lavande pour les bouquets.",{lavender:15}],["Des petits savons parfum\xE9s pour les invit\xE9s, ce serait si joli.",{lavenderSoap:4}],["Et la nappe du banquet, avec des fraises pour le dessert.",{cottonFabric:4,strawberry:15}]],end:"Quelle f\xEAte\xA0! Tu \xE9tais le t\xE9moin r\xEAv\xE9, m\xEAme sans le savoir."},marcel:{title:"La p\xEAche du si\xE8cle",steps:[["On raconte qu\u2019une truite g\xE9ante vit dans l\u2019\xE9tang. Commen\xE7ons par en attraper quelques-unes.",{trout:6}],["Fumons-les pour l\u2019app\xE2t. Les grosses ne r\xE9sistent pas \xE0 l\u2019odeur.",{smokedTrout:4}],["Ce soir, on la sort\xA0! Une soupe chaude et du pain pour tenir la nuit.",{fishSoup:3,bread:6}]],end:"On l\u2019a vue\xA0! Bon, elle s\u2019est \xE9chapp\xE9e\u2026 Mais quelle nuit, hein\xA0?"},jules:{title:"Le grand prix du haras",steps:[["Mes chevaux courent le grand prix\xA0! D\u2019abord, des fers neufs pour chacun.",{horseshoe:6}],["Il leur faut des forces\xA0: des pommes, beaucoup de pommes.",{apple:30}],["Le jour de la course, crini\xE8res tress\xE9es et carottes pour la victoire.",{horsehair:12,carrot:40}]],end:"Victoire\xA0! La coupe tr\xF4ne au haras, avec ton nom grav\xE9 dessous."},ines:{title:"L\u2019exposition d\u2019In\xE8s",steps:[["On m\u2019invite \xE0 exposer en ville\xA0! Je commence par une s\xE9rie de bols.",{clayBowl:10}],["Il me faut quelques vases pour le centre de la salle.",{vase:4}],["La pi\xE8ce ma\xEEtresse\xA0: des vases peints, en bleu profond.",{paintedVase:2,blueDye:4}]],end:"Tout est vendu le premier soir\xA0! Le plus beau vase t\u2019attend chez toi."},morgane:{title:"Le tr\xE9sor du capitaine",steps:[["Mon grand-p\xE8re a cach\xE9 un tr\xE9sor sur une \xEEle. Pour la travers\xE9e, il faut un bateau solide.",{beam:20,nail:20}],["Il faut des provisions pour l\u2019\xE9quipage\xA0: du pain et des conserves.",{bread:20,cannedSardines:4}],["La carte parle d\u2019un coffre sous un rocher. Une pioche, des outils, et on y va\xA0!",{tools:6,lobster:2}]],end:"Le coffre \xE9tait plein de vieilles cartes marines. Pour moi, c\u2019est le plus beau des tr\xE9sors. Merci, matelot\xA0!"},yann:{title:"Le concours de la cri\xE9e",steps:[["Chaque ann\xE9e, la cri\xE9e \xE9lit le plus bel \xE9tal. Commen\xE7ons par des crevettes bien fra\xEEches.",{shrimp:12}],["Il me faut des bars de ligne, les rois de l\u2019\xE9tal.",{seabass:6}],["Et pour impressionner le jury\xA0: une bouillabaisse comme \xE0 Marseille\xA0!",{bouillabaisse:3}]],end:"Premier prix de la cri\xE9e\xA0! Le jury n\u2019a jamais vu un \xE9tal pareil."},bruno:{title:"La grande mont\xE9e",steps:[["Cette ann\xE9e, je monte le plus beau troupeau de la vall\xE9e. Il faut des forces aux b\xEAtes.",{feed:120}],["L\xE0-haut, il fait froid la nuit. De la laine pour les couvertures du berger.",{wool:30}],["La f\xEAte des estives approche\xA0: du beaufort pour toute la vall\xE9e.",{beaufort:4,bread:10}]],end:"Le troupeau est redescendu fier et gras. Toute la vall\xE9e en parle encore\xA0!"},lea:{title:"Le sommet du Grand Mont",steps:[["Je r\xEAve de gravir le Grand Mont. D\u2019abord, des provisions l\xE9g\xE8res pour la marche.",{blueberry:20,cookies:10}],["Il faut de l\u2019\xE9quipement chaud pour la nuit au refuge.",{woolHat:3,cloth:10}],["Au sommet, on trinquera au g\xE9n\xE9pi en regardant la vall\xE9e.",{genepiLiqueur:2,hotChoc:4}]],end:"Le lever de soleil au sommet\u2026 Je n\u2019oublierai jamais. Et tu \xE9tais l\xE0."},margaux:{title:"La cuv\xE9e des Coteaux",steps:[["Je veux cr\xE9er une cuv\xE9e qui porte le nom du domaine. D\u2019abord, du raisin, beaucoup de raisin.",{grape:30}],["Il faut go\xFBter, encore et encore. Du fromage et du pain pour accompagner.",{cheese:10,bread:10}],["La cuv\xE9e est pr\xEAte\xA0: trois bouteilles de rouge pour la pr\xE9senter au village.",{redWine:3}]],end:"La cuv\xE9e des Coteaux est n\xE9e. Chaque bouteille porte un petit bout de votre ferme."},anselme:{title:"Le concours des affineurs",steps:[["Le concours des affineurs approche. Il me faut du bon lait pour mes essais.",{milk:30,goatMilk:15}],["Mes meules ont besoin de foin propre et de caisses pour voyager.",{crate:8,feed:60}],["Pour le jury\xA0: un camembert et un comt\xE9 dignes de ce nom.",{camembert:3,comte:2}]],end:"M\xE9daille d\u2019or\xA0! Le jury a parl\xE9 de \xAB\xA0la meilleure cro\xFBte depuis trente ans\xA0\xBB."},duval:{title:"La vente de charit\xE9",steps:[["Je pr\xE9pare une vente de charit\xE9 pour l\u2019\xE9cole. Il me faut de jolis lots \xE0 offrir.",{jam:10,honey:10}],["Des affiches et des banderoles pour annoncer la vente.",{cloth:8,paint:4}],["Le clou de la vente\xA0: du champagne pour trinquer.",{champagne:2}]],end:"Adjug\xE9, vendu\xA0! L\u2019\xE9cole aura sa nouvelle biblioth\xE8que. Merci pour ce beau geste."}},wn=6,s4=[2,5,9,14,20],o4=72e5,wa=[{name:"La ferme des Tilleuls",f:.5,owner:"Hortense",avatar:"hortense"},{name:"Domaine de Bellevue",f:.75,owner:"Bastien",avatar:"bastien"},{name:"Les Trois Ch\xEAnes",f:1,owner:"Yvette",avatar:"yvette"},{name:"La ferme du Moulin Rouge",f:1.25,owner:"Firmin",avatar:"firmin"}];var dt={forest:{lvl:3,hp:3,regrow:90,slots:5},mine:{lvl:8,hp:4,regrow:120,slots:5},pond:{lvl:10}},ac=3,i4=12e5,Xd=[["sardine",40],["mackerel",28],["shrimp",20],["seabass",10],["lobster",4]];var rc={cheese:{name:"Fromages",step:72e5,ranks:["Jeune","Affin\xE9","Vieux","Grand affinage","L\xE9gendaire"],care:"Retourner",careIcon:"turn",careDone:"Meules retourn\xE9es"},cider:{name:"Cidres",step:216e5,ranks:["Jeune","Bouch\xE9","Vieux","Grande r\xE9serve","L\xE9gendaire"],care:"Soutirer",careIcon:"barrel",careDone:"Cidre soutir\xE9"},wine:{name:"Vins",step:432e5,ranks:["Jeune","Bon","Vieux","Grand cru","L\xE9gendaire"],care:"Ouiller",careIcon:"barrel",careDone:"F\xFBts ouill\xE9s"},champagne:{name:"Champagnes",step:288e5,ranks:["Sur lattes","Brut","Mill\xE9sim\xE9","Grande cuv\xE9e","L\xE9gendaire"],care:"Remuer",careIcon:"riddle",careDone:"Bouteilles remu\xE9es"}},oa={cheese:"cheese",goatCheese:"cheese",beaufort:"cheese",tomme:"cheese",reblochon:"cheese",camembert:"cheese",bleu:"cheese",comte:"cheese",cider:" ltes de qualit\xE9."},{id:"animals",icon:["animal","chicken"],name:"Les animaux",lvl:2,view:"animals",text:"Touchez une b\xEAte pour ramasser sa production ou lui donner un repas\xA0; restez appuy\xE9 pour ouvrir sa fiche. Un c\xE2lin par jour les rend plus productifs. La mangeoire automatique les nourrit seule. Un pr\xE9 accueille 20 b\xEAtes\xA0: achetez-en d\u2019autres, et changez une b\xEAte de pr\xE9 depuis sa fiche. L\u2019\xE9table montre tout le troupeau en fiches."},{id:"orchard",icon:["item","apple"],name:"Le verger",lvl:11,view:"orchard",text:"Les arbres fruitiers ont leur verger, avec ses propres places. Un arbre grandit, puis fait tomber ses fruits \xE0 son pied\xA0: ramassez-les, sinon il attend et ses fruits pourrissent. Apr\xE8s une centaine de fruits il vieillit et ralentit, puis meurt\xA0: d\xE9bitez-le en bois et replantez. L\u2019hiver il dort \xE0 moiti\xE9, l\u2019automne il produit plus vite."},{id:"island",icon:["item","pineapple"],name:"L\u2019\xEEle",lvl:30,view:"island",text:"Au niveau 30, r\xE9parez le bac de Tiago (volet Village, carte \xAB\xA0L\u2019\xEEle\xA0\xBB). Sur l\u2019\xEEle, les cultures tropicales poussent sans arrosage et en toute saison\xA0: ananas, patate douce, fruit de la passion, manioc, gingembre, tiar\xE9. Son verger accueille bananiers, cocotiers, manguiers, papayers, citronniers verts, avocatiers, goyaviers, caf\xE9iers et litchis. Puis paillote, four des \xEEles, br\xFBlerie et rhumerie ouvrent quatre nouvelles machines."},{id:"workshop",icon:["machine","bakery"],name:"L\u2019atelier",lvl:3,view:"machines",text:"Chaque machine encha\xEEne plusieurs lots. Le bouton Boucle relance la derni\xE8re recette tant qu\u2019il y a les ingr\xE9dients."},{id:"barn",icon:["ui","barn"],name:"La grange",lvl:1,view:"farm",text:"Elle range vos produits. Pleine, elle bloque les r\xE9coltes\xA0: vendez, livrez ou agrandissez-la avec planches, clous et peinture. Touchez le compteur en haut."},{id:"orders",icon:["ui","scroll"],name:"Les commandes",lvl:1,view:"quests",text:"La meilleure source de pi\xE8ces et d\u2019exp\xE9rience. Touchez un produit manquant pour aller le produire. \xC9pinglez une commande pour la garder sous les yeux."},{id:"stall",icon:["ui","stall"],name:"L\u2019\xE9tal et le grossiste",lvl:1,view:"market",text:"L\u2019\xE9tal vend au prix que vous fixez, mais les clients prennent leur temps. Le grossiste ach\xE8te tout de suite, moins cher."},{id:"village",icon:["ui","village"],name:"Le village et le hameau",lvl:2,view:"quests",text:"Six chapitres de chantiers \xE0 r\xE9nover avec vos produits. Chaque b\xE2timent donne un bonus pour toujours\xA0: le train, la montgolfi\xE8re, le marchand, le commis\u2026"},{id:"friends",icon:["ui","heart"],name:"Les villageois",lvl:2,view:"quests",text:"Livrez leurs commandes et offrez-leur ce qu\u2019ils aiment (un cadeau par jour). L\u2019amiti\xE9 d\xE9bloque des recettes\xA0; \xE0 5 c\u0153urs, chacun vous confie son histoire."},{id:"train",icon:["ui","trainIcon"],name:"Train et montgolfi\xE8re",lvl:3,view:"quests",text:"De grosses livraisons bien pay\xE9es, qui reviennent r\xE9guli\xE8rement. Chaque cheval fait revenir le train plus t\xF4t."},{id:"neighbors",icon:["villager","hortense"],name:"Les fermes voisines",lvl:6,view:"quests",text:"Vos rivales du concours demandent parfois de l\u2019aide. Leur amiti\xE9 rapporte mat\xE9riaux rares et cadeaux."},{id:"contest",icon:["ui","podium"],name:"Concours et ligues",lvl:4,view:"quests",text:"Chaque semaine, tout ce que vous faites rapporte des points. Trois paliers \xE0 r\xE9clamer\xA0; le premier monte de ligue (bronze, argent, or, diamant)."},{id:"contract",icon:["ui","calendar"],name:"Contrats de saison",lvl:12,view:"quests",text:"Un client demande une grosse quantit\xE9 d\u2019un produit avant la fin de la saison. Livrez petit \xE0 petit\xA0: la r\xE9compense vaut le coup, avec des mat\xE9riaux rares en prime."},{id:"rare",icon:["ui","fair"],name:"\xC9v\xE9nements rares",lvl:10,view:"quests",text:"De temps en temps\xA0: foire aux bestiaux (animaux d\u2019exception), critique gastronomique (une note de 1 \xE0 5 \xE9toiles), nu\xE9e de papillons (r\xE9coltes dor\xE9es)."},{id:"incidents",icon:["ui","pest"],name:"Les impr\xE9vus",lvl:3,view:"farm",text:"Corbeau, pucerons, animal malade, acheteur press\xE9\xA0: r\xE9agissez vite. Un \xE9pouvantail et un nichoir \xE9loignent les corbeaux."},{id:"nature",icon:["item","wood"],name:"For\xEAt, mine et \xE9tang",lvl:3,view:"nature",text:"Bois et pierre pour construire, pierres pr\xE9cieuses pour la joaillerie, poissons pour la cuisine. Am\xE9liorez la hache et la pioche avec des outils."},{id:"skills",icon:["ui","skillbook"],name:"Les comp\xE9tences",lvl:2,view:"upgrades",text:"Un point par niveau, \xE0 placer dans l\u2019agriculture, l\u2019\xE9levage ou le commerce. Vous pouvez les redistribuer contre des pi\xE8ces."},{id:"mastery",icon:["ui","medalG"],name:"La ma\xEEtrise",lvl:3,view:"upgrades",text:"Produire beaucoup d\u2019un m\xEAme produit lui donne des \xE9toiles (bronze, argent, or)\xA0: +5\xA0% de prix par \xE9toile, et l\u2019or le rend 15\xA0% plus rapide."},{id:"house",icon:["ui","house"],name:"La maison et le commis",lvl:5,view:"farm",text:"Touchez la maison au-dessus du champ pour l\u2019agrandir (5 niveaux de bonus) et la personnaliser. Th\xE9o, le commis, arrive avec le pont du hameau."},{id:"book",icon:["ui","book"],name:"Le Livre de la ferme",lvl:1,view:"upgrades",text:"Collection, ma\xEEtrise, exploits, l\xE9gende et album photo. Touchez l\u2019\xE9toile de niveau pour voir ce que chaque niveau d\xE9bloque."},{id:"legend",icon:["ui","goldCow"],name:"Fin de partie",lvl:30,view:"upgrades",text:"Au niveau 40, l\u2019exp\xE9rience donne des \xE9toiles de renomm\xE9e. Le grand but\xA0: devenir une Ferme l\xE9gendaire. Vendre la ferme donne des rubans pour la suivante."},{id:"port",icon:["ui","boat"],name:"Le Port",lvl:34,view:"quests",text:"Chapitres 7 et 8\xA0: le phare ouvre la p\xEAche en mer, la cri\xE9e la conserverie, le quai le bateau de livraison. Brasserie et chocolaterie suivent."},{id:"alpine",icon:["ui","mountain"],name:"L'Alpage",lvl:40,view:"quests",text:"Chapitres 9 et 10\xA0: transhumance, fromagerie d\u2019alpage, g\xE9n\xE9pi, puis les saisons de la ferme et les fermes \xE0 th\xE8me au prestige."},{id:"seasons4",icon:["ui","trophy"],name:"Saisons de la ferme",lvl:40,view:"quests",text:"Toutes les 4 semaines, un th\xE8me\xA0: produisez ses produits pour franchir 5 paliers. Le dernier offre une d\xE9coration unique."},{id:"cave",icon:["ui","cave"],name:"La cave",lvl:20,view:"machines",text:"Onglet Atelier, puis Cave. Mettez fromages, cidres, vins et champagnes en cave. \xC0 chaque \xE9tape, ils peuvent bien vieillir (leur valeur grimpe), mal vieillir (ils tournent) ou se perdre. Soignez-les et gardez le climat entre 35 et 65."},{id:"auction",icon:["ui","gavel"],name:"Les ench\xE8res",lvl:20,view:"machines",text:"Sortez un lot de la cave, puis d\xE9posez-le \xE0 la prochaine vente avec un prix de r\xE9serve. Chaque ench\xE9risseur a ses go\xFBts et son budget. La grande vente du soir (19 h) attire les collectionneurs et propose des lots rares."},{id:"domaine",icon:["ui","grapes"],name:"Le Domaine",lvl:40,view:"quests",text:"Chapitres 11 et 12\xA0: le chai et le vin, la tonnellerie, la maison de l\u2019affineur, la salle des ventes, la cidrerie et la cray\xE8re du champagne."},{id:"engines",icon:["ui","harvester"],name:"Semoir et moissonneuse",lvl:13,view:"shop",text:"Au magasin. Le semoir plante toute une rang\xE9e d\u2019un seul geste\xA0; la moissonneuse r\xE9colte 35\xA0% de plus sur une rang\xE9e enti\xE8re d\u2019une m\xEAme culture."},{id:"holidays",icon:["ui","jackLantern"],name:"F\xEAtes de l\u2019ann\xE9e",lvl:3,view:"quests",text:"Halloween, No\xEBl et P\xE2ques, aux vraies dates\xA0: une recette du moment, un panier \xE0 remplir au village et une d\xE9coration unique \xE0 gagner."}],mc={station:{icon:["ui","flowers"],title:"Une station de recherche",text:"Au bout du chemin des vergers, Agathe et Victor rouvrent une station de recherche (volet Village, carte \xAB\xA0La station\xA0\xBB). Croisements de plantes, \xE9levage de s\xE9lection, et bient\xF4t vos propres vari\xE9t\xE9s\xA0!"},defis:{icon:["ui","cupGold"],title:"Les grands d\xE9fis",text:"Toutes les deux semaines, un villageois vous confie un grand d\xE9fi (volet Commandes). 4 \xE9tapes, \xE0 faire dans l\u2019ordre que vous voulez\xA0: 2 pour le bronze, 3 pour l\u2019argent, 4 pour l\u2019or. Les m\xE9dailles s\u2019exposent dans la salle des troph\xE9es (menu)."},genetics:{icon:["item","strawberry"],title:"Croiser, c\u2019est parier",text:"Chaque g\xE8ne a deux versions, dont une souvent cach\xE9e. Le labo montre les chances de chaque issue. Gardez les meilleures vari\xE9t\xE9s, recroisez-les avec elles-m\xEAmes, et fixez-les pour leur donner un nom. Les meilleurs ingr\xE9dients font des plats en argent ou en or."},isle:{icon:["item","pineapple"],title:"Une \xEEle au bout du bac",text:"Depuis le hameau, un vieux bac m\xE8ne \xE0 une \xEEle tropicale. R\xE9pare-le (volet Village, carte \xAB\xA0L\u2019\xEEle\xA0\xBB)\xA0: tu pourras y planter ananas, bananiers et cocotiers."},island:{icon:["item","banana"],title:"Les cultures de l\u2019\xEEle",text:"Sur l\u2019\xEEle, pas besoin d\u2019arroser\xA0: les pluies tropicales s\u2019en chargent, et tout est toujours de saison. \xAB\xA0Replanter\xA0\xBB remet sur chaque parcelle vide sa derni\xE8re culture."},orchard:{icon:["item","apple"],title:"Le verger",text:"Un arbre grandit, puis laisse tomber ses fruits \xE0 son pied\xA0: viens les ramasser avant qu\u2019ils ne pourrissent. Apr\xE8s une centaine de fruits il vieillit, puis meurt\xA0: il donne alors du bois, et tu replantes."},pasture:{icon:["ui","flowers"],title:"Un pr\xE9 tout plein",text:"Un pr\xE9 accueille 20 b\xEAtes. Ach\xE8te un nouveau pr\xE9 pour agrandir le troupeau, et d\xE9place tes animaux d\u2019un pr\xE9 \xE0 l\u2019autre depuis leur fiche."},machine:{icon:["ui","gear"],title:"Ta premi\xE8re machine",text:"Touche \xAB\xA0Produire\xA0\xBB pour choisir une recette. Une machine encha\xEEne jusqu'\xE0 4 lots, m\xEAme diff\xE9rents\xA0: remplis-la avant de partir\xA0!"},village:{icon:["ui","village"],title:"Le village a besoin de toi",text:"Dans l'onglet Village, volet \xAB\xA0Village\xA0\xBB, les habitants veulent r\xE9nover leurs b\xE2timents. Apporte-leur des produits\xA0: chaque chantier termin\xE9 d\xE9bloque une surprise."},barn:{icon:["ui","barn"],title:"La grange se remplit",text:"Quand elle est pleine, tu ne peux plus rien r\xE9colter. Livre des commandes, vends le surplus au march\xE9, ou agrandis-la en touchant le compteur en haut de l'\xE9cran."},rare:{icon:["item","plank"],title:"Un mat\xE9riau rare\xA0!",text:"Planches, clous et pots de peinture servent \xE0 agrandir la grange. On en trouve un peu partout\xA0: en r\xE9coltant, \xE0 l'atelier, dans les livraisons\u2026"},contest:{icon:["ui","podium"],title:"Le concours de la semaine",text:"Chaque semaine, les fermes de la r\xE9gion s\u2019affrontent. Tout ce que tu fais rapporte des points\xA0: r\xE9clame les trois paliers, et vise la premi\xE8re place\xA0!"},fete:{icon:["ui","trophy"],title:"C'est la f\xEAte\xA0!",text:"Chaque saison a sa f\xEAte, pendant une vingtaine de minutes. Remplis ses trois objectifs dans l'onglet Village pour remporter un troph\xE9e."},soil:{icon:["ui","soilWet"],title:"Le bon sol",text:"Les parcelles n'ont pas toutes le m\xEAme sol\xA0: humide, sec ou ombrag\xE9. Une culture plant\xE9e dans le sol qu'elle aime pousse plus vite et donne plus souvent de belles r\xE9coltes."},train:{icon:["ui","trainIcon"],title:"Le train est en gare",text:"Il reste une heure. Charge ses trois wagons\xA0: chacun est pay\xE9 tout de suite, et un train complet rapporte un bonus et un mat\xE9riau rare."},balloon:{icon:["ui","balloon"],title:"Une montgolfi\xE8re\xA0!",text:"Les clients de l'auberge passent une grosse commande, tr\xE8s bien pay\xE9e, avec deux mat\xE9riaux rares. Elle repart au bout d'une heure."},merchant:{icon:["ui","merchant"],title:"Le marchand ambulant",text:"Z\xE9phyr vend des mat\xE9riaux rares, des graines exotiques et des d\xE9corations introuvables ailleurs. Il ne reste que deux heures\xA0!"},crow:{icon:["ui","crow"],title:"Un corbeau\xA0!",text:"Il va picorer une culture\xA0: touche-le vite pour le chasser, tu gagneras quelques pi\xE8ces. Un nichoir prot\xE8ge les parcelles voisines, un \xE9pouvantail toute la ferme."},stall:{icon:["ui","stall"],title:"L'\xE9tal de la ferme",text:"Ici, vous fixez le prix. Au prix normal, un client passe en un quart d'heure environ\xA0; moins cher, il vient plus vite. Le grossiste, plus bas, ach\xE8te tout de suite mais paie bien moins."},neighbors:{icon:["ui","heart"],title:"Un voisin a besoin de vous",text:"Les fermes rivales du concours sont aussi vos voisines. Aidez-les (onglet Village, volet \xAB\xA0Village\xA0\xBB)\xA0: elles paient bien, offrent des mat\xE9riaux rares et des cadeaux en devenant vos amies."},aphids:{icon:["ui","pest"],title:"Des pucerons\xA0!",text:"Une culture est attaqu\xE9e et ne pousse plus. Touche-la vite pour chasser les pucerons, sinon elle sera perdue."},sick:{icon:["ui","sick"],title:"Un animal est malade",text:"Il ne produit plus. Reste appuy\xE9 sur lui au p\xE2turage pour ouvrir sa fiche, et appelle le v\xE9t\xE9rinaire. Sinon, il gu\xE9rira seul, mais lentement."},express:{icon:["ui","express"],title:"Un acheteur press\xE9",text:"Il paie le triple, mais il repart dans dix minutes. Sa commande est en haut du tableau des commandes."},house:{icon:["ui","house"],title:"Ta maison peut grandir",text:"Touche la maison au-dessus du champ. Chaque agrandissement donne un bonus pour toujours\xA0: grange, tableau des commandes, atelier, \xE9tal\u2026"},farmhand:{icon:["villager","theo"],title:"Th\xE9o, ton commis",text:"Th\xE9o s\u2019occupe des premi\xE8res parcelles du champ (encadr\xE9es)\xA0: il r\xE9colte, replante la m\xEAme culture et arrose, m\xEAme quand tu n\u2019es pas l\xE0. Forme-le depuis la maison pour qu\u2019il en fasse plus."},mastery:{icon:["ui","medalB"],title:"Premi\xE8re ma\xEEtrise\xA0!",text:"Plus tu produis un m\xEAme produit, plus tu le ma\xEEtrises\xA0: bronze, argent puis or. Chaque \xE9toile augmente son prix. Retrouve tout dans le Livre de la ferme (onglet Progr\xE8s)."},hamlet:{icon:["villager","jules"],title:"Le hameau oubli\xE9",text:"De l\u2019autre c\xF4t\xE9 de la rivi\xE8re, Jules et In\xE8s t\u2019attendent. Dans l\u2019onglet Village, passe sur la carte \xAB\xA0Le hameau\xA0\xBB pour voir leurs chantiers."},league:{icon:["ui","podium"],title:"Les ligues du concours",text:"Gagne le concours pour monter de ligue\xA0: bronze, argent, or, puis diamant. Les rivales y sont plus fortes, mais les r\xE9compenses bien plus grosses. Le dernier redescend."},storm:{icon:["ui","w_storm"],title:"Gare \xE0 l'orage",text:"Pendant l'orage, tout pousse plus vite, mais la foudre peut br\xFBler une culture. Un paratonnerre, pos\xE9 n'importe o\xF9 dans le champ, prot\xE8ge tout le champ."},album:{icon:["ui","camera"],title:"Ton premier souvenir",text:"\xC0 chaque grand moment, une photo rejoint l'album du Livre de la ferme (onglet Progr\xE8s). Tu peux la regarder et la partager."},rareEvent:{icon:["ui","fair"],title:"Un \xE9v\xE9nement rare\xA0!",text:"De temps en temps, quelque chose d\u2019exceptionnel se passe au village ou \xE0 la ferme. \xC7a ne dure pas\xA0: regardez le volet Village."},story:{icon:["ui","scroll"],title:"Une histoire commence",text:"\xC0 5 c\u0153urs, un villageois vous confie son histoire en trois \xE9tapes. Retrouvez-la sous sa fiche, dans le volet Village."},contract:{icon:["ui","calendar"],title:"Un contrat de saison",text:"Un client veut une grosse quantit\xE9 d\u2019un produit avant la fin de la saison. Apportez-le petit \xE0 petit depuis le volet Village."},seaNet:{icon:["ui","net"],title:"La p\xEAche en mer",
