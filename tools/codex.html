// Décompression gzip native du payload embarqué
async function loadPayload() {
  const bin = atob(DATA_GZ);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const ds = new DecompressionStream('gzip');
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  const text = await new Response(stream).text();
  return JSON.parse(text);
}

  const body = 'M27 4 L37 4 L37 16 Q46 22 46 30 L46 56 Q46 60 42 60 L22 60 Q18 60 18 56 L18 30 Q18 22 27 16Z';
  const aged = !!b.aged;
  const inner = SHADOW(32,61,15,2.4)
    + P(body, aged ? '#5a3a20' : '#7a4a1a')
    + F('M19.4 30 Q32 27 44.6 30 L44.6 56 Q44.6 58.6 42 58.6 L22 58.6 Q19.4 58.6 19.4 56Z', c, 0.92)
    + R(20, 34, 24, 18, 4, '#fffaf0', 1.6)

    + (ings.length > 1 ? ings.slice(1).map(([id], k) => C(23 + k * 18, 33, 3.6, '#fffaf0', 1.2) + subItem(id, 20 + k * 18, 30, 6)).join('') : '')

// ---- Moteur logique de la Brasserie d'Abbaye (src/systems/brewery.js) ----
function evalBrew(mode, baseKey, hop, ings, barrelId) {
  const A = DATA.abbey;
  const mead = mode === 'mead';
  const bd = mead
    ? { name: 'Hydromel', color: DATA.honeyCol[baseKey] || DATA.honeyCol.all, ...(A.meadBases[baseKey] || A.meadBases.all), mead: true, honey: baseKey }
    : { ...(A.malts[baseKey] || A.malts.maltBlond), mead: false };
  const ingFl = id => DATA.genetics.flavors[id] || A.brewExtra[id] || [0,0,0,0,0];
  const noteOf = v => v.indexOf(Math.max(...v));
  const det = k => (k === 0 ? 'le ' : 'l’') + A.notes[k];
  const cap = t => t[0].toUpperCase() + t.slice(1);
  const honeyDe = h => (DATA.honeys[h] ? ' ' + DATA.honeys[h].name.replace(/^Miel /, '') : '');

  const profile = [...bd.taste];
  profile[2] += mead ? 0 : hop;
  for (const [id, d] of ings) ingFl(id).forEach((v, k) => (profile[k] += v * d));

  const reasons = [];
  let stars = 0, classic = null;
  if (!ings.length) {
    reasons.push('Ajoutez au moins un ingrédient.');
  } else {
    const ip = [0,0,0,0,0];
    for (const [id, d] of ings) ingFl(id).forEach((v, k) => (ip[k] += v * d));
    const order = ip.map((v, k) => [v, k]).sort((x, y) => y[0] - x[0]);
    const [a, b] = [order[0][1], order[1][1]];
    let score = 0;
    if (order[1][0] >= order[0][0] * 0.3 && order[1][0] > 0) {
      const pair = A.pairs[`${Math.min(a,b)}-${Math.max(a,b)}`] || 0;
      if (pair > 0) reasons.push(`${cap(det(a))} et ${det(b)} vont bien ensemble.`);
      if (pair < 0) reasons.push(`${cap(det(a))} et ${det(b)} se battent.`);
      score += pair;
    } else reasons.push(`Une seule note domine : ${A.notes[a]}.`);

    const who = mead ? `L’hydromel${honeyDe(baseKey)}` : `Une ${bd.name.toLowerCase()}`;
    if (!bd.likes.length) reasons.push(`${who} ${bd.text}.`);
    else if (bd.likes.includes(a)) { score += 1; reasons.push(`${who} ${bd.text}.`); }
    else reasons.push(`${who} ${bd.text} : essayez ${mead ? 'un autre miel' : 'un autre malt'}.`);

    const effHop = mead ? 0 : hop;
    if (effHop === 3 && a === 0) { score -= 1; reasons.push('Trop de houblon pour une bière douce.'); }
    if (effHop === 1 && (a === 2 || a === 3)) reasons.push('Un houblon plus fort irait bien à ce goût.');
    if (effHop === 3 && (a === 2 || a === 3)) { score += 1; reasons.push('Le houblon fort relève ce goût.'); }

    const bases = ings.map(([id]) => id);
    classic = mead ? A.meadClassics.find(c => c.any.some(id => bases.includes(id))) : A.classics.find(c => c.ings.every(id => bases.includes(id)));
    if (classic && !mead) {
      reasons.push(classic.text);
      stars = Math.max(0, Math.min(3, score + 2));
    } else {
      if (classic) { reasons.push(classic.text); score += 1; }
      const tops = ings.map(([id]) => noteOf(ingFl(id)));
      let clash = false;
      for (let x = 0; x < tops.length; x++)
        for (let y = x + 1; y < tops.length; y++)
          if ((A.pairs[`${Math.min(tops[x],tops[y])}-${Math.max(tops[x],tops[y])}`] || 0) < 0) clash = true;
      if (clash) { score -= 1; reasons.push('Deux ingrédients ne s’entendent pas.'); }
      else if (ings.length > 1 && new Set(tops).size > 1) { score += 1; reasons.push('Un beau mélange, riche et équilibré.'); }
      stars = Math.max(0, Math.min(3, score));
    }
  }

  // Nom & coût & valeur
  const ingVal = id => id in A.brewExtra ? Math.round((DATA.items[id]?.sell || 0) * 0.2) : (DATA.items[id]?.sell || 0);
  const honeyMult = mead && DATA.honeys[baseKey] ? DATA.honeys[baseKey].mult : 1;
  const costMap = mead
    ? { honey: A.mead.honeyPerBrew }
    : { [baseKey]: A.abbey.maltPerBrew, hop: hop * A.abbey.hopPerDose };
  for (const [id, d] of ings) costMap[id] = (costMap[id] || 0) + d * A.abbey.ingPerDose;
  let totalCost = 0;
  for (const [id, n] of Object.entries(costMap)) {
    const u = id === 'honey' && mead ? Math.round((DATA.items.honey?.sell || 120) * honeyMult) : ingVal(id);
    totalCost += u * n;
  }
  const time = mead ? A.mead.baseTime + A.mead.perIng * ings.length : A.abbey.baseTime + A.abbey.perIng * ings.length;
  const baseValue = ings.length ? Math.round((((A.abbey.price * totalCost + 0.1 * time) / A.abbey.bottles) * A.abbey.harmony[stars]) / 5) * 5 : 0;
  const barrel = barrelId ? A.barrels[barrelId] : null;
  const agedMaxValue = barrel ? Math.round((baseValue * barrel.mult * A.cellar.mult[3]) / 5) * 5 : 0;

  let name = '';
  if (ings.length) {
    const list = [...ings].sort((x, y) => y[1] - x[1]).map(([id]) => (DATA.items[id]?.name || id).toLowerCase());
    const what = list.length === 1 ? list[0] : list.length === 2 ? `${list[0]}-${list[1]}` : `${list.slice(0,-1).join(', ')} et ${list[list.length-1]}`;
    name = mead ? `${classic ? classic.name : 'Hydromel'}${honeyDe(baseKey)} ${what}` : `${bd.name} ${what}`;
  }
  return { mead, bd, profile, stars, reasons, classic, costMap, time, baseValue, barrel, agedMaxValue, name };
}

function inspectSprite(cat, id) {

      <button class="btn-sec px-2.5 py-1 rounded cursor-pointer" onclick="inspectProduct('${esc(id)}')">Voir la fiche produit →</button>
    </div>`;
  } else if (cat === 'plants') {
    const it = DATA.items[id];
    title = it ? `${it.name} (${it.seedName || ''})` : id;
    svgStr = plantSvg(id, 2);
    const stages = it?.type === 'tree' ? ['Jeune arbre', 'En fleurs', 'Avec fruits'] : ['Pousse', 'Jeune plant', 'Prêt à récolter'];

      </div>`).join('')}</div></div>`;
  } else if (cat === 'animals') {
    const a = DATA.animals[id];
    title = a ? a.name : id;
    svgStr = animSvg(id);
    const fs = DATA.genetics.speciesFeatures[id] || [];
    if (fs.length) {
      extra = `<div class="mt-3 text-xs muted">Traits morphologiques disponibles dans le Générateur Génétique : <b>${fs.map(f => DATA.genetics.features[f].name).join(', ')}</b>.</div>`;
    }

    svgStr = machSvg(id);
    if (m) extra = `<div class="mt-3 text-xs muted">Débloqué au niveau <b>${m.reqLvl}</b></div>`;

      title = `Bâtiment · ${id}`;
      svgStr = svgWrap(SPR.buildings[id] || '', '0 -20 100 110');

    title = id;

  }

  openModal(`
    <div class="flex flex-col sm:flex-row gap-4 items-center sm:items-start">

function getSpriteEntries(cat) {
  if (cat === 'items') return Object.keys(SPR.items).map(id => ({ id, label: DATA.items[id]?.name || id, svg: () => itemSvg(id) }));
  if (cat === 'plants') return Object.keys(SPR.plants).map(id => ({ id, label: DATA.items[id]?.name || id, svg: () => plantSvg(id, 2) }));
  if (cat === 'animals') return Object.keys(SPR.animals).map(id => ({ id, label: DATA.animals[id]?.name || id, svg: () => animSvg(id) }));
  if (cat === 'machines') return Object.keys(SPR.machines).map(id => ({ id, label: DATA.machines[id]?.name || id, svg: () => machSvg(id) }));
  if (cat === 'ui') return Object.keys(SPR.ui).map(id => ({ id, label: id, svg: () => uiSvg(id) }));
  if (cat === 'people') return Object.keys(SPR.people).map(id => ({ id, label: DATA.villagers[id] || id, svg: () => svgWrap(SPR.people[id]) }));
  if (cat === 'buildings') return [
    ...SPR.farmhouses.map((_, i) => ({ id: 'farmhouse_' + i, label: 'Ferme niv. ' + i, svg: () => svgWrap(SPR.farmhouses[i]) })),
    ...Object.keys(SPR.buildings).map(id => ({ id, label: id, svg: () => svgWrap(SPR.buildings[id], '0 -20 100 110') })),
  ];
  if (cat === 'vehicles') return Object.keys(SPR.vehicles).map(id => ({ id, label: id, svg: () => SPR.vehicles[id] }));
  return [];
}

function renderSprites() {
  const cats = [
    ['items', 'Objets', Object.keys(SPR.items).length],
    ['plants', 'Plantes & Arbres', Object.keys(SPR.plants).length],
    ['animals', 'Animaux', Object.keys(SPR.animals).length],
    ['machines', 'Machines', Object.keys(SPR.machines).length],
    ['ui', 'Icônes UI', Object.keys(SPR.ui).length],
    ['people', 'Personnages', Object.keys(SPR.people).length],
    ['buildings', 'Bâtiments', Object.keys(SPR.buildings).length + SPR.farmhouses.length],
    ['vehicles', 'Véhicules', Object.keys(SPR.vehicles).length],

  const q = norm(S.sprQ);
  const all = getSpriteEntries(S.sprCat);
  const filtered = q ? all.filter(e => norm(e.label).includes(q) || norm(e.id).includes(q)) : all;

  $('#main').innerHTML = `

          <input id="spr-q" type="search" value="${esc(S.sprQ)}" placeholder="Rechercher un sprite (nom ou ID)…" class="surf rounded-lg px-3 py-1.5 text-sm w-full sm:w-64 outline-none" />
        </div>
        <div class="text-xs muted">${fmt(filtered.length)} sprite${filtered.length > 1 ? 's' : ''} trouvé${filtered.length > 1 ? 's' : ''} — cliquez sur un sprite pour l’agrandir ou copier son SVG.</div>
      </div>

      <div class="grid grid-cols-3 sm:grid-cols-5 md:grid-cols-7 lg:grid-cols-9 gap-2.5">
        ${shown.map(e => `<button onclick="inspectSprite('${S.sprCat}','${esc(e.id)}')" class="card rounded-xl p-2 flex flex-col items-center gap-1 hover:shadow-md transition cursor-pointer text-center">
          <div class="w-14 h-14 spr-box">${e.svg()}</div>
          <div class="text-xs font-medium leading-tight line-clamp-2 w-full">${esc(e.label)}</div>
          <div class="text-[10px] muted font-mono truncate w-full">${esc(e.id)}</div>
        </button>`).join('')}
      </div>

      ${filtered.length > shown.length ? `<div class="text-center pt-2">
        <button id="spr-more" class="btn-sec px-4 py-2 rounded-lg text-sm cursor-pointer">Afficher plus (${shown.length} / ${filtered.length})</button>
      </div>` : ''}
    </div>
  `;

  $$('#spr-cats button').forEach(b => b.onclick = () => { S.sprCat = b.dataset.cat; S.sprLimit = 120; renderSprites(); });
  $('#spr-q').oninput = e => { S.sprQ = e.target.value; S.sprLimit = 120; renderSprites(); $('#spr-q').focus(); $('#spr-q').setSelectionRange(S.sprQ.length, S.sprQ.length); };
  const more = $('#spr-more');
  if (more) more.onclick = () => { S.sprLimit += 180; renderSprites(); };
}

function renderProducts() {
  const q = norm(S.prodQ);
  const machList = Object.values(DATA.machines).sort((a, b) => a.reqLvl - b.reqLvl || a.name.localeCompare(b.name, 'fr'));
  const rawCount = Object.values(DATA.items).filter(it => !DATA.recipes[it.id]).length;
  const modes = [
    ['machines', `Par usine / atelier (${machList.length})`],
    ['raw', `Matières brutes (${rawCount})`],
    ['special', 'Crus de miel, Cave & Paquets'],
  ];

  let body = '';
  if (S.prodMode === 'machines') {
    const byM = {};
    for (const r of Object.values(DATA.recipes)) {
      if (r.lvl > S.prodMaxLvl) continue;
      const it = DATA.items[r.id];
      if (!it) continue;
      if (q) {
        const hitName = norm(it.name).includes(q) || norm(r.id).includes(q);
        const hitIng = Object.keys(r.ing).some(k => norm(DATA.items[k]?.name || k).includes(q));
        if (!hitName && !hitIng) continue;
      }
      (byM[r.machine] ||= []).push(r);
    }
    const visibleMachs = machList.filter(m => (S.prodMach === 'all' || m.id === S.prodMach) && (byM[m.id]?.length));
    const totalShown = visibleMachs.reduce((a, m) => a + byM[m.id].length, 0);
    const sortRec = (a, b) => S.prodSort === 'price' ? (DATA.items[b.id]?.sell || 0) - (DATA.items[a.id]?.sell || 0)
      : S.prodSort === 'name' ? DATA.items[a.id].name.localeCompare(DATA.items[b.id].name, 'fr')
      : a.lvl - b.lvl || DATA.items[a.id].name.localeCompare(DATA.items[b.id].name, 'fr');

    body = `<div class="text-xs muted mb-3">${totalShown} recettes affichées sur ${visibleMachs.length} atelier${visibleMachs.length > 1 ? 's' : ''}. Cliquez sur un produit pour voir sa fiche complète et où il est utilisé.</div>
    <div class="space-y-4">
      ${visibleMachs.map(m => {
        const list = byM[m.id].sort(sortRec);
        return `<section class="card rounded-xl p-4">
          <div class="flex items-center gap-3 pb-3 mb-3 border-b border-[var(--border,#e2d8c5)]">

          </div>

            ${list.map(r => {
              const it = DATA.items[r.id];
              const cave = DATA.cave.items[r.id];
              return `<button onclick="inspectProduct('${esc(r.id)}')" class="surf hover:shadow rounded-xl p-2.5 flex items-center gap-2.5 text-left cursor-pointer transition">

                <div class="flex-1 min-w-0">
                  <div class="flex items-center justify-between gap-1">
                    <span class="font-semibold text-xs sm:text-sm truncate">${esc(it.name)}</span>
                    ${it.sell ? `<span class="text-xs font-mono shrink-0">${fmt(it.sell)} p.</span>` : ''}
                  </div>
                  <div class="text-[11px] muted">Niv. ${r.lvl} · ${fmtDur(r.time)}${r.out > 1 ? ` · ×${r.out}` : ''}${cave ? ' · Cave' : ''}</div>
                  <div class="flex flex-wrap gap-1 mt-1">
                    ${Object.entries(r.ing).map(([k, n]) => `<span class="card rounded px-1.5 py-0.5 text-[11px] flex items-center gap-1" title="${esc(DATA.items[k]?.name || k)}">
                      <span class="w-3.5 h-3.5 spr-box inline-block">${itemSvg(k)}</span>${n}

                  </div>
                </div>

      }).join('') || '<div class="card rounded-xl p-8 text-center muted text-sm">Aucune recette ne correspond aux filtres.</div>'}

  } else if (S.prodMode === 'raw') {
    const rawItems = Object.values(DATA.items).filter(i => i.type !== 'artisan');
    const match = i => (!q || norm(i.name).includes(q) || norm(i.id).includes(q)) && (!i.reqLvl || i.reqLvl <= S.prodMaxLvl);
    const groups = [
      ['Cultures — Ferme (plein champ)', rawItems.filter(i => i.type === 'crop' && !i.ghOnly && !i.island)],
      ['Cultures — Serre uniquement', rawItems.filter(i => i.type === 'crop' && i.ghOnly)],
      ['Cultures — Île, Oasis, Grand Nord & Asie', rawItems.filter(i => i.type === 'crop' && i.island)],
      ['Arbres — Verger (ferme)', rawItems.filter(i => i.type === 'tree' && !i.island)],
      ['Arbres — Île, Oasis, Grand Nord & Asie', rawItems.filter(i => i.type === 'tree' && i.island)],
      ['Élevage & Produits spécifiques', rawItems.filter(i => i.type === 'product' && !i.sea)],
      ['Pêche (étang, lagon & pêche en mer)', rawItems.filter(i => i.type === 'fish' || i.type === 'junk' || (i.type === 'product' && i.sea))],
      ['Minerais, gemmes, lingots, bois & matériaux', rawItems.filter(i => ['ore','gem','ingot','material','rare','misc'].includes(i.type))],

    body = `<div class="space-y-4">
      ${groups.map(([title, list]) => {
        const items = list.filter(match).sort((a,b) => (a.reqLvl||0)-(b.reqLvl||0) || a.name.localeCompare(b.name,'fr'));
        if (!items.length) return '';
        return `<section class="card rounded-xl p-4">
          <h3 class="font-bold text-sm mb-3">${title} <span class="muted font-normal">(${items.length})</span></h3>
          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-2">
            ${items.map(i => `<button onclick="inspectProduct('${esc(i.id)}')" class="surf hover:shadow rounded-lg p-2 flex items-center gap-2 text-left cursor-pointer">
              <div class="w-10 h-10 spr-box shrink-0">${itemSvg(i.id)}</div>
              <div class="min-w-0 text-xs">
                <div class="font-semibold truncate">${esc(i.name)}</div>
                <div class="muted">${i.reqLvl ? `Niv. ${i.reqLvl}` : i.oasis ? 'Oasis' : i.nord ? 'Grand Nord' : i.asie ? 'Terres d’Asie' : i.sea ? 'Mer' : i.type}${i.sell ? ` · ${fmt(i.sell)} p.` : ''}</div>
              </div>
            </button>`).join('')}
          </div>
        </section>`;
      }).join('')}

  } else {
    const byFam = {};
    for (const [id, fam] of Object.entries(DATA.cave.items)) (byFam[fam] ||= []).push(id);
    body = `<div class="space-y-4">
      <section class="card rounded-xl p-4">
        <h3 class="font-bold text-sm mb-3">Rucher — 23 crus de miel floraux</h3>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2">
          ${Object.entries(DATA.honeys).map(([k, h]) => `<div class="surf rounded-lg p-2.5 flex items-center gap-2.5">
            <span class="w-7 h-7 rounded-full shrink-0 border border-black/20" style="background:${DATA.honeyCol[k] || '#e8a825'}"></span>

                : `<button onclick="inspectProduct('${esc(id)}')" class="card rounded px-2 py-1 text-xs flex items-center gap-1 cursor-pointer hover:opacity-80"><span class="w-4 h-4 spr-box inline-block">${itemSvg(id)}</span>${esc(DATA.items[id]?.name || id)}</button>`

          </div>`).join('')}

      </section>
      <section class="card rounded-xl p-4">
        <h3 class="font-bold text-sm mb-3">Paquets &amp; assortiments de la Maison (${DATA.packs.length})</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5">
          ${DATA.packs.map(p => `<div class="surf rounded-lg p-2.5 flex items-center gap-2.5">
            <div class="w-10 h-10 spr-box shrink-0">${p.item ? itemSvg(p.item) : itemSvg('crate')}</div>
            <div class="text-xs"><div class="font-semibold">${esc(p.name)} ${p.bonus ? `<span class="muted">(+${Math.round(p.bonus*100)}%)</span>` : ''}</div><div class="muted">${esc(p.blurb)}</div></div>
          </div>`).join('')}
        </div>
      </section>
    </div>`;
  }

  $('#main').innerHTML = `
    <div class="space-y-4">
      <div class="card rounded-xl p-4 space-y-3">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div class="flex flex-wrap gap-1.5" id="prod-modes">
            ${modes.map(([k, lbl]) => `<button data-m="${k}" class="pill ${S.prodMode === k ? 'active' : ''} text-xs px-3 py-1.5 rounded-full cursor-pointer">${lbl}</button>`).join('')}
          </div>
          ${S.prodMode !== 'special' ? `<input id="prod-q" type="search" value="${esc(S.prodQ)}" placeholder="Nom de produit ou d’ingrédient…" class="surf rounded-lg px-3 py-1.5 text-sm w-full sm:w-64 outline-none" />` : ''}
        </div>
        ${S.prodMode === 'machines' ? `<div class="flex flex-wrap items-center gap-3 text-xs">
          <label class="flex items-center gap-1.5">Usine :
            <select id="prod-mach" class="surf rounded-lg px-2 py-1">
              <option value="all">Toutes les ${machList.length} usines</option>
              ${machList.map(m => `<option value="${m.id}" ${S.prodMach === m.id ? 'selected' : ''}>${esc(m.name)} (niv. ${m.reqLvl})</option>`).join('')}
            </select>
          </label>
          <label class="flex items-center gap-1.5">Tri :
            <select id="prod-sort" class="surf rounded-lg px-2 py-1">
              <option value="lvl" ${S.prodSort === 'lvl' ? 'selected' : ''}>Niveau</option>

          </label>

  const pq = $('#prod-q');
  if (pq) pq.oninput = e => { S.prodQ = e.target.value; renderProducts(); $('#prod-q').focus(); $('#prod-q').setSelectionRange(S.prodQ.length, S.prodQ.length); };
  const pm = $('#prod-mach');
  if (pm) pm.onchange = e => { S.prodMach = e.target.value; renderProducts(); };
  const ps = $('#prod-sort');
  if (ps) ps.onchange = e => { S.prodSort = e.target.value; renderProducts(); };
  const pl = $('#prod-lvl');
  if (pl) pl.oninput = e => { S.prodMaxLvl = +e.target.value; renderProducts(); };
}

// ---- ONGLET 3 : GÉNÉRATEUR GÉNÉTIQUE (+ ROBES DU HARAS) ----
function currentBaseSvg() {
  if (S.genMode === 'plants') return S.genStage === 'item' ? itemSvg(S.genId) : plantSvg(S.genId, +S.genStage);
  if (S.genMode === 'animals') {
    const fs = DATA.genetics.speciesFeatures[S.genId] || [];
    const code = fs.map(f => S.genFeat[f] || 0).join('');
    const key = code && !/^0*$/.test(code) ? `${S.genId}~${code}` : S.genId;
    return animSvg(key);
  }
  return horseSvg({ robe: S.horseRobe, marks: S.horseMarks, stage: S.horseStage, shoes: S.horseShoes, coat: S.horseCoat, gearSet: S.horseGear });
}

function renderGenetics() {
  const LKS = DATA.genetics.looks;
  const plantsList = Object.values(DATA.items).filter(i => i.type === 'crop' || i.type === 'tree').sort((a,b) => a.name.localeCompare(b.name,'fr'));
  const animList = Object.values(DATA.animals).sort((a,b) => a.name.localeCompare(b.name,'fr'));
  if (S.genMode === 'plants' && !DATA.items[S.genId]) S.genId = 'strawberry';
  if (S.genMode === 'animals' && !DATA.animals[S.genId]) S.genId = 'cow';
  if (S.genMode === 'horses' && !S.horseGenome) {
    S.horseParentA = founderCoat(); S.horseParentB = founderCoat();
    S.horseGenome = crossCoat(S.horseParentA, S.horseParentB);
  }

  const baseSvg = currentBaseSvg();
  const lookObj = { size: S.genSize, color: S.genColor, pattern: S.genPattern, finish: S.genFinish, morph: S.genMorph, halo: S.genHalo };
  const wrapped = genWrap(baseSvg, lookObj, S.genMode === 'plants');
  const fs = S.genMode === 'animals' ? (DATA.genetics.speciesFeatures[S.genId] || []) : [];

  // Planche de comparaison
  let cmpCards = [];
  if (S.genCompare === 'color') {
    cmpCards = LKS.color.map((name, i) => ({ name, active: S.genColor === i, click: `setGen('genColor',${i})`, html: genWrap(baseSvg, { ...lookObj, color: i }, S.genMode === 'plants') }));
  } else if (S.genCompare === 'pattern') {
    cmpCards = LKS.pattern.map((name, i) => ({ name, active: S.genPattern === i, click: `setGen('genPattern',${i})`, html: genWrap(baseSvg, { ...lookObj, pattern: i }, S.genMode === 'plants') }));
  } else if (S.genCompare === 'finish') {
    cmpCards = LKS.finish.map((name, i) => ({ name, active: S.genFinish === i, click: `setGen('genFinish',${i})`, html: genWrap(baseSvg, { ...lookObj, finish: i }, S.genMode === 'plants') }));
  } else if (S.genCompare === 'morph' && S.genMode === 'plants' && LKS.morph) {
    cmpCards = LKS.morph.map((name, i) => ({ name, active: S.genMorph === i, click: `setGen('genMorph',${i})`, html: genWrap(baseSvg, { ...lookObj, morph: i }, true) }));
  } else if (S.genCompare === 'size') {
    cmpCards = LKS.size.map((name, i) => ({ name, active: S.genSize === i, click: `setGen('genSize',${i})`, html: genWrap(baseSvg, { ...lookObj, size: i }, S.genMode === 'plants') }));
  } else if (S.genCompare === 'robes' && S.genMode === 'horses') {
    cmpCards = Object.entries(DATA.haras.coat.robes).map(([k, name]) => ({
      name, active: S.horseRobe === k, click: `setGen('horseRobe','${k}')`,
      html: genWrap(horseSvg({ robe: k, marks: S.horseMarks, stage: S.horseStage, shoes: S.horseShoes, coat: S.horseCoat, gearSet: S.horseGear }), lookObj, false),
    }));
  }

  const traitsList = S.genMode === 'plants' ? DATA.genetics.plantTraits : DATA.genetics.animalTraits;
  const speciesFlavors = S.genMode === 'plants' ? DATA.genetics.flavors[S.genId] : null;
  const totalCombos = LKS.size.length * LKS.color.length * LKS.pattern.length * LKS.finish.length * (S.genMode === 'plants' && LKS.morph ? LKS.morph.length : 1) * 2;

  $('#main').innerHTML = `
    <div class="space-y-4">
      <div class="card rounded-xl p-4 flex flex-wrap items-center justify-between gap-2">
        <div class="flex flex-wrap gap-1.5" id="gen-modes">
          <button data-gm="plants" class="pill ${S.genMode === 'plants' ? 'active' : ''} text-xs px-3 py-1.5 rounded-full cursor-pointer">Plantes &amp; Arbres (${plantsList.length})</button>
          <button data-gm="animals" class="pill ${S.genMode === 'animals' ? 'active' : ''} text-xs px-3 py-1.5 rounded-full cursor-pointer">Animaux (${animList.length})</button>
          <button data-gm="horses" class="pill ${S.genMode === 'horses' ? 'active' : ''} text-xs px-3 py-1.5 rounded-full cursor-pointer">Haras — Robes de chevaux (11 robes × 8 marques)</button>
        </div>

          <div class="w-56 h-56 checker rounded-2xl border border-[var(--border,#e2d8c5)] p-6 flex items-center justify-center overflow-hidden">

            </div>

              <span class="w-14 capitalize muted">${n}</span>
              <div class="flex-1 h-2 surf rounded-full overflow-hidden"><div class="h-full rounded-full" style="width:${Math.min(100, speciesFlavors[i]*20)}%;background:${DATA.abbey.noteCol[i]}"></div></div>

          ${S.genMode === 'horses' ? `<div class="w-full mt-4 pt-3 border-t border-[var(--border,#e2d8c5)] space-y-2">

              <select id="gen-species" class="surf rounded-lg px-2.5 py-1.5 text-sm w-full mt-1 font-normal">
                ${plantsList.map(i => `<option value="${i.id}" ${S.genId === i.id ? 'selected' : ''}>${esc(i.name)} (${i.type === 'tree' ? 'arbre' : 'culture'})</option>`).join('')}

            <div class="text-xs font-semibold">Affichage
              <div class="flex flex-wrap gap-1 mt-1 font-normal">
                ${[['2','Plante mûre'],['1','Jeune'],['0','Pousse'],['item','Récolte']].map(([v,l]) => `<button data-st="${v}" class="pill ${String(S.genStage) === v ? 'active' : ''} text-xs px-2.5 py-1 rounded-lg cursor-pointer">${l}</button>`).join('')}
              </div>
            </div>
          </div>` : ''}

          ${S.genMode === 'animals' ? `<div class="space-y-3">
            <label class="text-xs font-semibold block">Espèce animale
              <select id="gen-species" class="surf rounded-lg px-2.5 py-1.5 text-sm w-full mt-1 font-normal">
                ${animList.map(a => `<option value="${a.id}" ${S.genId === a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}
              </select>
            </label>
            ${fs.length ? `<div class="surf rounded-lg p-3 space-y-2">

              <div class="flex flex-wrap gap-3">
                ${fs.map(fk => `<div class="text-xs"><span class="muted mr-1.5">${DATA.genetics.features[fk].name} :</span>
                  ${DATA.genetics.features[fk].list.map((lbl, idx) => `<button data-fk="${fk}" data-fv="${idx}" class="pill ${(S.genFeat[fk]||0) === idx ? 'active' : ''} px-2 py-0.5 rounded-md cursor-pointer mr-1">${lbl}</button>`).join('')}

          ${S.genMode === 'horses' ? `<div class="space-y-3 surf rounded-xl p-3">
            <div class="text-xs font-semibold">Robe génétique (11)</div>
            <div class="flex flex-wrap gap-1.5">

              </div>

  window.setGen = (k, v) => { S[k] = v; renderGenetics(); };
  $$('#gen-modes button').forEach(b => b.onclick = () => {

  $$('[data-st]').forEach(b => b.onclick = () => { S.genStage = b.dataset.st; renderGenetics(); });
  $$('[data-fk]').forEach(b => b.onclick = () => { S.genFeat[b.dataset.fk] = +b.dataset.fv; renderGenetics(); });
  $$('[data-gc]').forEach(b => b.onclick = () => { S.genColor = +b.dataset.gc; renderGenetics(); });
  $$('[data-gp]').forEach(b => b.onclick = () => { S.genPattern = +b.dataset.gp; renderGenetics(); });
  $$('[data-gf]').forEach(b => b.onclick = () => { S.genFinish = +b.dataset.gf; renderGenetics(); });
  $$('[data-gmorph]').forEach(b => b.onclick = () => { S.genMorph = +b.dataset.gmorph; renderGenetics(); });
  $$('[data-gs]').forEach(b => b.onclick = () => { S.genSize = +b.dataset.gs; renderGenetics(); });

  $$('[data-hst]').forEach(b => b.onclick = () => { S.horseStage = +b.dataset.hst; renderGenetics(); });
  $$('[data-hsh]').forEach(b => b.onclick = () => { S.horseShoes = +b.dataset.hsh; renderGenetics(); });
  const hg = $('#horse-gear'); if (hg) hg.onchange = e => { S.horseGear = e.target.value; renderGenetics(); };
  const hc = $('#horse-coat'); if (hc) hc.onclick = () => { S.horseCoat = S.horseCoat ? 0 : 1; renderGenetics(); };
  const hb = $('#horse-breed');
  if (hb) hb.onclick = () => {
    S.horseParentA = founderCoat(); S.horseParentB = founderCoat();
    S.horseGenome = crossCoat(S.horseParentA, S.horseParentB);
    S.horseRobe = robeOfCoat(S.horseGenome);
    S.horseMarks = marksOfCoat(S.horseGenome);
    renderGenetics();
  };

  $('#gen-rand').onclick = () => {
    S.genSize = Math.floor(Math.random() * LKS.size.length);
    S.genColor = Math.floor(Math.random() * LKS.color.length);
    S.genPattern = Math.floor(Math.random() * LKS.pattern.length);
    S.genFinish = Math.floor(Math.random() * LKS.finish.length);
    S.genMorph = LKS.morph ? Math.floor(Math.random() * LKS.morph.length) : 0;
    S.genHalo = Math.random() < 0.25;
    if (S.genMode === 'animals') {
      for (const fk of fs) S.genFeat[fk] = Math.floor(Math.random() * DATA.genetics.features[fk].list.length);
    } else if (S.genMode === 'horses') {
      S.horseGenome = founderCoat();
      S.horseRobe = robeOfCoat(S.horseGenome);
      S.horseMarks = marksOfCoat(S.horseGenome);
    }
    renderGenetics();
  };
  $('#gen-reset').onclick = () => {
    S.genSize = 1; S.genColor = 0; S.genPattern = 0; S.genFinish = 0; S.genMorph = 0; S.genHalo = false; S.genFeat = {};
    S.horseRobe = 'bai'; S.horseMarks = []; S.horseStage = 2; S.horseShoes = 0; S.horseCoat = 0; S.horseGear = '';
    renderGenetics();
  };
}

            ${S.brewIngs.length ? `<div class="flex flex-wrap gap-2">

            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-1.5 max-h-64 overflow-y-auto pr-1">
              ${filteredIngs.map(id => {
                const picked = S.brewIngs.some(([x]) => x === id);
                const fl = DATA.genetics.flavors[id] || A.brewExtra[id] || [0,0,0,0,0];
                const top = fl.indexOf(Math.max(...fl));
                return `<button data-add="${id}" ${picked || S.brewIngs.length >= maxSlots ? 'disabled' : ''} class="${picked ? 'opacity-45' : 'hover:shadow cursor-pointer'} surf rounded-lg p-1.5 flex items-center gap-1.5 text-left">

        else if (cid === 'pumpkinAle') { S.brewMalt = 'maltAmber'; S.brewHop = 1; }
      }

      if (c) S.brewIngs = [[c.any[0], 2]];

  const k = habLookOf(id);

  const sk = s => s.replace(/SKIN/g, skin);
  const face =
    E(18, 31, 2.8, 3.8, skin, 0, 2) +
    E(46, 31, 2.8, 3.8, skin, 0, 2) +
    L('M17.6 29.5 Q16.6 31 17.8 32.6 M46.4 29.5 Q47.4 31 46.2 32.6', 1.1, habHex(skin, 0.8)) +
    C(32, 30, 14, skin) +
    F('M40 38 Q45 33 45.6 27 Q47 36 39 42 Q36 43.5 33 43.8 Q37 42 40 38Z', habHex(skin, 0.92), 0.7) +
    habEyesArt(k.eyes, H.eyes[k.eyeColor]) +
    habNoseArt(k.nose) +
    (k.beard === 2 || k.beard === 3 || k.beard === 9 ? '' : P('M28.2 36.2 Q32 40.6 35.8 36.2 Q32 37.4 28.2 36.2Z', '#b5523f', 1.6)) +
    FC(23.5, 34.2, 2.7, '#f49a8f', 0.45) +
    FC(40.5, 34.2, 2.7, '#f49a8f', 0.45);
  const smileUnderBeard = k.beard === 2 || k.beard === 3 || k.beard === 9 ? L('M29 39.4 Q32 41.4 35 39.4', 1.5, '#7a3a2a') : '';
  return (
    sk(habHairBack(k.hair, hair)) +
    sk(habShirtArt(k.shirt, k.collar)) +
    sk(face) +
    sk(habBeardArt(k.beard, hair)) +
    smileUnderBeard +
    habExtraArt(k.extra) +
    sk(habHairFront(k.hair, hair)) +
    habGlassesArt(k.glasses) +
    habHatArt(k.hat)
  );
}
const habSvg = id => svgWrap(habitantInner(id), '0 0 64 64');

function rollCampersBatch() {
  const C0 = DATA.camping || { names: ['Camille', 'Lucien', 'Éloïse', 'Hector', 'Nina', 'Oscar', 'Rosalie', 'Bastien'], origins: ['de Bretagne', 'de Provence', 'de Savoie', 'du Québec'], profiles: ['Randonneur', 'Gourmet', 'Artiste', 'Pêcheur'] };
  const used = new Set();
  const list = [];
  for (let i = 0; i < 8; i++) {
    const seed = Math.floor(Math.random() * 1e9);
    const woman = Math.random() < 0.5;
    const old = Math.random() < 0.2;
    const id = habRandomId(seed, { [woman ? 'female' : 'male']: true, ...(old ? { old: true } : {}), ...(S.charSeason ? { season: S.charSeason } : {}) });
    const avail = C0.names.filter(n => !used.has(n));
    const name = avail.length ? avail[Math.floor(Math.random() * avail.length)] : C0.names[i % C0.names.length];
    used.add(name);
    const origin = C0.origins[Math.floor(Math.random() * C0.origins.length)];
    const profile = C0.profiles[Math.floor(Math.random() * C0.profiles.length)];
    list.push({ id, name, origin, profile });
  }
  S.charCampers = list;
}

function renderCharacters() {
  const H = habMeta();
  if (!isHabId(S.charId)) S.charId = 'h122000102120';
  if (!S.charCampers) rollCampersBatch();
  const look = habLookOf(S.charId);
  const svgStr = habSvg(S.charId);

  const colorTraits = [
    ['skin', 'Teint', H.skins],
    ['hairColor', 'Couleur des cheveux', H.hairs],
    ['eyeColor', 'Couleur des yeux', H.eyes],
    ['shirt', 'Couleur du vêtement', H.shirts],
  ];
  const shapeTraits = ['hair', 'hat', 'collar', 'extra', 'beard', 'eyes', 'glasses', 'nose'];
  if (!shapeTraits.includes(S.charTrait)) S.charTrait = 'hair';
  const totalParts = H.traits.reduce((a, t) => a + H.count[t], 0);
  const curTrait = S.charTrait;
  const curLabels = H.labels[curTrait] || [];
  const seasons = [['', 'Toutes'], ['printemps', '🌸 Printemps'], ['ete', '☀️ Été'], ['automne', '🍂 Automne'], ['hiver', '❄️ Hiver']];

  $('#main').innerHTML = `
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
      <div class="lg:col-span-5 space-y-4">
        <div class="card rounded-xl p-5">
          <div class="flex items-center justify-between gap-2 mb-3">
            <div>
              <h2 class="text-base font-bold">Fabrique d’habitants</h2>
              <p class="text-xs muted">${totalParts} éléments graphiques · 8 841 milliards de visages</p>
            </div>
          </div>

          <div class="flex flex-col items-center gap-3">
            <div class="w-44 h-44 rounded-full surf border-2 flex items-center justify-center p-2 shadow-sm overflow-hidden" style="border-color:var(--border)">
              <div class="w-40 h-40">${svgStr}</div>
            </div>
            <div class="flex items-center gap-3">
              <div class="flex flex-col items-center gap-1"><div class="w-12 h-12 rounded-full surf border overflow-hidden p-0.5">${svgStr}</div><span class="text-[10px] muted">Menu</span></div>
              <div class="flex flex-col items-center gap-1"><div class="w-9 h-9 rounded-full surf border overflow-hidden">${svgStr}</div><span class="text-[10px] muted">Camping</span></div>
              <div class="flex flex-col items-center gap-1"><div class="w-6 h-6 rounded-full surf border overflow-hidden">${svgStr}</div><span class="text-[10px] muted">Puce</span></div>
            </div>
          </div>

          <div class="mt-4 flex flex-wrap gap-1.5 justify-center">
            <button data-hab-rand="any" class="btn-pri rounded-lg px-3 py-1.5 text-xs cursor-pointer">🎲 Aléatoire</button>
            <button data-hab-rand="female" class="btn-sec rounded-lg px-2.5 py-1.5 text-xs cursor-pointer">👩 Féminin</button>
            <button data-hab-rand="male" class="btn-sec rounded-lg px-2.5 py-1.5 text-xs cursor-pointer">👨 Masculin</button>
            <button data-hab-rand="old" class="btn-sec rounded-lg px-2.5 py-1.5 text-xs cursor-pointer">🧓 Âgé</button>
          </div>

          <div class="mt-4 pt-3 border-t space-y-2">
            <div class="flex items-center gap-2">
              <label for="hab-code" class="text-xs muted shrink-0">Code ID</label>
              <input id="hab-code" type="text" value="${esc(S.charId)}" maxlength="13" spellcheck="false" class="surf border rounded-lg px-2.5 py-1 text-xs font-mono flex-1 min-w-0">
              <button id="hab-copy-id" class="btn-sec rounded-lg px-2.5 py-1 text-xs cursor-pointer">Copier</button>
            </div>
            <div class="flex flex-wrap gap-2">
              <button id="hab-copy-svg" class="btn-sec rounded-lg px-2.5 py-1.5 text-xs cursor-pointer flex-1">Copier SVG</button>
              <button id="hab-dl-svg" class="btn-sec rounded-lg px-2.5 py-1.5 text-xs cursor-pointer flex-1">Télécharger .svg</button>
            </div>
          </div>
        </div>

        <div class="card rounded-xl p-4 space-y-3">
          <div class="flex items-center justify-between gap-2">
            <div>
              <h3 class="font-bold text-sm">Fournée du camping</h3>
              <p class="text-[11px] muted">Clique un campeur pour le charger dans l’éditeur</p>
            </div>
            <button id="hab-campers-roll" class="btn-sec rounded-lg px-2.5 py-1 text-xs cursor-pointer">🎲 Nouveau tirage</button>
          </div>
          <div class="flex flex-wrap gap-1">
            ${seasons.map(([k, lbl]) => `<button data-hab-season="${k}" class="pill ${(S.charSeason || '') === k ? 'active' : ''} px-2 py-0.5 rounded-lg text-[11px] cursor-pointer">${lbl}</button>`).join('')}
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-2 gap-2">
            ${S.charCampers.map(c => `
              <button data-hab-load="${c.id}" class="flex items-center gap-2 p-2 rounded-lg border text-left cursor-pointer surf ${S.charId === c.id ? 'border-amber-500 ring-2 ring-amber-500/40' : ''}">
                <div class="w-10 h-10 rounded-full overflow-hidden shrink-0 border" style="background:var(--background,#f6f2e9)">${habSvg(c.id)}</div>
                <div class="min-w-0 flex-1">
                  <div class="text-xs font-semibold truncate">${esc(c.name)}</div>
                  <div class="text-[10px] muted truncate">${esc(c.origin)}</div>
                  <div class="text-[10px] muted truncate">${esc(c.profile)}</div>
                </div>
              </button>`).join('')}
          </div>
        </div>
      </div>

      <div class="lg:col-span-7 space-y-4">
        <div class="card rounded-xl p-4 space-y-3">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <h3 class="font-bold text-sm">Galerie visuelle des sprites</h3>
            <div class="flex items-center gap-1">
              <button data-hab-step="${curTrait}:-1" class="btn-sec rounded-md px-2 py-0.5 text-xs cursor-pointer" title="Précédent">‹</button>
              <span class="text-xs font-semibold px-1">${esc(H.names[curTrait])} : ${esc(curLabels[look[curTrait]] || '')} (${look[curTrait] + 1}/${H.count[curTrait]})</span>
              <button data-hab-step="${curTrait}:1" class="btn-sec rounded-md px-2 py-0.5 text-xs cursor-pointer" title="Suivant">›</button>
            </div>
          </div>

          <div class="flex flex-wrap gap-1.5">
            ${shapeTraits.map(t => `
              <button data-hab-tab="${t}" class="pill ${curTrait === t ? 'active' : ''} px-2.5 py-1 rounded-lg text-xs cursor-pointer">${esc(H.names[t])} <span class="opacity-75">(${H.count[t]})</span></button>`).join('')}
          </div>

          <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-4 lg:grid-cols-5 gap-2">
            ${curLabels.map((lbl, idx) => {
              const previewLook = { ...look, [curTrait]: idx };
              if (curTrait === 'hair' && previewLook.hat !== 0) previewLook.hat = 0;
              const pid = habIdOf(previewLook);
              const active = look[curTrait] === idx;
              return `<button data-hab-set="${curTrait}:${idx}" class="surf rounded-xl p-2 border flex flex-col items-center gap-1 cursor-pointer hover:shadow transition ${active ? 'border-amber-500 ring-2 ring-amber-500/40' : ''}">
                <div class="w-14 h-14 rounded-full overflow-hidden border" style="background:var(--background,#f6f2e9)">${habSvg(pid)}</div>
                <span class="text-[11px] font-medium text-center leading-tight line-clamp-2">${esc(lbl)}</span>
              </button>`;
            }).join('')}
          </div>
        </div>

        <div class="card rounded-xl p-4 space-y-3">
          <h3 class="font-bold text-sm">Palettes de couleurs (${H.skins.length + H.hairs.length + H.eyes.length + H.shirts.length} teintes)</h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            ${colorTraits.map(([t, label, swatches]) => `
              <div class="surf rounded-xl p-3 border">
                <div class="flex items-center justify-between text-xs mb-2">
                  <span class="font-semibold">${label}</span>
                  <span class="muted font-mono">${look[t] + 1}/${swatches.length}</span>
                </div>
                <div class="flex flex-wrap gap-1.5">
                  ${swatches.map((col, idx) => `
                    <button data-hab-set="${t}:${idx}" title="${label} ${idx + 1} (${col})" class="w-7 h-7 rounded-full border-2 cursor-pointer ${look[t] === idx ? 'ring-2 ring-amber-500' : ''}" style="background:${col};border-color:${look[t] === idx ? '#3a2618' : 'rgba(58,38,24,0.35)'}"></button>`).join('')}
                </div>
              </div>`).join('')}
          </div>
        </div>
      </div>
    </div>
  `;

  $$('[data-hab-tab]').forEach(b => b.onclick = () => { S.charTrait = b.dataset.habTab; renderCharacters(); });
  $$('[data-hab-season]').forEach(b => b.onclick = () => { S.charSeason = b.dataset.habSeason; rollCampersBatch(); renderCharacters(); });
  $$('[data-hab-set]').forEach(b => b.onclick = () => {
    const [t, v] = b.dataset.habSet.split(':');
    const next = habLookOf(S.charId);
    next[t] = +v;
    S.charId = habIdOf(next);
    renderCharacters();
  });
  $$('[data-hab-step]').forEach(b => b.onclick = () => {
    const [t, d] = b.dataset.habStep.split(':');
    const next = habLookOf(S.charId);
    next[t] = (next[t] + +d + H.count[t]) % H.count[t];
    S.charId = habIdOf(next);
    renderCharacters();
  });
  $$('[data-hab-rand]').forEach(b => b.onclick = () => {
    const m = b.dataset.habRand;
    const seed = Math.floor(Math.random() * 1e9);
    const o = m === 'female' ? { female: true } : m === 'male' ? { male: true } : m === 'old' ? { old: true } : {};
    S.charId = habRandomId(seed, o);
    renderCharacters();
  });
  $$('[data-hab-load]').forEach(b => b.onclick = () => {
    S.charId = b.dataset.habLoad;
    renderCharacters();
  });
  $('#hab-campers-roll').onclick = () => { rollCampersBatch(); renderCharacters(); };
  $('#hab-copy-id').onclick = () => copyText(S.charId, `Code ${S.charId} copié !`);
  $('#hab-copy-svg').onclick = () => copyText(svgStr, 'SVG copié !');
  $('#hab-dl-svg').onclick = () => {
    const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `meuh-personnage-${S.charId}.svg`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast('SVG téléchargé !');
  };
  const codeIn = $('#hab-code');
  if (codeIn) codeIn.oninput = e => {
    const val = e.target.value.trim().toLowerCase();
    if (isHabId(val)) { S.charId = val; renderCharacters(); $('#hab-code').focus(); }
  };
}

function renderActiveTab() {
  $$('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === S.tab));
  if (S.tab === 'sprites') renderSprites();
  else if (S.tab === 'products') renderProducts();
  else if (S.tab === 'genetics') renderGenetics();
  else if (S.tab === 'perfume') renderPerfumery();
  else if (S.tab === 'people') renderCharacters();
  else renderBrewery();
}

// ---- Boot ----
loadPayload().then(payload => {
  SPR = payload.sprites;
  DATA = payload.data;
  USED_IN = {};
  for (const r of Object.values(DATA.recipes)) {
    for (const k of Object.keys(r.ing)) (USED_IN[k] ||= []).push(r.id);
  }
  $('#hdr-logo').innerHTML = animSvg('cow');
  $('#hdr-ver').textContent = 'v' + DATA.version;
  const totalSpr = Object.keys(SPR.items).length + Object.keys(SPR.animals).length + Object.keys(SPR.machines).length + Object.keys(SPR.ui).length + Object.keys(SPR.people).length + Object.keys(SPR.buildings).length + SPR.farmhouses.length + Object.keys(SPR.vehicles).length;
  $('#hdr-stats').textContent = `${fmt(Object.keys(DATA.items).length)} produits · ${fmt(totalSpr)} sprites · ${Object.keys(DATA.machines).length} ateliers`;
  $$('#tabs button').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; renderActiveTab(); });
  const applyTheme = dark => {
    document.documentElement.classList.toggle('dark', dark);
    $('#theme-btn').textContent = dark ? '☀️' : '🌙';
  };
  const savedTheme = (() => { try { return localStorage.getItem('meuh-codex-theme'); } catch { return null; } })();
  applyTheme(savedTheme ? savedTheme === 'dark' : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  $('#theme-btn').onclick = () => {
    const next = !document.documentElement.classList.contains('dark');
    applyTheme(next);
    try { localStorage.setItem('meuh-codex-theme', next ? 'dark' : 'light'); } catch {}
  };
  $('#loading').classList.add('hidden');
  $('#app').classList.remove('hidden');
  renderActiveTab();
}).catch(err => {
  $('#loading').textContent = 'Erreur de chargement : ' + err.message;
});
</script>
</body>
</html>
