ple:30}],["Le jour de la course, crini\xE8res tress\xE9es et carottes pour la victoire.",{horsehair:12,carrot:40}]],end:"Victoire\xA0! La coupe tr\xF4ne au haras, avec ton nom grav\xE9 dessous."},ines:{title:"L\u2019exposition d\u2019In\xE8s",steps:[["On m\u2019invite \xE0 exposer en ville\xA0! Je commence par une s\xE9rie de bols.",{clayBowl:10}],["Il me faut quelques vases pour le centre de la salle.",{vase:4}],["La pi\xE8ce ma\xEEtresse\xA0: des vases peints, en bleu profond.",{paintedVase:2,blueDye:4}]],end:"Tout est vendu le premier soir\xA0! Le plus beau vase t\u2019attend chez toi."},morgane:{title:"Le tr\xE9sor du capitaine",steps:[["Mon grand-p\xE8re a cach\xE9 un tr\xE9sor sur une \xEEle. Pour la travers\xE9e, il faut un bateau solide.",{beam:20,nail:20}],["Il faut des provisions pour l\u2019\xE9quipage\xA0: du pain et des conserves.",{bread:20,cannedSardines:4}],["La carte parle d\u2019un coffre sous un rocher. Une pioche, des outils, et on y va\xA0!",{tools:6,lobster:2}]],end:"Le coffre \xE9tait plein de vieilles cartes marines. Pour moi, c\u2019est le plus beau des tr\xE9sors. Merci, matelot\xA0!"},yann:{title:"Le concours de la cri\xE9e",steps:[["Chaque ann\xE9e, la cri\xE9e \xE9lit le plus bel \xE9tal. Commen\xE7ons par des crevettes bien fra\xEEches.",{shrimp:12}],["Il me faut des bars de ligne, les rois de l\u2019\xE9tal.",{seabass:6}],["Et pour impressionner le jury\xA0: une bouillabaisse comme \xE0 Marseille\xA0!",{bouillabaisse:3}]],end:"Premier prix de la cri\xE9e\xA0! Le jury n\u2019a jamais vu un \xE9tal pareil."},bruno:{title:"La grande mont\xE9e",steps:[["Cette ann\xE9e, je monte le plus beau troupeau de la vall\xE9e. Il faut des forces aux b\xEAtes.",{feed:120}],["L\xE0-haut, il fait froid la nuit. De la laine pour les couvertures du berger.",{wool:30}],["La f\xEAte des estives approche\xA0: du beaufort pour toute la vall\xE9e.",{beaufort:4,bread:10}]],end:"Le troupeau est redescendu fier et gras. Toute la vall\xE9e en parle encore\xA0!"},l E9, l\u2019automne il produit plus vite."},{id:"island",icon:["item","pineapple"],name:"L\u2019\xEEle",lvl:30,view:"island",text:"Au niveau 30, r\xE9parez le bac de Tiago (volet Village, carte \xAB\xA0L\u2019\xEEle\xA0\xBB). Sur l\u2019\xEEle, les cultures tropicales poussent sans arrosage et en toute saison\xA0: ananas, patate douce, fruit de la passion, manioc, gingembre, tiar\xE9. Son verger accueille bananiers, cocotiers, manguiers, papayers, citronniers verts, avocatiers, goyaviers, caf\xE9iers et litchis. Puis paillote, four des \xEEles, br\xFBlerie et rhumerie ouvrent quatre nouvelles machines."},{id:"workshop",icon:["machine","bakery"],name:"L\u2019atelier",lvl:3,view:"machines",text:"Chaque machine encha\xEEne plusieurs lots. Le bouton Boucle relance la derni\xE8re recette tant qu\u2019il y a les ingr\xE9dients."},{id:"barn",icon:["ui","barn"],name:"La grange",lvl:1,view:"farm",text:"Elle range vos produits. Pleine, elle bloque les r\xE9coltes\xA0: vendez, livrez ou agrandissez-la avec planches, clous et peinture. Touchez le compteur en haut."},{id:"orders",icon:["ui","scroll"],name:"Les commandes",lvl:1,view:"quests",text:"La meilleure source de pi\xE8ces et d\u2019exp\xE9rience. Touchez un produit manquant pour aller le produire. \xC9pinglez une commande pour la garder sous les yeux."},{id:"stall",icon:["ui","stall"],name:"L\u2019\xE9tal et le grossiste",lvl:1,view:"market",text:"L\u2019\xE9tal vend au prix que vous fixez, mais les clients prennent leur temps. Le grossiste ach\xE8te tout de suite, moins cher."},{id:"village",icon:["ui","village"],name:"Le village et le hameau",lvl:2,view:"quests",text:"Six chapitres de chantiers \xE0 r\xE9nover avec vos produits. Chaque b\xE2timent donne un bonus pour toujours\xA0: le train, la montgolfi\xE8re, le marchand, le commis\u2026"},{id:"friends",icon:["ui","heart"],name:"Les villageois",lvl:2,view:"quests",text:"Livrez leurs commandes et offrez-leur ce qu\u2019ils aiment (un cadeau par jour). L\u2019amiti\xE9 d\xE9bloque des recettes\xA0; \xE0 5 c\u0153urs, chacun vous confie son histoire."},{id:"train",icon:["ui","trainIcon"],name:"Train et montgolfi\xE8re",lvl:3,view:"quests",text:"De grosses livraisons bien pay\xE9es, qui reviennent r\xE9guli\xE8rement. Chaque cheval fait revenir le train plus t\xF4t."},{id:"neighbors",icon:["villager","hortense"],name:"Les fermes voisines",lvl:6,view:"quests",text:"Vos rivales du concours demandent parfois de l\u2019aide. Leur amiti\xE9 rapporte mat\xE9riaux rares et cadeaux."},{id:"contest",icon:["ui","podium"],name:"Concours et ligues",lvl:4,view:"quests",text:"Chaque semaine, tout ce que vous faites rapporte des points. Trois paliers \xE0 r\xE9clamer\xA0; le premier monte de ligue (bronze, argent, or, diamant)."},{id:"contract",icon:["ui","calendar"],name:"Contrats de saison",lvl:12,view:"quests",text:"Un client demande une grosse quantit\xE9 d\u2019un produit avant la fin de la saison. Livrez petit \xE0 petit\xA0: la r\xE9compense vaut le coup, avec des mat\xE9riaux rares en prime."},{id:"rare",icon:["ui","fair"],name:"\xC9v\xE9nements rares",lvl:10,view:"quests",text:"De temps en temps\xA0: foire aux bestiaux (animaux d\u2019exception), critique gastronomique (une note de 1 \xE0 5 \xE9toiles), nu\xE9e de papillons (r\xE9coltes dor\xE9es)."},{id:"incidents",icon:["ui","pest"],name:"Les impr\xE9vus",lvl:3,view:"farm",text:"Corbeau, pucerons, animal malade, acheteur press\xE9\xA0: r\xE9agissez vite. Un \xE9pouvantail et un nichoir \xE9loignent les corbeaux."},{id:"nature",icon:["item","wood"],name:"For\xEAt, mine et \xE9tang",lvl:3,view:"nature",text:"Bois et pierre pour construire, pierres pr\xE9cieuses pour la joaillerie, poissons pour la cuisine. Am\xE9liorez la hache et la pioche avec des outils."},{id:"skills",icon:["ui","skillbook"],name:"Les comp\xE9tences",lvl:2,view:"upgrades",text:"Un point par niveau, \xE0 placer dans l\u2019agriculture, l\u2019\xE9levage ou le commerce. Vous pouvez les redistribuer contre des pi\xE8ces."},{id:"mastery",icon:["ui","medalG"],name:"La ma\xEEtrise",lvl:3,view:"upgrades",text:"Produire beaucoup d\u2019un m\xEAme produit lui donne des \xE9toiles (bronze, argent, or)\xA0: +5\xA0% de prix par \xE9toile, et l\u2019or le rend 15\xA0% plus rapide."},{id:"house",icon:["ui","house"],name:"La maison et le commis",lvl:5,view:"farm",text:"Touchez la maison au-dessus du champ pour l\u2019agrandir (5 niveaux de bonus) et la personnaliser. Th\xE9o, le commis, arrive avec le pont du hameau."},{id:"book",icon:["ui","book"],name:"Le Livre de la ferme",lvl:1,view:"upgrades",text:"Collection, ma\xEEtrise, exploits, l\xE9gende et album photo. Touchez l\u2019\xE9toile de niveau pour voir ce que chaque niveau d\xE9bloque."},{id:"legend",icon:["ui","goldCow"],name:"Fin de partie",lvl:30,view:"upgrades",text:"Au niveau 40, l\u2019exp\xE9rience donne des \xE9toiles de renomm\xE9e. Le grand but\xA0: devenir une Ferme l\xE9gendaire. Vendre la ferme donne des rubans pour la suivante."},{id:"port",icon:["ui","boat"],name:"Le Port",lvl:34,view:"quests",text:"Chapitres 7 et 8\xA0: le phare ouvre la p\xEAche en mer, la cri\xE9e la conserverie, le quai le bateau de livraison. Brasserie et chocolaterie suivent."},{id:"alpine",icon:["ui","mountain"],name:"L'Alpage",lvl:40,view:"quests",text:"Chapitres 9 et 10\xA0: transhumance, fromagerie d\u2019alpage, g\xE9n\xE9pi, puis les saisons de la ferme et les fermes \xE0 th\xE8me au prestige."},{id:"seasons4",icon:["ui","trophy"],name:"Saisons de la ferme",lvl:40,view:"quests",text:"Toutes les 4 semaines, un th\xE8me\xA0: produisez ses produits pour franchir 5 paliers. Le dernier offre une d\xE9coration unique."},{id:"cave",icon:["ui","cave"],name:"La cave",lvl:20,view:"machines",text:"Onglet Atelier, puis Cave. Mettez fromages, cidres, vins et champagnes en cave. \xC0 chaque \xE9tape, ils peuvent bien vieillir (leur valeur grimpe), mal vieillir (ils tournent) ou se perdre. Soignez-les et gardez le climat entre 35 et 65."},{id:"auction",icon:["ui","gavel"],name:"Les ench\xE8res",lvl:20,view:"machines",text:"Sortez un lot de la cave, puis d\xE9posez-le \xE0 la prochaine vente avec un prix de r\xE9serve. Chaque ench\xE9risseur a ses go\xFBts et son budget. La grande vente du soir (19 h) attire les collectionneurs et propose des lots rares."},{id:"domaine",icon:["ui","grapes"],name:"Le Domaine",lvl:40,view:"quests",text:"Chapitres 11 et 12\xA0: le chai et le vin, la tonnellerie, la maison de l\u2019affineur, la salle des ventes, la cidrerie et la cray\xE8re du champagne."},{id:"engines",icon:["ui","harvester"],name:"Semoir et moissonneuse",lvl:13,view:"shop",text:"Au magasin. Le semoir plante toute une rang\xE9e d\u2019un seul geste\xA0; la moissonneuse r\xE9colte 35\xA0% de plus sur une rang\xE9e enti\xE8re d\u2019une m\xEAme culture."},{id:"holidays",icon:["ui","jackLantern"],name:"F\xEAtes de l\u2019ann\xE9e",lvl:3,view:"quests",text:"Halloween, No\xEBl et P\xE2ques, aux vraies dates\xA0: une recette du moment, un panier \xE0 remplir au village et une d\xE9coration unique \xE0 gagner."}],wl={station:{icon:["ui","flowers"],title:"Une station de recherche",text:"Au bout du chemin des vergers, Agathe et Victor rouvrent une station de recherche (volet Village, carte \xAB\xA0La station\xA0\xBB). Croisements de plantes, \xE9levage de s\xE9lection, et bient\xF4t vos propres vari\xE9t\xE9s\xA0!"},genetics:{icon:["item","strawberry"],title:"Croiser, c\u2019est parier",text:"Chaque g\xE8ne a deux versions, dont une souvent cach\xE9e. Le labo montre les chances de chaque issue. Gardez les meilleures vari\xE9t\xE9s, recroisez-les avec elles-m\xEAmes, et fixez-les pour leur donner un nom. Les meilleurs ingr\xE9dients font des plats en argent ou en or."},isle:{icon:["item","pineapple"],title:"Une \xEEle au bout du bac",text:"Depuis le hameau, un vieux bac m\xE8ne \xE0 une \xEEle tropicale. R\xE9pare-le (volet Village, carte \xAB\xA0L\u2019\xEEle\xA0\xBB)\xA0: tu pourras y planter ananas, bananiers et cocotiers."},island:{icon:["item","banana"],title:"Les cultures de l\u2019\xEEle",text:"Sur l\u2019\xEEle, pas besoin d\u2019arroser\xA0: les pluies tropicales s\u2019en chargent, et tout est toujours de saison. \xAB\xA0Replanter\xA0\xBB remet sur chaque parcelle vide sa derni\xE8re culture."},orchard:{icon:["item","apple"],title:"Le verger",text:"Un arbre grandit, puis laisse tomber ses fruits \xE0 son pied\xA0: viens les ramasser avant qu\u2019ils ne pourrissent. Apr\xE8s une centaine de fruits il vieillit, puis meurt\xA0: il donne alors du bois, et tu replantes."},pasture:{icon:["ui","flowers"],title:"Un pr\xE9 tout plein",text:"Un pr\xE9 accueille 20 b\xEAtes. Ach\xE8te un nouveau pr\xE9 pour agrandir le troupeau, et d\xE9place tes animaux d\u2019un pr\xE9 \xE0 l\u2019autre depuis leur fiche."},machine:{icon:["ui","gear"],title:"Ta premi\xE8re machine",text:"Touche \xAB\xA0Produire\xA0\xBB pour choisir une recette. Une machine encha\xEEne jusqu'\xE0 4 lots, m\xEAme diff\xE9rents\xA0: remplis-la avant de partir\xA0!"},village:{icon:["ui","village"],title:"Le village a besoin de toi",text:"Dans l'onglet Village, volet \xAB\xA0Village\xA0\xBB, les habitants veulent r\xE9nover leurs b\xE2timents. Apporte-leur des produits\xA0: chaque chantier termin\xE9 d\xE9bloque une surprise."},barn:{icon:["ui","barn"],title:"La grange se remplit",text:"Quand elle est pleine, tu ne peux plus rien r\xE9colter. Livre des commandes, vends le surplus au march\xE9, ou agrandis-la en touchant le compteur en haut de l'\xE9cran."},rare:{icon:["item","plank"],title:"Un mat\xE9riau rare\xA0!",text:"Planches, clous et pots de peinture servent \xE0 agrandir la grange. On en trouve un peu partout\xA0: en r\xE9coltant, \xE0 l'atelier, dans les livraisons\u2026"},contest:{icon:["ui","podium"],title:"Le concours de la semaine",text:"Chaque semaine, les fermes de la r\xE9gion s\u2019affrontent. Tout ce que tu fais rapporte des points\xA0: r\xE9clame les trois paliers, et vise la premi\xE8re place\xA0!"},fete:{icon:["ui","trophy"],title:"C'est la f\xEAte\xA0!",text:"Chaque saison a sa f\xEAte, pendant une vingtaine de minutes. Remplis ses trois objectifs dans l'onglet Village pour remporter un troph\xE9e."},soil:{icon:["ui","soilWet"],title:"Le bon sol",text:"Les parcelles n'ont pas toutes le m\xEAme sol\xA0: humide, sec ou ombrag\xE9. Une culture plant\xE9e dans le sol qu'elle aime pousse plus vite et donne plus souvent de belles r\xE9coltes."},train:{icon:["ui","trainIcon"],title:"Le train est en gare",text:"Il reste une heure. Charge ses trois wagons\xA0: chacun est pay\xE9 tout de suite, et un train complet rapporte un bonus et un mat\xE9riau rare."},balloon:{icon:["ui","balloon"],title:"Une montgolfi\xE8re\xA0!",text:"Les clients de l'auberge passent une grosse commande, tr\xE8s bien pay\xE9e, avec deux mat\xE9riaux rares. Elle repart au bout d'une heure."},merchant:{icon:["ui","merchant"],title:"Le marchand ambulant",text:"Z\xE9phyr vend des mat\xE9riaux rares, des graines exotiques et des d\xE9corations introuvables ailleurs. Il ne reste que deux heures\xA0!"},crow:{icon:["ui","crow"],title:"Un corbeau\xA0!",text:"Il va picorer une culture\xA0: touche-le vite pour le chasser, tu gagneras quelques pi\xE8ces. Un nichoir prot\xE8ge les parcelles voisines, un \xE9pouvantail toute la ferme."},stall:{icon:["ui","stall"],title:"L'\xE9tal de la ferme",text:"Ici, vous fixez le prix. Au prix normal, un client passe en un quart d'heure environ\xA0; moins cher, il vient plus vite. Le grossiste, plus bas, ach\xE8te tout de suite mais paie bien moins."},neighbors:{icon:["ui","heart"],title:"Un voisin a besoin de vous",text:"Les fermes rivales du concours sont aussi vos voisines. Aidez-les (onglet Village, volet \xAB\xA0Village\xA0\xBB)\xA0: elles paient bien, offrent des mat\xE9riaux rares et des cadeaux en devenant vos amies."},aphids:{icon:["ui","pest"],title:"Des pucerons\xA0!",text:"Une culture est attaqu\xE9e et ne pousse plus. Touche-la vite pour chasser les pucerons, sinon ell
