<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#A8D46F">
<title>Meuh · la nouvelle ferme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root {
    --ink: #2b2118;
    --ink-soft: #5c4a3a;
    --cream: #fff8ec;
    --paper: #f1e4c8;
    --grass: #a8d46f;
    --bocage: #4e9a3f;
    --ble: #f2b33d;
    --brique: #c4501f;
    --terre: #a8754a;
    --eglantine: #e8708f;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #8fbf57; overflow: hidden; }
body { font-family: 'Nunito', sans-serif; color: var(--ink); display: flex; justify-content: center; user-select: none; -webkit-user-select: none; }
button { font-family: inherit; cursor: pointer; color: var(--ink); }
.stage { position: relative; width: 100%; max-width: 480px; height: 100%; overflow: hidden; background: var(--grass); }
#world { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#world.drag { cursor: grabbing; }
.f { font-family: 'Fredoka', sans-serif; }

/* animations du monde */
.sway { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 2.4s ease-in-out infinite; }
@keyframes sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
.blades { transform-box: fill-box; transform-origin: 50% 50%; animation: spin 6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.bob { animation: bob 1.6s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.peck { transform-box: fill-box; transform-origin: 30% 80%; animation: peck 2.2s ease-in-out infinite; }
@keyframes peck { 0%, 70%, 100% { transform: rotate(0); } 80% { transform: rotate(24deg); } 90% { transform: rotate(0); } }
.cloud { animation: cloud 38s linear infinite; }
.cloud.b { animation-duration: 52s; animation-delay: -20s; }
@keyframes cloud { from { transform: translateX(-420px); } to { transform: translateX(760px); } }
.shine { animation: shine 3s ease-in-out infinite; }
@keyframes shine { 0%, 100% { opacity: .2; } 50% { opacity: .9; } }
.smoke { animation: smoke 3s ease-out infinite; }
.smoke.b { animation-delay: -1.5s; }
@keyframes smoke { from { transform: translate(0, 0) scale(.6); opacity: .8; } to { transform: translate(6px, -26px) scale(1.4); opacity: 0; } }
.tile { cursor: pointer; }
.pop { transform-box: fill-box; transform-origin: 50% 100%; animation: pop .35s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { from { transform: scale(.2); } to { transform: scale(1); } }

/* le haut */
.hud { position: absolute; top: max(14px, env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; align-items: center; gap: 8px; pointer-events: none; }
.hud > * { pointer-events: auto; }
.me { position: relative; width: 52px; height: 52px; border-radius: 50%; border: 3px solid var(--ink); background: #f6e7c8; padding: 0; flex-shrink: 0; }
.me .lvl { position: absolute; bottom: -6px; right: -6px; min-width: 26px; height: 26px; border-radius: 13px; background: var(--ble); border: 2.5px solid var(--ink); font: 700 13px/21px 'Fredoka', sans-serif; text-align: center; padding: 0 4px; }
.mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.pills { display: flex; gap: 6px; }
.pill { flex: 1; min-width: 0; height: 32px; border-radius: 16px; background: var(--cream); border: 2.5px solid var(--ink); display: flex; align-items: center; gap: 6px; padding: 0 10px 0 4px; font: 700 15px 'Fredoka', sans-serif; white-space: nowrap; }
.pill.bump { animation: bump .3s ease; }
@keyframes bump { 50% { transform: scale(1.08); } }
.xp { height: 10px; border-radius: 5px; background: var(--ink); padding: 2px; }
.xp i { display: block; height: 6px; border-radius: 3px; background: #6cb850; transition: width .4s; }
.sq { width: 44px; height: 44px; border-radius: 14px; border: 2.5px solid var(--ink); background: var(--cream); display: grid; place-items: center; padding: 0; flex-shrink: 0; }
.chip { position: absolute; top: calc(max(14px, env(safe-area-inset-top)) + 72px); left: 12px; height: 30px; border-radius: 15px; background: var(--ink); color: var(--cream); display: flex; align-items: center; gap: 6px; padding: 0 12px 0 8px; font: 700 13px 'Nunito', sans-serif; pointer-events: none; }
.side { position: absolute; top: calc(max(14px, env(safe-area-inset-top)) + 116px); right: 12px; display: flex; flex-direction: column; gap: 10px; }
.side button { position: relative; width: 52px; height: 52px; border-radius: 18px; border: 2.5px solid var(--ink); background: var(--cream); display: grid; place-items: center; padding: 0; }
.badge { position: absolute; top: -6px; right: -6px; min-width: 22px; height: 22px; border-radius: 11px; background: var(--brique); color: #fff; font: 700 12px/22px 'Fredoka', sans-serif; text-align: center; padding: 0 5px; }

/* l'action du moment */
.cta { position: absolute; height: 42px; border-radius: 21px; border: 2.5px solid var(--ink); background: var(--brique); color: #fff; display: flex; align-items: center; gap: 8px; padding: 0 16px 0 8px; font: 600 15px 'Fredoka', sans-serif; box-shadow: 0 4px 0 var(--ink); transform: translate(-50%, -100%); white-space: nowrap; transition: opacity .2s; }
.cta:active { transform: translate(-50%, calc(-100% + 3px)); box-shadow: 0 1px 0 var(--ink); }
.cta[hidden] { display: none; }

/* aujourd'hui */
.today { position: absolute; left: 0; right: 0; bottom: calc(96px + env(safe-area-inset-bottom)); padding: 0 12px; pointer-events: none; }
.today > * { pointer-events: auto; }
.today-h { display: flex; align-items: baseline; justify-content: space-between; margin: 0 4px 8px; }
.today-h h2 { margin: 0; font: 700 18px 'Fredoka', sans-serif; text-shadow: 0 1px 0 rgba(255, 255, 255, .5); }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.card { background: var(--cream); border: 2.5px solid var(--ink); border-radius: 18px; padding: 10px; display: flex; flex-direction: column; gap: 6px; text-align: left; min-height: 104px; }
.card.pink { background: #ffe7ee; }
.card .who { display: flex; align-items: center; gap: 6px; }
.card .who b { font: 600 13px 'Fredoka', sans-serif; line-height: 1.1; }
.card .dot { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--ink); flex-shrink: 0; display: grid; place-items: center; }
.card small { font-size: 12px; line-height: 1.3; }
.card .go { font: 800 12px 'Nunito', sans-serif; color: #2f6b2a; margin-top: auto; }
.card .go.off { color: var(--ink-soft); font-weight: 700; }
.bar { height: 6px; border-radius: 3px; background: #e9d6a6; overflow: hidden; }
.bar i { display: block; height: 6px; background: var(--bocage); transition: width .3s; }

/* le dock */
.dock { position: absolute; left: 0; right: 0; bottom: 0; height: calc(88px + env(safe-area-inset-bottom)); padding: 10px 6px env(safe-area-inset-bottom); background: var(--cream); border-top: 3px solid var(--ink); border-radius: 28px 28px 0 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: start; }
.dock button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; font: 600 13px 'Fredoka', sans-serif; color: var(--ink-soft); padding: 0; position: relative; }
.dock button.on { margin-top: -30px; color: var(--ink); font-weight: 700; }
.dock button.on .ic { width: 60px; height: 60px; border-radius: 22px; background: var(--ble); border: 3px solid var(--ink); display: grid; place-items: center; box-shadow: 0 4px 0 var(--ink); }
.dock .pip { position: absolute; top: -2px; right: calc(50% - 22px); width: 12px; height: 12px; border-radius: 6px; background: var(--brique); border: 2px solid var(--cream); }

/* la feuille des graines */
.tray { position: absolute; left: 12px; right: 12px; bottom: calc(100px + env(safe-area-inset-bottom)); background: var(--cream); border: 2.5px solid var(--ink); border-radius: 22px; padding: 10px; display: flex; gap: 8px; align-items: center; box-shadow: 0 6px 0 rgba(43, 33, 24, .25); transform: translateY(20px); opacity: 0; pointer-events: none; transition: .2s; }
.tray.open { transform: none; opacity: 1; pointer-events: auto; }
.seed { flex: 1; min-height: 76px; border-radius: 16px; border: 2.5px solid var(--ink); background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px; }
.seed.on { background: #fff3cf; box-shadow: 0 0 0 3px var(--ble) inset; }
.seed b { font: 600 13px 'Fredoka', sans-serif; }
.seed small { font-size: 11px; color: var(--ink-soft); }
.tray .x { width: 44px; height: 44px; border-radius: 14px; border: 2.5px solid var(--ink); background: var(--paper); display: grid; place-items: center; padding: 0; flex-shrink: 0; }

/* la feuille du marché */
.sheet-bg { position: absolute; inset: 0; background: rgba(43, 33, 24, .35); opacity: 0; pointer-events: none; transition: .2s; }
.sheet-bg.open { opacity: 1; pointer-events: auto; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--cream); border-top: 3px solid var(--ink); border-radius: 30px 30px 0 0; padding: 10px 16px calc(20px + env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .28s cubic-bezier(.2, .9, .3, 1); display: flex; flex-direction: column; gap: 12px; }
.sheet.open { transform: none; }
.grab { width: 44px; height: 5px; border-radius: 3px; background: #cdbb9a; align-self: center; }
.sheet h3 { margin: 0; font: 700 22px 'Fredoka', sans-serif; }
.sheet p { margin: 0; color: var(--ink-soft); font-size: 14px; line-height: 1.45; }
.rows { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 10px; background: #fff; border: 2.5px solid var(--ink); border-radius: 16px; padding: 8px 10px; }
.row b { flex: 1; font: 600 16px 'Fredoka', sans-serif; }
.row span { font: 700 15px 'Fredoka', sans-serif; }
.big { height: 52px; border-radius: 18px; border: 2.5px solid var(--ink); background: var(--brique); color: #fff; font: 700 17px 'Fredoka', sans-serif; box-shadow: 0 4px 0 var(--ink); }
.big.gold { background: var(--ble); color: var(--ink); }
.big:disabled { background: var(--paper); color: var(--ink-soft); box-shadow: none; border-style: dashed; cursor: default; }
.ghost { height: 44px; border-radius: 14px; border: 2.5px solid var(--ink); background: #fff; font: 600 15px 'Fredoka', sans-serif; }

/* petits mots qui s'envolent */
.fly { position: absolute; transform: translate(-50%, -50%); font: 700 17px 'Fredoka', sans-serif; color: #fff; -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; pointer-events: none; animation: fly 1s ease-out forwards; display: flex; align-items: center; gap: 2px; white-space: nowrap; }
@keyframes fly { from { opacity: 1; transform: translate(-50%, -50%); } to { opacity: 0; transform: translate(-50%, -150%); } }
.toast { position: absolute; left: 50%; top: calc(max(14px, env(safe-area-inset-top)) + 72px); transform: translate(-50%, -12px); background: var(--ink); color: var(--cream); padding: 10px 16px; border-radius: 16px; font: 700 14px 'Nunito', sans-serif; opacity: 0; transition: .25s; pointer-events: none; max-width: 86%; text-align: center; z-index: 5; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.hint { position: absolute; left: 50%; top: 44%; transform: translateX(-50%); background: rgba(255, 248, 236, .94); border: 2.5px solid var(--ink); border-radius: 16px; padding: 8px 14px; font: 700 14px 'Nunito', sans-serif; pointer-events: none; transition: opacity .4s; width: max-content; max-width: 80%; text-align: center; }
.hint.off { opacity: 0; }
</style>
</head>
<body>
<main class="stage" id="stage">
<svg id="world" xmlns="http://www.w3.org/2000/svg" aria-label="La ferme, vue d'en haut"></svg>

<div class="hud">
    <a class="me" href="../" aria-label="Revenir au jeu actuel">
        <svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true"><circle cx="23" cy="20" r="10" fill="#E8B48C"/><path d="M12 18 q11 -14 22 0 q-11 -6 -22 0 Z" fill="#7A4E2C"/><path d="M7 44 q16 -18 32 0 Z" fill="#4E9A3F"/></svg>
        <span class="lvl" id="lvl">1</span>
    </a>
    <div class="mid">
        <div class="pills">
            <div class="pill" id="coinsPill"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="#F2B33D" stroke="#2B2118" stroke-width="2"/><circle cx="11" cy="11" r="5" fill="none" stroke="#C98A12" stroke-width="2"/></svg><span id="coins">0</span></div>
            <button class="pill" id="barnPill" aria-label="Ouvrir la grange"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M3 10 L11 3 L19 10 L19 19 L3 19 Z" fill="#C8453A" stroke="#2B2118" stroke-width="2" stroke-linejoin="round"/><rect x="8" y="12" width="6" height="7" fill="#F6E7C8" stroke="#2B2118" stroke-width="1.6"/></svg><span id="barn">0/50</span></button>
        </div>
        <div class="xp"><i id="xp" style="width:0%"></i></div>
    </div>
    <a class="sq" href="../" aria-label="Revenir au jeu actuel">
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M4 6 H18 M4 11 H18 M4 16 H18" stroke="#2B2118" stroke-width="2.6" stroke-linecap="round"/></svg>
    </a>
</div>
<div class="chip" id="clock"></div>
<div class="side">
    <button id="sOrders" aria-label="Commande de Mamie Odette"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="6" y="4" width="16" height="20" rx="3" fill="#fff" stroke="#2B2118" stroke-width="2"/><path d="M10 10 H18 M10 14 H18 M10 18 H15" stroke="#2B2118" stroke-width="2" stroke-linecap="round"/></svg><span class="badge" id="ordBadge" hidden>1</span></button>
    <button id="sCenter" aria-label="Recentrer la vue"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="8" fill="none" stroke="#2B2118" stroke-width="2.4"/><circle cx="14" cy="14" r="2.6" fill="#2B2118"/><path d="M14 2 V6 M14 22 V26 M2 14 H6 M22 14 H26" stroke="#2B2118" stroke-width="2.4" stroke-linecap="round"/></svg></button>
</div>

<button class="cta" id="cta" hidden></button>
<div class="hint" id="hint">Touchez une parcelle pour semer · glissez pour vous promener</div>

<section class="today" aria-label="Aujourd’hui">
    <div class="today-h"><h2>Aujourd’hui</h2></div>
    <div class="cards">
        <button class="card" id="cOrder"></button>
        <button class="card" id="cCow"></button>
        <button class="card pink" id="cMill"></button>
    </div>
</section>

<div class="tray" id="tray" role="dialog" aria-label="Choisir une graine"></div>

<nav class="dock" aria-label="Lieux">
    <button class="on" aria-current="page"><span class="ic"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 15 L16 6 L27 15 L27 27 L5 27 Z" fill="#FFF8EC" stroke="#2B2118" stroke-width="2.4" stroke-linejoin="round"/><rect x="13" y="18" width="6" height="9" fill="#C8453A" stroke="#2B2118" stroke-width="2"/></svg></span>Ferme</button>
    <button data-soon="Les bêtes"><span class="ic"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect x="6" y="10" width="20" height="14" rx="7" fill="#fff" stroke="#2B2118" stroke-width="2.4"/><circle cx="12" cy="16" r="3" fill="#2B2118"/><path d="M9 24 V28 M23 24 V28" stroke="#2B2118" stroke-width="2.4" stroke-linecap="round"/></svg></span>Bêtes</button>
    <button data-soon="L’atelier"><span class="ic"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="6" fill="#fff" stroke="#2B2118" stroke-width="2.4"/><path d="M16 4 V8 M16 24 V28 M4 16 H8 M24 16 H28 M7.5 7.5 L10.3 10.3 M21.7 21.7 L24.5 24.5 M7.5 24.5 L10.3 21.7 M21.7 10.3 L24.5 7.5" stroke="#2B2118" stroke-width="2.4" stroke-linecap="round"/></svg></span>Atelier</button>
    <button data-soon="Le village"><span class="ic"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><path d="M3 16 L10 10 L17 16 V27 H3 Z" fill="#fff" stroke="#2B2118" stroke-width="2.4" stroke-linejoin="round"/><path d="M15 13 L22 6 L29 13 V27 H17" fill="#fff" stroke="#2B2118" stroke-width="2.4" stroke-linejoin="round"/></svg></span>Village</button>
    <button id="dMarket"><span class="ic"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><path d="M4 12 L7 5 H25 L28 12 Z" fill="#E8708F" stroke="#2B2118" stroke-width="2.4" stroke-linejoin="round"/><path d="M6 12 V27 H26 V12" fill="#fff" stroke="#2B2118" stroke-width="2.4" stroke-linejoin="round"/><rect x="12" y="18" width="8" height="9" fill="#F2B33D" stroke="#2B2118" stroke-width="2"/></svg></span>Marché<span class="pip" id="mPip" hidden></span></button>
</nav>

<div class="sheet-bg" id="sheetBg"></div>
<section class="sheet" id="sheet" role="dialog" aria-label="La grange et le marché"></section>
<div class="toast" id="toast"></div>
</main>

<script>
'use strict';
// Prototype de la nouvelle ferme : un diorama isométrique jouable. Il n'utilise ni ne modifie la sauvegarde du jeu.
const NS = 'http://www.w3.org/2000/svg';
const KEY = 'meuhProtoFerme';
const $ = id => document.getElementById(id);
const ink = '#2B2118';

// ---------- les données ----------
const CROPS = {
    wheat: { name: 'Blé', plural: 'blés', time: 20, cost: 2, sell: 6 },
    carrot: { name: 'Carotte', plural: 'carottes', time: 40, cost: 5, sell: 14 },
    tomato: { name: 'Tomate', plural: 'tomates', time: 70, cost: 9, sell: 26 },
};
const GOODS = { ...CROPS, milk: { name: 'Lait', plural: 'laits', sell: 18 }, flour: { name: 'Farine', plural: 'farines', sell: 30 } };
const COW_TIME = 30, MILL_TIME = 25, BARN = 50;
const now = () => Date.now();
const fresh = () => ({
    coins: 120, xp: 0, lvl: 1,
    inv: { wheat: 0, carrot: 0, tomato: 0, milk: 0, flour: 0 },
    tiles: Array.from({ length: 16 }, (_, i) => (i % 5 === 0 ? { crop: 'wheat', at: now() - 30000 } : { crop: null, at: 0 })),
    cows: [{ at: now() - 20000 }, { at: now() - 5000 }],
    mill: { at: 0, busy: false },
    order: null,
    seed: 'wheat',
});
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || fresh(); } catch { S = fresh(); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch { /* aperçu */ } };
const fmt = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace('.', ',') + ' M' : n >= 1e4 ? Math.round(n / 1000) + ' k' : String(n);
const used = () => Object.values(S.inv).reduce((a, b) => a + b, 0);
const qty = (n, id) => `${n} ${(n > 1 ? GOODS[id].plural : GOODS[id].name.toLowerCase())}`;

// ---------- la commande ----------
const WHO = [['Mamie Odette', '#F3C9B5'], ['Gaspard', '#BFE6FB'], ['Margaux', '#FFE1A6'], ['Jules', '#D9E7C9']];
function newOrder() {
    const pool = ['wheat', 'carrot', 'milk', 'flour', 'tomato'].filter(id => id !== 'tomato' || S.lvl >= 2);
    const a = pool[Math.floor(Math.random() * pool.length)];
    let b = pool[Math.floor(Math.random() * pool.length)];
    if (b === a) b = a === 'wheat' ? 'milk' : 'wheat';
    const want = { [a]: 2 + Math.floor(Math.random() * 4), [b]: 1 + Math.floor(Math.random() * 3) };
    const value = Object.entries(want).reduce((s, [id, n]) => s + GOODS[id].sell * n, 0);
    const [name, color] = WHO[Math.floor(Math.random() * WHO.length)];
    S.order = { name, color, want, coins: Math.round(value * 1.6), xp: 6 + Object.values(want).reduce((x, y) => x + y, 0) };
}
if (!S.order) newOrder();
const orderReady = () => Object.entries(S.order.want).every(([id, n]) => S.inv[id] >= n);

// ---------- le monde (coordonnées de la maquette, 390 de large, décalées dans un monde plus grand) ----------
const WW = 640, WH = 900, OX = 125, OY = 110;
const svg = $('world');
svg.setAttribute('viewBox', `0 0 ${WW} ${WH}`);
const el = (tag, attrs, parent, html) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (html) e.innerHTML = html;
    if (parent) parent.appendChild(e);
    return e;
};
const tree = (x, y, r, apples) => `<g transform="translate(${x} ${y})"><ellipse cx="0" cy="17" rx="${r * .8}" ry="${r * .25}" fill="#000" opacity=".12"/><rect x="-4" y="0" width="8" height="18" rx="2" fill="#7A4E2C"/><circle cx="0" cy="-8" r="${r}" fill="#4E9A3F"/><circle cx="${-r * .35}" cy="${-8 - r * .3}" r="${r * .5}" fill="#6CB850"/>${apples ? `<circle cx="-5" cy="-10" r="2.6" fill="#D8433A"/><circle cx="6" cy="-4" r="2.6" fill="#D8433A"/><circle cx="2" cy="-17" r="2.6" fill="#D8433A"/>` : ''}</g>`;
const flowers = (x, y) => `<g transform="translate(${x} ${y})"><circle r="2.4" fill="#fff"/><circle cx="7" cy="3" r="2.4" fill="#F2B33D"/><circle cx="-6" cy="4" r="2.4" fill="#E8708F"/></g>`;

function drawWorld() {
    const g = el('g', { transform: `translate(${OX} ${OY})` }, svg);
    el('rect', { x: -OX, y: -OY, width: WW, height: WH, fill: '#A8D46F' }, g);
    g.insertAdjacentHTML('beforeend', `
    <ellipse cx="60" cy="210" rx="110" ry="44" fill="#9BCB60"/><ellipse cx="330" cy="540" rx="130" ry="50" fill="#9BCB60"/>
    <ellipse cx="110" cy="590" rx="90" ry="32" fill="#9BCB60"/><ellipse cx="420" cy="140" rx="90" ry="34" fill="#9BCB60"/>

// ---------- petits dessins de produits ----------
function goodArt(id) {
    if (CROPS[id]) return plantArt(id, 1);
    if (id === 'milk') return `<path d="M-5 -14 L5 -14 L7 4 L-7 4 Z" fill="#fff" stroke="${ink}" stroke-width="1.8"/><path d="M-4 -18 L4 -18" stroke="${ink}" stroke-width="2.4"/><rect x="-7" y="-6" width="14" height="5" fill="#5AA9E6"/>`;
    if (id === 'coin') return `<circle cx="0" cy="-6" r="8" fill="#F2B33D" stroke="${ink}" stroke-width="2"/><circle cx="0" cy="-6" r="4" fill="none" stroke="#C98A12" stroke-width="2"/>`;
    return `<path d="M-9 4 Q-10 -14 0 -16 Q10 -14 9 4 Z" fill="#F6E7C8" stroke="${ink}" stroke-width="1.8"/><path d="M-4 -12 L4 -12" stroke="${ink}" stroke-width="2"/>`;
}

// ---------- ce qui s'affiche par-dessus ----------
function fly(wx, wy, text, id) {
    const [x, y] = toScreen(wx, wy);
    const d = document.createElement('div');
    d.className = 'fly';
    d.style.left = x + 'px';
    d.style.top = y + 'px';
    d.innerHTML = (id ? `<svg width="22" height="22" viewBox="-11 -18 22 22" aria-hidden="true">${goodArt(id)}</svg>` : '') + text;
    $('stage').appendChild(d);
    setTimeout(() => d.remove(), 1000);
}
let toastT;
function toast(t) {
    const e = $('toast');
    e.textContent = t;
    e.classList.add('on');
    clearTimeout(toastT);
    toastT = setTimeout(() => e.classList.remove('on'), 2200);
}
function bump(id) {
    const e = $(id);
    e.classList.remove('bump');
    void e.offsetWidth;
    e.classList.add('bump');
}
let hinted = false;
function hideHint() {
    if (hinted) return;
    hinted = true;
    $('hint').classList.add('off');
}
function placeCta() {
    const b = $('cta');
    if (b.hidden) return;
    const [x, y] = toScreen(143, 268);
    b.style.left = x + 'px';
    b.style.top = y + 'px';
}
const SEASON = ['Printemps', 'Été', 'Automne', 'Hiver'];
function hud() {
    $('coins').textContent = fmt(S.coins);
    $('barn').textContent = `${used()}/${BARN}`;
    $('lvl').textContent = S.lvl;
    $('xp').style.width = Math.round((S.xp / (20 + S.lvl * 12)) * 100) + '%';
    const d = new Date();
    $('clock').innerHTML = `<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="4" fill="#F2B33D"/><path d="M9 1 V3 M9 15 V17 M1 9 H3 M15 9 H17 M3.3 3.3 L4.7 4.7 M13.3 13.3 L14.7 14.7 M3.3 14.7 L4.7 13.3 M13.3 4.7 L14.7 3.3" stroke="#F2B33D" stroke-width="1.6" stroke-linecap="round"/></svg>${SEASON[Math.floor(d.getMonth() / 3) % 4]} · ${d.getHours()} h ${String(d.getMinutes()).padStart(2, '0')}`;
    // l'action du moment
    const ready = S.tiles.filter(t => t.crop && growth(t) >= 1);
    const b = $('cta');
    if (ready.length) {
        const kinds = [...new Set(ready.map(t => t.crop))];
        b.innerHTML = `<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20 L14 10" stroke="#FFF8EC" stroke-width="2.6" stroke-linecap="round"/><path d="M12 4 C18 4 21 8 20 13 C17 9 14 8 12 8 Z" fill="#FFF8EC"/></svg>Récolter ${kinds.length === 1 ? `les ${ready.length} ${ready.length > 1 ? CROPS[kinds[0]].plural : CROPS[kinds[0]].name.toLowerCase()}` : `les ${ready.length} parcelles`}`;
        b.hidden = false;
        placeCta();
    } else b.hidden = true;
    // les cartes du jour
    const o = S.order;
    const have = Object.entries(o.want).reduce((a, [id, n]) => a + Math.min(n, S.inv[id]), 0);
    const all = Object.values(o.want).reduce((a, n) => a + n, 0);
    $('cOrder').innerHTML = `<span class="who"><span class="dot" style="background:${o.color}"></span><b>${o.name}</b></span><small>${Object.entries(o.want).map(([id, n]) => qty(n, id)).join(', ')}</small><span class="bar"><i style="width:${Math.round((have / all) * 100)}%"></i></span><span class="go${orderReady() ? '' : ' off'}">${orderReady() ? `Livrer · +${o.coins}` : `${have}/${all} · +${o.coins}`}</span>`;
    $('ordBadge').hidden = !orderReady();
    const cows = S.cows.filter(cowReady).length;
    $('cCow').innerHTML = `<span class="who"><span class="dot" style="background:#fff"><svg width="18" height="18" viewBox="-9 -14 18 18" aria-hidden="true">${goodArt('milk')}</svg></span><b>Les vaches</b></span><small>${cows ? `${cows} ${cows > 1 ? 'laits prêts' : 'lait prêt'}` : 'Elles ruminent…'}</small><span class="go${cows ? '' : ' off'}">${cows ? 'Traire' : `${Math.ceil(Math.min(...S.cows.map(c => COW_TIME - (now() - c.at) / 1000)))} s`}</span>`;
    const m = S.mill, mdone = m.busy && now() - m.at >= MILL_TIME * 1000;
    $('cMill').innerHTML = `<span class="who"><span class="dot" style="background:#F6E7C8"><svg width="18" height="18" viewBox="-9 -14 18 18" aria-hidden="true">${goodArt('flour')}</svg></span><b>Le moulin</b></span><small>${mdone ? 'Une farine est prête' : m.busy ? 'Il moud…' : '3 blés → 1 farine'}</small><span class="go${mdone || (!m.busy && S.inv.wheat >= 3) ? '' : ' off'}">${mdone ? 'Ramasser' : m.busy ? `${Math.ceil(MILL_TIME - (now() - m.at) / 1000)} s` : S.inv.wheat >= 3 ? 'Moudre' : `${S.inv.wheat}/3 blés`}</span>`;
    $('mPip').hidden = used() < BARN * 0.8;
}
function changed() {
    drawTiles();
    drawCows();
    drawMill();
    hud();
    save();
}

// ---------- c'est parti ----------
drawWorld();
drawTiles(true);
drawCows();
drawMill();
fit();
center(false);
hud();
setInterval(() => {
    drawTiles();
    drawCows();
    drawMill();
    hud();
}, 500);
setInterval(save, 5000);
</script>
</body>
</html>
