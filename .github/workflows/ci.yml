name: Qualité continue Meuh

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Audit, lint, tests et build
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund

      - name: Garde-fou des données et sprites
        run: npm run check

      - name: Audit économique (strict)
        run: npm run econ -- --strict

      - name: ESLint
        run: npm run lint

      - name: Suite de tests
        run: npm test

      - name: Vérifier le build et le Codex
        run: |
          npm run build
          npm run codex
