// ---- Utilitaires ----
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const fmt = n => Number(n || 0).toLocaleString('fr-FR');
const fmtDur = s => {
  if (!s) return '—';
  if (s < 60) return s + ' s';
  const m = Math.floor(s / 60), r = s % 60;
  if (m < 60) return r ? `${m} min ${r} s` : `${m} min`;
  const h = Math.floor(m / 60), rm = m % 60;
  return rm ? `${h} h ${rm} min` : `${h} h`;
};
let toastTimer;
function showToast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 1800);
}
async function copyText(t, label = 'Copié !') {
  try { await navigator.clipboard.writeText(t); showToast(label); }
  catch {
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove(); showToast(label);
  }
}

// Décompression gzip native du payload embarqué
async function loadPayload() {
  const bin = atob(DATA_GZ);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const ds = new DecompressionStream('gzip');
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  const text = await new Response(stream).text();
  return JSON.parse(text);
}

// ---- Moteurs SVG fidèles au jeu ----
let SPR, DATA, USED_IN;
const svgWrap = (inner, vb = '0 0 64 64') =>
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}" stroke-linecap="round" stroke-linejoin="round">${inner || ''}</svg>`;
const itemSvg = id => svgWrap(SPR.items[id] || SPR.ui.star || '');
const machSvg = id => svgWrap(SPR.machines[id] || '');
const uiSvg = id => svgWrap(SPR.ui[id] || '');
const animSvg = key => svgWrap(SPR.animVars[key] || SPR.animals[key.split('~')[0]] || '', '0 0 80 80');
const plantSvg = (id, stage) => {
  const it = DATA.items[id];
  const arr = SPR.plants[id];
  if (!it || !arr) return itemSvg(id);
  if (it.type === 'crop') return svgWrap(stage === 0 ? SPR.sprout : arr[stage === 1 ? 0 : 1]);
  return svgWrap(arr[Math.max(0, Math.min(2, stage))]);
};

const INK = '#3a2618';

const F = (d, f, op = 1) => `<path d="${d}" fill="${f}"${op < 1 ? ` opacity="${op}"` : ''}/>`;
const L = (d, sw = 2.2, c = INK) => `<path d="${d}" fill="none" stroke="${c}" stroke-width="${sw}"/>`;

const FC = (x, y, r, f, op = 1) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${f}"${op < 1 ? ` opacity="${op}"` : ''}/>`;

  `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${f}" stroke="${INK}" stroke-width="${sw}"${rot ? ` transform="rotate(${rot} ${x} ${y})"` : ''}/>`;
const FE = (x, y, rx, ry, f, op = 1, rot = 0) =>
  `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${f}"${op < 1 ? ` opacity="${op}"` : ''}${rot ? ` transform="rotate(${rot} ${x} ${y})"` : ''}/>`;
const R = (x, y, w, h, rx, f, sw = 2.4) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${f}" stroke="${INK}" stroke-width="${sw}"/>`;
const SHADOW = (x, y, rx, ry = 3.5) => FE(x, y, rx, ry, INK, 0.14);
const HL = (x, y, rx, ry, rot = -25, op = 0.55) => FE(x, y, rx, ry, '#fff', op, rot);
const subItem = (id, x, y, s) => {
  const inner = SPR.items[id];

};

// Génétique mendélienne des robes (coat.js)
const dom = p => !!(p[0] || p[1]);
function founderCoat() {
  const c = {};
  for (const [k, f] of Object.entries(DATA.haras.coat.freq)) c[k] = [Math.random() < f, Math.random() < f];
  return c;
}
function crossCoat(a, b) {
  const c = {}, mut = DATA.haras.coat.mut;
  for (const k of Object.keys(DATA.haras.coat.freq)) {
    const pick = p => { const v = !!p[Math.random() < .5 ? 0 : 1]; return Math.random() < mut ? !v : v; };
    c[k] = [pick(a[k]), pick(b[k])];
  }

}
function robeOfCoat(c) {
  const black = dom(c.E), bay = black && dom(c.A);
  const base = !black ? 'alezan' : bay ? (dom(c.Br) ? 'bai' : 'baibrun') : 'noir';
  const cr = (c.Cr[0] ? 1 : 0) + (c.Cr[1] ? 1 : 0);
  if (dom(c.G)) return 'gris';
  if (cr === 2) return 'creme';
  if (dom(c.Rn)) return bay ? 'rouan' : !black ? 'aubere' : 'noir';
  if (dom(c.D) && bay) return 'louvet';
  if (cr === 1) return !black ? 'palomino' : bay ? 'isabelle' : 'noir';
  return base;
}
function marksOfCoat(c) {
  const m = [], robe = robeOfCoat(c);

  else if (dom(c.etoile)) m.push('etoile');
  if (dom(c.balzanes)) m.push('balzanes');
  if (dom(c.pie)) m.push('pie');
  if (dom(c.appaloosa)) m.push('appaloosa');
  if (dom(c.raie) && robe !== 'louvet') m.push('raie');

}

const G_SIZE = [[.82,.82],[1,1],[1.14,1.14],[1.3,1.3],[.8,1.1],[.68,.68],[1,1]];
const G_COLOR = [
  '', 'sepia(.9) saturate(5) hue-rotate(-45deg) brightness(.95)',
  'sepia(.9) saturate(3.2) hue-rotate(5deg) brightness(1.12)',
  'sepia(.9) saturate(3) hue-rotate(225deg) brightness(.9)',

  'sepia(1) saturate(3.2) hue-rotate(-28deg) brightness(.92) contrast(1.05)',
  'sepia(.6) saturate(2) hue-rotate(200deg) brightness(1.05)',

const G_FIN_FILTER = ['', 'saturate(.8) brightness(1.06) drop-shadow(0 0 3px #bfe9ff)', '', '', 'saturate(1.3) contrast(1.1)', ''];

function maskOf(svgStr) {
  let m = maskCache.get(svgStr);
  if (!m) {
    m = `url('data:image/svg+xml;utf8,${encodeURIComponent(svgStr).replace(/'/g, '%27')}')`;
    if (maskCache.size > 300) maskCache.clear();
    maskCache.set(svgStr, m);
  }
  return m;
}
function genWrap(svgStr, l, isPlant = false) {
  const bigFruit = l.size === 6 && isPlant;
  if ((l.size === 1 || l.size === 6) && !bigFruit && !l.color && !l.pattern && !l.halo && !l.finish) return svgStr;
  const [sx, sy] = G_SIZE[l.size] || G_SIZE[1];
  const filter = [G_COLOR[l.color] || '', G_FIN_FILTER[l.finish] || '', l.halo ? 'drop-shadow(0 0 4px #ffd23f) drop-shadow(0 0 2px #fff6c8)' : ''].join(' ').trim();
  const m = `-webkit-mask-image:${maskOf(svgStr)};mask-image:${maskOf(svgStr)}`;
  const ov = c => `<i class="gp ${c}" style="${m}"></i>`;
  let over = '';
  if (l.color >= 9) over += ov(`gp-c${l.color}`);
  if (l.pattern) over += ov(`gp-${l.pattern}`);
  if (l.finish && l.finish !== 3) over += ov(`gp-f${l.finish}`);
  if (l.finish === 3) over += G_SPARKS.map(([x,y],i) => `<b class="spk" style="left:${x}%;top:${y}%;animation-delay:${i*0.37}s"></b>`).join('');
  const big = bigFruit ? `<div class="bigpart">${svgStr}</div>` : '';
  return `<span class="gl" style="--gsx:${sx};--gsy:${sy};${filter ? `filter:${filter}` : ''}">${svgStr}${big}${over}</span>`;

// ---- Moteur logique de la Brasserie d'Abbaye (src/systems/brewery.js) ----
function evalBrew(mode, baseKey, hop, ings, barrelId) {
  const A = DATA.abbey;
  const mead = mode === 'mead';
  const bd = mead
    ? { name: 'Hydromel', color: DATA.honeyCol[baseKey] || DATA.honeyCol.all, ...(A.meadBases[baseKey] || A.meadBases.all), mead: true, honey: baseKey }
    : { ...(A.malts[baseKey] || A.malts.maltBlond), mead: false };
  const ingFl = id => DATA.genetics.flavors[id] || A.brewExtra[id] || [0,0,0,0,0];
  const noteOf = v => v.indexOf(Math.max(...v));
  const det = k => (k === 0 ? 'le ' : 'l’') + A.notes[k];
  const cap = t => t[0].toUpperCase() + t.slice(1);
  const honeyDe = h => (DATA.honeys[h] ? ' ' + DATA.honeys[h].name.replace(/^Miel /, '') : '');

  const profile = [...bd.taste];
  profile[2] += mead ? 0 : hop;
  for (const [id, d] of ings) ingFl(id).forEach((v, k) => (profile[k] += v * d));

  const reasons = [];
  let stars = 0, classic = null;
  if (!ings.length) {
    reasons.push('Ajoutez au moins un ingrédient.');
  } else {
    const ip = [0,0,0,0,0];
    for (const [id, d] of ings) ingFl(id).forEach((v, k) => (ip[k] += v * d));
    const order = ip.map((v, k) => [v, k]).sort((x, y) => y[0] - x[0]);
    const [a, b] = [order[0][1], order[1][1]];
    let score = 0;
    if (order[1][0] >= order[0][0] * 0.3 && order[1][0] > 0) {
      const pair = A.pairs[`${Math.min(a,b)}-${Math.max(a,b)}`] || 0;
      if (pair > 0) reasons.push(`${cap(det(a))} et ${det(b)} vont bien ensemble.`);
      if (pair < 0) reasons.push(`${cap(det(a))} et ${det(b)} se battent.`);
      score += pair;
    } else reasons.push(`Une seule note domine : ${A.notes[a]}.`);

    const who = mead ? `L’hydromel${honeyDe(baseKey)}` : `Une ${bd.name.toLowerCase()}`;
    if (!bd.likes.length) reasons.push(`${who} ${bd.text}.`);
    else if (bd.likes.includes(a)) { score += 1; reasons.push(`${who} ${bd.text}.`); }
    else reasons.push(`${who} ${bd.text} : essayez ${mead ? 'un autre miel' : 'un autre malt'}.`);

    const effHop = mead ? 0 : hop;
    if (effHop === 3 && a === 0) { score -= 1; reasons.push('Trop de houblon pour une bière douce.'); }
    if (effHop === 1 && (a === 2 || a === 3)) reasons.push('Un houblon plus fort irait bien à ce goût.');
    if (effHop === 3 && (a === 2 || a === 3)) { score += 1; reasons.push('Le houblon fort relève ce goût.'); }

    const bases = ings.map(([id]) => id);
    classic = mead ? A.meadClassics.find(c => c.any.some(id => bases.includes(id))) : A.classics.find(c => c.ings.every(id => bases.includes(id)));
    if (classic && !mead) {
      reasons.push(classic.text);
      stars = Math.max(0, Math.min(3, score + 2));
    } else {
      if (classic) { reasons.push(classic.text); score += 1; }
      const tops = ings.map(([id]) => noteOf(ingFl(id)));
      let clash = false;
      for (let x = 0; x < tops.length; x++)
        for (let y = x + 1; y < tops.length; y++)
          if ((A.pairs[`${Math.min(tops[x],tops[y])}-${Math.max(tops[x],tops[y])}`] || 0) < 0) clash = true;
      if (clash) { score -= 1; reasons.push('Deux ingrédients ne s’entendent pas.'); }
      else if (ings.length > 1 && new Set(tops).size > 1) { score += 1; reasons.push('Un beau mélange, riche et équilibré.'); }
      stars = Math.max(0, Math.min(3, score));
    }
  }

  // Nom & coût & valeur
  const ingVal = id => id in A.brewExtra ? Math.round((DATA.items[id]?.sell || 0) * 0.2) : (DATA.items[id]?.sell || 0);
  const honeyMult = mead && DATA.honeys[baseKey] ? DATA.honeys[baseKey].mult : 1;
  const costMap = mead
    ? { honey: A.mead.honeyPerBrew }
    : { [baseKey]: A.abbey.maltPerBrew, hop: hop * A.abbey.hopPerDose };
  for (const [id, d] of ings) costMap[id] = (costMap[id] || 0) + d * A.abbey.ingPerDose;
  let totalCost = 0;
  for (const [id, n] of Object.entries(costMap)) {
    const u = id === 'honey' && mead ? Math.round((DATA.items.honey?.sell || 120) * honeyMult) : ingVal(id);
    totalCost += u * n;
  }
  const time = mead ? A.mead.baseTime + A.mead.perIng * ings.length : A.abbey.baseTime + A.abbey.perIng * ings.length;
  const baseValue = ings.length ? Math.round((((A.abbey.price * totalCost + 0.1 * time) / A.abbey.bottles) * A.abbey.harmony[stars]) / 5) * 5 : 0;
  const barrel = barrelId ? A.barrels[barrelId] : null;
  const agedMaxValue = barrel ? Math.round((baseValue * barrel.mult * A.cellar.mult[3]) / 5) * 5 : 0;

  let name = '';
  if (ings.length) {
    const list = [...ings].sort((x, y) => y[1] - x[1]).map(([id]) => (DATA.items[id]?.name || id).toLowerCase());
    const what = list.length === 1 ? list[0] : list.length === 2 ? `${list[0]}-${list[1]}` : `${list.slice(0,-1).join(', ')} et ${list[list.length-1]}`;
    name = mead ? `${classic ? classic.name : 'Hydromel'}${honeyDe(baseKey)} ${what}` : `${bd.name} ${what}`;
  }
  return { mead, bd, profile, stars, reasons, classic, costMap, time, baseValue, barrel, agedMaxValue, name };
}

    const a = DATA.animals[id];
    title = a ? a.name : id;
    svgStr = animSvg(id);
    const fs = DATA.genetics.speciesFeatures[id] || [];
    if (fs.length) {
      extra = `<div class="mt-3 text-xs muted">Traits morphologiques disponibles dans le Générateur Génétique : <b>${fs.map(f => DATA.genetics.features[f].name).join(', ')}</b>.</div>`;
    }
  } else if (cat === 'machines') {
    const m = DATA.machines[id];
    title = m ? m.name : id;
    svgStr = machSvg(id);
    if (m) extra = `<div class="mt-3 text-xs muted">Débloqué au niveau <b>${m.reqLvl}</b></div>`;
  } else if (cat === 'ui') {
    title = `Icône UI · ${id}`;
    svgStr = uiSvg(id);
  } else if (cat === 'people') {
    title = DATA.villagers[id] || id;
    svgStr = svgWrap(SPR.people[id] || '');
  } else if (cat === 'buildings') {
    if (id.startsWith('farmhouse_')) {
      const l = +id.split('_')[1];
      title = `Maison de ferme (niv. ${l})`;
      svgStr = svgWrap(SPR.farmhouses[l]);
    } else {
      title = `Bâtiment · ${id}`;
      svgStr = svgWrap(SPR.buildings[id] || '', '0 -20 100 110');
    }
  } else if (cat === 'vehicles') {
    title = id;
    svgStr = SPR.vehicles[id] || '';
  }
  window.__lastSvg = svgStr;
  openModal(`
    <div class="flex flex-col sm:flex-row gap-4 items-center sm:items-start">
      <div class="w-40 h-40 checker rounded-xl border border-[var(--border,#e2d8c5)] p-3 spr-box shrink-0">${svgStr}</div>
      <div class="flex-1 min-w-0">
        <div class="text-xs uppercase tracking-wide muted">${esc(cat)} · <code>${esc(id)}</code></div>
        <h2 class="text-lg font-bold mt-0.5">${esc(title)}</h2>
        ${extra}
        <div class="mt-4 flex flex-wrap gap-2">
          <button class="btn-pri text-xs px-3 py-1.5 rounded-lg cursor-pointer" onclick="copyText(window.__lastSvg, 'SVG copié !')">Copier le SVG</button>
          <button class="btn-sec text-xs px-3 py-1.5 rounded-lg cursor-pointer" onclick="copyText('${esc(id)}', 'ID copié !')">Copier l’ID</button>
        </div>
      </div>
    </div>
  `);
}

function inspectProduct(id) {
  const it = DATA.items[id];
  if (!it) return;
  const rec = DATA.recipes[id];
  const used = USED_IN[id] || [];
  const caveFam = DATA.cave.items[id];
  const zoneBadges = [
    it.ghOnly ? 'Serre' : '',
    it.oasis ? 'Oasis' : it.nord ? 'Grand Nord' : it.island ? 'Île' : '',
    it.sea ? 'Pêche en mer' : '',
    it.exotic ? 'Marchand ambulant' : '',
    caveFam ? `Affinable en cave (${DATA.cave.families[caveFam] || caveFam})` : '',
  ].filter(Boolean);
  const SEAS = { printemps: 'Printemps', ete: 'Été', automne: 'Automne', hiver: 'Hiver' };
  const animSrc = Object.values(DATA.animals).filter(a => a.prodId === id || a.extra === id);
  openModal(`
    <div class="flex items-start gap-4">
      <div class="w-24 h-24 checker rounded-xl border border-[var(--border,#e2d8c5)] p-2 spr-box shrink-0">${itemSvg(id)}</div>
      <div class="flex-1 min-w-0">
        <div class="text-xs muted"><code>${esc(id)}</code> · ${esc(it.type)}</div>
        <h2 class="text-xl font-bold">${esc(it.name)}</h2>
        <div class="flex flex-wrap gap-1.5 mt-2 text-xs">
          ${rec ? `<span class="surf px-2 py-0.5 rounded font-medium">Atelier : ${esc(DATA.machines[rec.machine]?.name || rec.machine)} (niv. ${rec.lvl})</span>` : it.reqLvl ? `<span class="surf px-2 py-0.5 rounded">Niveau ${it.reqLvl}</span>` : ''}
          ${it.sell != null ? `<span class="surf px-2 py-0.5 rounded">Vente : <b>${fmt(it.sell)}</b> p.</span>` : ''}
          ${rec?.time ? `<span class="surf px-2 py-0.5 rounded">Durée : ${fmtDur(rec.time)}</span>` : it.time ? `<span class="surf px-2 py-0.5 rounded">Pousse : ${fmtDur(it.time)}</span>` : ''}
          ${rec?.out > 1 ? `<span class="surf px-2 py-0.5 rounded">Produit ×${rec.out}</span>` : ''}
          ${zoneBadges.map(b => `<span class="surf px-2 py-0.5 rounded">${esc(b)}</span>`).join('')}
          ${it.seasons ? `<span class="surf px-2 py-0.5 rounded">Saisons : ${it.seasons.map(s => SEAS[s] || s).join(', ')}</span>` : ''}
        </div>
        ${animSrc.length ? `<div class="mt-2 text-xs muted">Produit par : ${animSrc.map(a => `<b>${esc(a.name)}</b>${a.extra === id ? ' (2e produit)' : ''}`).join(', ')}</div>` : ''}
      </div>
    </div>
    ${rec ? `<div class="mt-4 pt-3 border-t border-[var(--border,#e2d8c5)]">
      <div class="text-xs font-bold uppercase tracking-wide muted mb-2">Ingrédients requis</div>
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
        ${Object.entries(rec.ing).map(([k, n]) => `<button onclick="inspectProduct('${esc(k)}')" class="surf hover:opacity-85 rounded-lg p-2 flex items-center gap-2 text-left cursor-pointer">
          <div class="w-8 h-8 spr-box shrink-0">${itemSvg(k)}</div>
          <div class="min-w-0 text-xs"><div class="font-semibold truncate">${esc(DATA.items[k]?.name || k)}</div><div class="muted">×${n}</div></div>
        </button>`).join('')}
      </div>
    </div>` : ''}
    ${used.length ? `<div class="mt-4 pt-3 border-t border-[var(--border,#e2d8c5)]">
      <div class="text-xs font-bold uppercase tracking-wide muted mb-2">Utilisé dans ${used.length} recette${used.length > 1 ? 's' : ''}</div>
      <div class="flex flex-wrap gap-1.5 max-h-48 overflow-y-auto">
        ${used.map(uid => `<button onclick="inspectProduct('${esc(uid)}')" class="surf hover:opacity-85 rounded-lg px-2 py-1 flex items-center gap-1.5 text-xs cursor-pointer">
          <span class="w-5 h-5 spr-box inline-block">${itemSvg(uid)}</span>${esc(DATA.items[uid]?.name || uid)}
        </button>`).join('')}
      </div>
    </div>` : ''}
  `);
}
window.inspectSprite = inspectSprite;
window.inspectProduct = inspectProduct;
window.copyText = copyText;

// ---- ONGLET 1 : SPRITES ----
function getSpriteEntries(cat) {
  if (cat === 'items') return Object.keys(SPR.items).map(id => ({ id, label: DATA.items[id]?.name || id, svg: () => itemSvg(id) }));
  if (cat === 'plants') return Object.keys(SPR.plants).map(id => ({ id, label: DATA.items[id]?.name || id, svg: () => plantSvg(id, 2) }));
  if (cat === 'animals') return Object.keys(SPR.animals).map(id => ({ id, label: DATA.animals[id]?.name || id, svg: () => animSvg(id) }));
  if (cat === 'machines') return Object.keys(SPR.machines).map(id => ({ id, label: DATA.machines[id]?.name || id, svg: () => machSvg(id) }));
  if (cat === 'ui') return Object.keys(SPR.ui).map(id => ({ id, label: id, svg: () => uiSvg(id) }));
  if (cat === 'people') return Object.keys(SPR.people).map(id => ({ id, label: DATA.villagers[id] || id, svg: () => svgWrap(SPR.people[id]) }));
  if (cat === 'buildings') return [
    ...SPR.farmhouses.map((_, i) => ({ id: 'farmhouse_' + i, label: 'Ferme niv. ' + i, svg: () => svgWrap(SPR.farmhouses[i]) })),
    ...Object.keys(SPR.buildings).map(id => ({ id, label: id, svg: () => svgWrap(SPR.buildings[id], '0 -20 100 110') })),
  ];
  if (cat === 'vehicles') return Object.keys(SPR.vehicles).map(id => ({ id, label: id, svg: () => SPR.vehicles[id] }));
  return [];
}

function renderSprites() {
  const cats = [
    ['items', 'Objets', Object.keys(SPR.items).length],
    ['plants', 'Plantes & Arbres', Object.keys(SPR.plants).length],
    ['animals', 'Animaux', Object.keys(SPR.animals).length],
    ['machines', 'Machines', Object.keys(SPR.machines).length],
    ['ui', 'Icônes UI', Object.keys(SPR.ui).length],
    ['people', 'Personnages', Object.keys(SPR.people).length],
    ['buildings', 'Bâtiments', Object.keys(SPR.buildings).length + SPR.farmhouses.length],
    ['vehicles', 'Véhicules', Object.keys(SPR.vehicles).length],
  ];
  const q = norm(S.sprQ);
  const all = getSpriteEntries(S.sprCat);
  const filtered = q ? all.filter(e => norm(e.label).includes(q) || norm(e.id).includes(q)) : all;
  const shown = filtered.slice(0, S.sprLimit);

  $('#main').innerHTML = `
    <div class="space-y-4">
      <div class="card rounded-xl p-4 space-y-3">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div class="flex flex-wrap gap-1.5" id="spr-cats">
            ${cats.map(([k, lbl, n]) => `<button data-cat="${k}" class="pill ${S.sprCat === k ? 'active' : ''} text-xs px-3 py-1.5 rounded-full cursor-pointer">${lbl} <span class="opacity-75">(${n})</span></button>`).join('')}
          </div>
          <input id="spr-q" type="search" value="${esc(S.sprQ)}" placeholder="Rechercher un sprite (nom ou ID)…" class="surf rounded-lg px-3 py-1.5 text-sm w-full sm:w-64 outline-none" />
        </div>
        <div class="text-xs muted">${fmt(filtered.length)} sprite${filtered.length > 1 ? 's' : ''} trouvé${filtered.length > 1 ? 's' : ''} — cliquez sur un sprite pour l’agrandir ou copier son SVG.</div>
      </div>

      <div class="grid grid-cols-3 sm:grid-cols-5 md:grid-cols-7 lg:grid-cols-9 gap-2.5">
        ${shown.map(e => `<button onclick="inspectSprite('${S.sprCat}','${esc(e.id)}')" class="card rounded-xl p-2 flex flex-col items-center gap-1 hover:shadow-md transition cursor-pointer text-center">
          <div class="w-14 h-14 spr-box">${e.svg()}</div>
          <div class="text-xs font-medium leading-tight line-clamp-2 w-full">${esc(e.label)}</div>
          <div class="text-[10px] muted font-mono truncate w-full">${esc(e.id)}</div>
        </button>`).join('')}
      </div>

      ${filtered.length > shown.length ? `<div class="text-center pt-2">
        <button id="spr-more" class="btn-sec px-4 py-2 rounded-lg text-sm cursor-pointer">Afficher plus (${shown.length} / ${filtered.length})</button>
      </div>` : ''}
    </div>
  `;

  $$('#spr-cats button').forEach(b => b.onclick = () => { S.sprCat = b.dataset.cat; S.sprLimit = 120; renderSprites(); });
  $('#spr-q').oninput = e => { S.sprQ = e.target.value; S.sprLimit = 120; renderSprites(); $('#spr-q').focus(); $('#spr-q').setSelectionRange(S.sprQ.length, S.sprQ.length); };
  const more = $('#spr-more');
  if (more) more.onclick = () => { S.sprLimit += 180; renderSprites(); };
}

// ---- ONGLET 2 : PRODUITS & USINES ----
function renderProducts() {
  const q = norm(S.prodQ);
  const machList = Object.values(DATA.machines).sort((a, b) => a.reqLvl - b.reqLvl || a.name.localeCompare(b.name, 'fr'));
  const modes = [
    ['machines', 'Par usine / atelier (48)'],
    ['raw', 'Matières brutes (266)'],
    ['special', 'Crus de miel, Cave & Paquets'],
  ];

  let body = '';
  if (S.prodMode === 'machines') {
    const byM = {};
    for (const r of Object.values(DATA.recipes)) {
      if (r.lvl > S.prodMaxLvl) continue;
      const it = DATA.items[r.id];
      if (!it) continue;
      if (q) {
        const hitName = norm(it.name).includes(q) || norm(r.id).includes(q);
        const hitIng = Object.keys(r.ing).some(k => norm(DATA.items[k]?.name || k).includes(q));
        if (!hitName && !hitIng) continue;
      }
      (byM[r.machine] ||= []).push(r);
    }
    const visibleMachs = machList.filter(m => (S.prodMach === 'all' || m.id === S.prodMach) && (byM[m.id]?.length));
    const totalShown = visibleMachs.reduce((a, m) => a + byM[m.id].length, 0);
    const sortRec = (a, b) => S.prodSort === 'price' ? (DATA.items[b.id]?.sell || 0) - (DATA.items[a.id]?.sell || 0)
      : S.prodSort === 'name' ? DATA.items[a.id].name.localeCompare(DATA.items[b.id].name, 'fr')
      : a.lvl - b.lvl || DATA.items[a.id].name.localeCompare(DATA.items[b.id].name, 'fr');

    body = `<div class="text-xs muted mb-3">${totalShown} recettes affichées sur ${visibleMachs.length} atelier${visibleMachs.length > 1 ? 's' : ''}. Cliquez sur un produit pour voir sa fiche complète et où il est utilisé.</div>
    <div class="space-y-4">
      ${visibleMachs.map(m => {
        const list = byM[m.id].sort(sortRec);
        return `<section class="card rounded-xl p-4">
          <div class="flex items-center gap-3 pb-3 mb-3 border-b border-[var(--border,#e2d8c5)]">
            <div class="w-11 h-11 spr-box shrink-0">${machSvg(m.id)}</div>
            <div class="flex-1 min-w-0">
              <h3 class="font-bold text-sm sm:text-base">${esc(m.name)}</h3>
              <div class="text-xs muted">Débloqué niv. ${m.reqLvl} · ${list.length} produit${list.length > 1 ? 's' : ''}</div>
            </div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5">
            ${list.map(r => {
              const it = DATA.items[r.id];
              const cave = DATA.cave.items[r.id];
              return `<button onclick="inspectProduct('${esc(r.id)}')" class="surf hover:shadow rounded-xl p-2.5 flex items-center gap-2.5 text-left cursor-pointer transition">
                <div class="w-12 h-12 spr-box shrink-0">${itemSvg(r.id)}</div>
                <div class="flex-1 min-w-0">
                  <div class="flex items-center justify-between gap-1">
                    <span class="font-semibold text-xs sm:text-sm truncate">${esc(it.name)}</span>
                    ${it.sell ? `<span class="text-xs font-mono shrink-0">${fmt(it.sell)} p.</span>` : ''}
                  </div>
                  <div class="text-[11px] muted">Niv. ${r.lvl} · ${fmtDur(r.time)}${r.out > 1 ? ` · ×${r.out}` : ''}${cave ? ' · Cave' : ''}</div>
                  <div class="flex flex-wrap gap-1 mt-1">
                    ${Object.entries(r.ing).map(([k, n]) => `<span class="card rounded px-1.5 py-0.5 text-[11px] flex items-center gap-1" title="${esc(DATA.items[k]?.name || k)}">
                      <span class="w-3.5 h-3.5 spr-box inline-block">${itemSvg(k)}</span>${n}
                    </span>`).join('')}
                  </div>
                </div>
              </button>`;
            }).join('')}
          </div>
        </section>`;
      }).join('') || '<div class="card rounded-xl p-8 text-center muted text-sm">Aucune recette ne correspond aux filtres.</div>'}
    </div>`;
  } else if (S.prodMode === 'raw') {
    const rawItems = Object.values(DATA.items).filter(i => i.type !== 'artisan');
    const match = i => (!q || norm(i.name).includes(q) || norm(i.id).includes(q)) && (!i.reqLvl || i.reqLvl <= S.prodMaxLvl);
    const groups = [
      ['Cultures — Ferme (plein champ)', rawItems.filter(i => i.type === 'crop' && !i.ghOnly && !i.island)],
      ['Cultures — Serre uniquement', rawItems.filter(i => i.type === 'crop' && i.ghOnly)],
      ['Cultures — Île, Oasis & Grand Nord', rawItems.filter(i => i.type === 'crop' && i.island)],
      ['Arbres — Verger (ferme)', rawItems.filter(i => i.type === 'tree' && !i.island)],
      ['Arbres — Île, Oasis & Grand Nord', rawItems.filter(i => i.type === 'tree' && i.island)],
      ['Élevage & Produits spécifiques', rawItems.filter(i => i.type === 'product' && !i.sea)],
      ['Pêche (étang, lagon & pêche en mer)', rawItems.filter(i => i.type === 'fish' || i.type === 'junk' || (i.type === 'product' && i.sea))],
      ['Minerais, gemmes, lingots, bois & matériaux', rawItems.filter(i => ['ore','gem','ingot','material','rare','misc'].includes(i.type))],
    ];
    body = `<div class="space-y-4">
      ${groups.map(([title, list]) => {
        const items = list.filter(match).sort((a,b) => (a.reqLvl||0)-(b.reqLvl||0) || a.name.localeCompare(b.name,'fr'));
        if (!items.length) return '';
        return `<section class="card rounded-xl p-4">
          <h3 class="font-bold text-sm mb-3">${title} <span class="muted font-normal">(${items.length})</span></h3>
          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-2">
            ${items.map(i => `<button onclick="inspectProduct('${esc(i.id)}')" class="surf hover:shadow rounded-lg p-2 flex items-center gap-2 text-left cursor-pointer">
              <div class="w-10 h-10 spr-box shrink-0">${itemSvg(i.id)}</div>
              <div class="min-w-0 text-xs">
                <div class="font-semibold truncate">${esc(i.name)}</div>
                <div class="muted">${i.reqLvl ? `Niv. ${i.reqLvl}` : i.oasis ? 'Oasis' : i.nord ? 'Grand Nord' : i.sea ? 'Mer' : i.type}${i.sell ? ` · ${fmt(i.sell)} p.` : ''}</div>
              </div>
            </button>`).join('')}
          </div>
        </section>`;
      }).join('')}
    </div>`;
  } else {
    const byFam = {};
    for (const [id, fam] of Object.entries(DATA.cave.items)) (byFam[fam] ||= []).push(id);
    body = `<div class="space-y-4">
      <section class="card rounded-xl p-4">
        <h3 class="font-bold text-sm mb-3">Rucher — 23 crus de miel floraux</h3>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2">
          ${Object.entries(DATA.honeys).map(([k, h]) => `<div class="surf rounded-lg p-2.5 flex items-center gap-2.5">
            <span class="w-7 h-7 rounded-full shrink-0 border border-black/20" style="background:${DATA.honeyCol[k] || '#e8a825'}"></span>
            <div class="min-w-0 text-xs"><div class="font-semibold truncate">${esc(h.name)}</div><div class="muted">Multiplicateur ×${h.mult}</div></div>
          </div>`).join('')}
        </div>
      </section>
      <section class="card rounded-xl p-4">
        <h3 class="font-bold text-sm mb-3">Cave d’affinage — 35 produits en 6 familles</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          ${Object.entries(byFam).map(([fam, ids]) => `<div class="surf rounded-lg p-3">
            <div class="text-xs font-bold mb-2">${esc(DATA.cave.families[fam] || fam)} (${ids.length})</div>
            <div class="flex flex-wrap gap-1.5">
              ${ids.map(id => id === 'beer'
                ? `<span class="card rounded px-2 py-1 text-xs flex items-center gap-1"><span class="w-4 h-4 spr-box inline-block">${uiSvg('beer')}</span>Bières d’abbaye</span>`
                : `<button onclick="inspectProduct('${esc(id)}')" class="card rounded px-2 py-1 text-xs flex items-center gap-1 cursor-pointer hover:opacity-80"><span class="w-4 h-4 spr-box inline-block">${itemSvg(id)}</span>${esc(DATA.items[id]?.name || id)}</button>`
              ).join('')}
            </div>
          </div>`).join('')}
        </div>
      </section>
      <section class="card rounded-xl p-4">
        <h3 class="font-bold text-sm mb-3">Paquets &amp; assortiments de la Maison (${DATA.packs.length})</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5">
          ${DATA.packs.map(p => `<div class="surf rounded-lg p-2.5 flex items-center gap-2.5">
            <div class="w-10 h-10 spr-box shrink-0">${p.item ? itemSvg(p.item) : itemSvg('crate')}</div>
            <div class="text-xs"><div class="font-semibold">${esc(p.name)} ${p.bonus ? `<span class="muted">(+${Math.round(p.bonus*100)}%)</span>` : ''}</div><div class="muted">${esc(p.blurb)}</div></div>
          </div>`).join('')}
        </div>
      </section>
    </div>`;
  }

  $('#main').innerHTML = `
    <div class="space-y-4">
      <div class="card rounded-xl p-4 space-y-3">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div class="flex flex-wrap gap-1.5" id="prod-modes">
            ${modes.map(([k, lbl]) => `<button data-m="${k}" class="pill ${S.prodMode === k ? 'active' : ''} text-xs px-3 py-1.5 rounded-full cursor-pointer">${lbl}</button>`).join('')}
          </div>
          ${S.prodMode !== 'special' ? `<input id="prod-q" type="search" value="${esc(S.prodQ)}" placeholder="Nom de produit ou d’ingrédient…" class="surf rounded-lg px-3 py-1.5 text-sm w-full sm:w-64 outline-none" />` : ''}
        </div>
        ${S.prodMode === 'machines' ? `<div class="flex flex-wrap items-center gap-3 text-xs">
          <label class="flex items-center gap-1.5">Usine :
            <select id="prod-mach" class="surf rounded-lg px-2 py-1">
              <option value="all">Toutes les 48 usines</option>
              ${machList.map(m => `<option value="${m.id}" ${S.prodMach === m.id ? 'selected' : ''}>${esc(m.name)} (niv. ${m.reqLvl})</option>`).join('')}
            </select>
          </label>
          <label class="flex items-center gap-1.5">Tri :
            <select id="prod-sort" class="surf rounded-lg px-2 py-1">
              <option value="lvl" ${S.prodSort === 'lvl' ? 'selected' : ''}>Niveau</option>
              <option value="price" ${S.prodSort === 'price' ? 'selected' : ''}>Prix décroissant</option>
              <option value="name" ${S.prodSort === 'name' ? 'selected' : ''}>Alphabétique</option>
            </select>
          </label>
          <label class="flex items-center gap-2">Niveau max : <b id="prod-lvl-v">${S.prodMaxLvl}</b>
            <input id="prod-lvl" type="range" min="1" max="80" value="${S.prodMaxLvl}" class="w-28" />
          </label>
        </div>` : ''}
      </div>
      ${body}
    </div>
  `;

  $$('#prod-modes button').forEach(b => b.onclick = () => { S.prodMode = b.dataset.m; renderProducts(); });
  const pq = $('#prod-q');
  if (pq) pq.oninput = e => { S.prodQ = e.target.value; renderProducts(); $('#prod-q').focus(); $('#prod-q').setSelectionRange(S.prodQ.length, S.prodQ.length); };
  const pm = $('#prod-mach');
  if (pm) pm.onchange = e => { S.prodMach = e.target.value; renderProducts(); };
  const ps = $('#prod-sort');

// ---- ONGLET 3 : GÉNÉRATEUR GÉNÉTIQUE (+ ROBES DU HARAS) ----
function currentBaseSvg() {
  if (S.genMode === 'plants') return S.genStage === 'item' ? itemSvg(S.genId) : plantSvg(S.genId, +S.genStage);
  if (S.genMode === 'animals') {
    const fs = DATA.genetics.speciesFeatures[S.genId] || [];
    const code = fs.map(f => S.genFeat[f] || 0).join('');
    const key = code && !/^0*$/.test(code) ? `${S.genId}~${code}` : S.genId;
    return animSvg(key);
  }
  return horseSvg({ robe: S.horseRobe, marks: S.horseMarks, stage: S.horseStage, shoes: S.horseShoes, coat: S.horseCoat, gearSet: S.horseGear });
}

  const bottleSvg = renderBeerSvg({ mead, malt: S.brewMalt, honey: S.brewHoney, ings: S.brewIngs, stars: ev.stars, aged: !!S.brewBarrel });

  const allIngs = [...A.brewable, ...Object.keys(A.brewExtra)].sort((a,b) => (DATA.items[a]?.name || a).localeCompare(DATA.items[b]?.name || b, 'fr'));

  const maxNote = Math.max(5, ...ev.profile);

  $('#main').innerHTML = `

          <div class="flex flex-col items-center text-center">

        else if (cid === 'sahti') { S.brewMalt = 'maltBrown'; S.brewHop = 2; }
        else if (cid === 'kriek') { S.brewMalt = 'maltBlond'; S.brewHop = 1; }
        else if (cid === 'pumpkinAle') { S.brewMalt = 'maltAmber'; S.brewHop = 1; }
      }
    } else {
      const c = A.meadClassics.find(x => x.id === cid);
      if (c) S.brewIngs = [[c.any[0], 2]];
    }
    renderBrewery();
  });

  $('#brew-clear').onclick = () => { S.brewIngs = []; S.brewBarrel = ''; renderBrewery(); };
  $('#brew-rand3').onclick = () => {
    const pool = [...A.brewable, ...Object.keys(A.brewExtra)];
    const pick = arr => arr[Math.floor(Math.random() * arr.length)];
    for (let t = 0; t < 200; t++) {
      const n = 2 + Math.floor(Math.random() * (maxSlots - 1));
      const set = new Set();
      while (set.size < n) set.add(pick(pool));
      const ings = [...set].map(id => [id, 1 + Math.floor(Math.random() * 3)]);
      const m = mead ? pick(Object.keys(DATA.honeys)) : pick(A.maltIds);
      const h = mead ? 0 : 1 + Math.floor(Math.random() * 3);
      if (evalBrew(S.brewMode, m, h, ings, '').stars === 3) {
        if (mead) S.brewHoney = m; else { S.brewMalt = m; S.brewHop = h; }
        S.brewIngs = ings;
        renderBrewery();
        return;
      }
    }
    showToast('Essayez à nouveau !');
  };
}

function evalPerfume(head, heart, base, method, conc) {
  const PF = DATA.perfume;
  const m = PF.methods[method] || PF.methods.enfleurage;
  const c = PF.concs[conc] || PF.concs.fraiche;
  const topOf = v => v.indexOf(Math.max(...v));
  const profile = [0, 0, 0, 0, 0];
  for (const [tier, id] of [['head', head], ['heart', heart], ['base', base]]) {
    const nd = PF.notes[id];
    if (!nd) continue;
    const mult = m.tier === tier ? 1.25 : 1;
    nd.v.forEach((x, k) => (profile[k] += Math.round(x * mult)));
  }
  profile[m.facet] += m.boost;
  const classic = PF.classics.find(cl => cl.head.includes(head) && cl.heart.includes(heart) && cl.base.includes(base)) || null;
  const hd = PF.notes[head], cd = PF.notes[heart], bd = PF.notes[base];
  const top = topOf(profile);
  const family = (hd && hd.tag === 'boreal') || (cd && cd.tag === 'boreal') ? 'boreal' : top === 0 ? (hd && hd.tag === 'aromatique' ? 'aromatique' : 'hesperide') : ['hesperide', 'floral', 'boise', 'oriental', 'gourmand'][top];
  const order = profile.map((v, k) => [v, k]).sort((a, b) => b[0] - a[0]);
  const [a, b] = [order[0][1], order[1][1]];
  let score = 0;
  const reasons = [];
  if (classic) { score += 2; reasons.push(classic.text); }
  if (order[1][0] >= order[0][0] * 0.35 && order[1][0] > 0) {
    const pair = PF.pairs[`${Math.min(a, b)}-${Math.max(a, b)}`] || 0;
    if (pair > 0) { score += 1; reasons.push(`${PF.facets[a]} et ${PF.facets[b].toLowerCase()} s’accordent à merveille.`); }
    else if (pair < 0) { score -= 1; reasons.push(`${PF.facets[a]} et ${PF.facets[b].toLowerCase()} se heurtent.`); }
  }
  const tId = m.tier === 'head' ? head : m.tier === 'heart' ? heart : base;
  if (PF.notes[tId] && topOf(PF.notes[tId].v) === m.facet) { score += 1; reasons.push(`La ${m.name.toLowerCase()} sublime l’étage ${m.tier === 'head' ? 'de tête' : m.tier === 'heart' ? 'de cœur' : 'de fond'}.`); }
  const tops = [topOf(hd.v), topOf(cd.v), topOf(bd.v)];
  if (new Set(tops).size === 3) { score += 1; reasons.push('Pyramide riche : trois facettes distinctes.'); }
  const stars = Math.max(0, Math.min(3, score));
  const raw = ((DATA.items[head]?.sell || 40) + (DATA.items[heart]?.sell || 40) + (DATA.items[base]?.sell || 40)) * c.qty;
  const baseVal = (raw * PF.cfg.priceMult + c.stageSec * 0.25) / c.bottles;
  const value = Math.max(25, Math.round((baseVal * m.valMult * c.valMult * PF.cfg.harmony[stars]) / 5) * 5);
  const deepVal = Math.max(25, Math.round((value * 1.54) / 5) * 5);
  const color = pfMixHex(hd?.col, cd?.col, bd?.col);
  const stageSec = Math.round(c.stageSec * m.timeMult);
  const name = classic ? classic.name : `${conc === 'extrait' ? 'Extrait' : conc === 'toilette' ? 'Parfum' : 'Eau'} ${(DATA.items[heart]?.name || heart).toLowerCase()} & ${(DATA.items[base]?.name || base).toLowerCase()}`;
  return { profile, classic, family, stars, reasons, value, deepVal, color, stageSec, totalSec: stageSec * 3, bottles: c.bottles, qty: c.qty, name };
}

              <div class="flex items-center gap-2 text-xs">
                <span class="w-20 muted">${f}</span>
                <div class="flex-1 h-2.5 surf rounded-full overflow-hidden"><div class="h-full rounded-full" style="width:${Math.round((ev.profile[k] / maxF) * 100)}%;background:${PF.facetCol[k]}"></div></div>
                <span class="w-6 text-right font-mono">${ev.profile[k]}</span>
              </div>`).join('')}
            </div>
          </div>

          ${ev.reasons.length ? `<ul class="mt-3 space-y-1 text-xs muted">${ev.reasons.map(r => `<li>• ${esc(r)}</li>`).join('')}</ul>` : ''}
        </div>

        <div class="card rounded-xl p-4 space-y-2">
          <div class="flex items-center justify-between"><h3 class="font-bold text-sm">Les ${PF.classics.length} Grands Classiques (+2★)</h3><button id="pf-rand3" class="btn-pri text-xs px-2.5 py-1 rounded-lg cursor-pointer">🎲 Accord 3★</button></div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">${PF.classics.map(cl => `
            <button data-pf-cls="${cl.id}" class="text-left surf hover:border-amber-500 border rounded-lg p-2.5 cursor-pointer">
              <div class="font-semibold text-xs">★ ${esc(cl.name)}</div>
              <div class="text-[11px] muted mt-0.5">${esc(cl.text)}</div>
            </button>`).join('')}
          </div>
        </div>
      </div>

      <div class="lg:col-span-7 space-y-4">
        <div class="card rounded-xl p-4 space-y-3">
          <h3 class="font-bold text-sm">Pyramide olfactive, méthode, concentration &amp; flaconnage</h3>
          <div class="grid grid-cols-3 gap-2">
            ${[['head', 'Tête', S.pfHead], ['heart', 'Cœur', S.pfHeart], ['base', 'Fond', S.pfBase]].map(([t, lbl, id]) => `
              <button data-pf-tier="${t}" class="p-2.5 rounded-xl border text-left cursor-pointer ${S.pfTier === t ? 'ring-2 ring-amber-500 border-amber-500' : ''} surf">
                <div class="text-[10px] uppercase font-bold muted">${lbl} (×${ev.qty})</div>
                <div class="flex items-center gap-2 mt-1"><div class="w-7 h-7 shrink-0">${itemSvg(id)}</div><div class="text-xs font-semibold truncate">${esc(DATA.items[id]?.name || id)}</div></div>
              </button>`).join('')}
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div><div class="text-xs muted mb-1">Méthode d’extraction</div><div class="flex flex-wrap gap-1.5">${PF.methodIds.map(m => `<button data-pf-m="${m}" class="pill ${S.pfMethod === m ? 'active' : ''} px-2.5 py-1 rounded-lg text-xs cursor-pointer">${PF.methods[m].name}</button>`).join('')}</div></div>
            <div><div class="text-xs muted mb-1">Concentration</div><div class="flex flex-wrap gap-1.5">${PF.concIds.map(c => `<button data-pf-c="${c}" class="pill ${S.pfConc === c ? 'active' : ''} px-2.5 py-1 rounded-lg text-xs cursor-pointer">${PF.concs[c].name}</button>`).join('')}</div></div>
            <div><div class="text-xs muted mb-1">Silhouette du flacon</div><div class="flex flex-wrap gap-1.5">${PF.bottleIds.map(b => `<button data-pf-b="${b}" class="pill ${S.pfBottle === b ? 'active' : ''} px-2.5 py-1 rounded-lg text-xs cursor-pointer">${PF.bottles[b].name}</button>`).join('')}</div></div>
            <div><div class="text-xs muted mb-1">Bouchon</div><div class="flex flex-wrap gap-1.5">${PF.capIds.map(c => `<button data-pf-cap="${c}" class="pill ${S.pfCap === c ? 'active' : ''} px-2.5 py-1 rounded-lg text-xs cursor-pointer">${PF.caps[c].name}</button>`).join('')}</div></div>
          </div>
        </div>

        <div class="card rounded-xl p-4 space-y-3">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <h3 class="font-bold text-sm">L’Orgue · ${S.pfTier === 'head' ? `Notes de tête (${PF.head.length})` : S.pfTier === 'heart' ? `Notes de cœur (${PF.heart.length})` : `Notes de fond (${PF.base.length})`}</h3>
            <input id="pf-q" type="search" value="${esc(S.pfQ)}" placeholder="Filtrer une essence…" class="surf border rounded-lg px-2.5 py-1 text-xs w-44">
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2">${filtered.map(id => {
            const nd = PF.notes[id];
            const top = nd.v.indexOf(Math.max(...nd.v));
            const active = (S.pfTier === 'head' ? S.pfHead : S.pfTier === 'heart' ? S.pfHeart : S.pfBase) === id;
            return `<button data-pf-note="${id}" class="flex items-center gap-2 p-2 rounded-lg border text-left cursor-pointer ${active ? 'border-amber-500 ring-2 ring-amber-500/40' : ''} surf">
              <div class="w-8 h-8 shrink-0">${itemSvg(id)}</div>
              <div class="min-w-0 flex-1"><div class="text-xs font-semibold truncate">${esc(DATA.items[id]?.name || id)}</div><div class="text-[10px] muted">${PF.facets[top]} (${nd.v[top]})</div></div>
            </button>`;
          }).join('')}</div>
        </div>
      </div>
    </div>
  `;

  $$('[data-pf-tier]').forEach(b => b.onclick = () => { S.pfTier = b.dataset.pfTier; renderPerfumery(); });
  $$('[data-pf-note]').forEach(b => b.onclick = () => {
    if (S.pfTier === 'head') S.pfHead = b.dataset.pfNote;
    else if (S.pfTier === 'heart') S.pfHeart = b.dataset.pfNote;
    else S.pfBase = b.dataset.pfNote;
    renderPerfumery();
  });
  $$('[data-pf-m]').forEach(b => b.onclick = () => { S.pfMethod = b.dataset.pfM; renderPerfumery(); });
  $$('[data-pf-c]').forEach(b => b.onclick = () => { S.pfConc = b.dataset.pfC; renderPerfumery(); });
  $$('[data-pf-b]').forEach(b => b.onclick = () => { S.pfBottle = b.dataset.pfB; renderPerfumery(); });
  $$('[data-pf-cap]').forEach(b => b.onclick = () => { S.pfCap = b.dataset.pfCap; renderPerfumery(); });
  $$('[data-pf-cls]').forEach(b => b.onclick = () => {
    const cl = PF.classics.find(x => x.id === b.dataset.pfCls);
    if (cl) { S.pfHead = cl.head[0]; S.pfHeart = cl.heart[0]; S.pfBase = cl.base[0]; renderPerfumery(); }
  });
  $('#pf-rand3').onclick = () => {
    const pick = arr => arr[Math.floor(Math.random() * arr.length)];
    for (let t = 0; t < 200; t++) {
      const h = pick(PF.head), c = pick(PF.heart), b = pick(PF.base), m = pick(PF.methodIds);
      if (evalPerfume(h, c, b, m, S.pfConc).stars === 3) { S.pfHead = h; S.pfHeart = c; S.pfBase = b; S.pfMethod = m; renderPerfumery(); return; }
    }
  };
  const pq = $('#pf-q');
  if (pq) pq.oninput = e => { S.pfQ = e.target.value; renderPerfumery(); $('#pf-q').focus(); $('#pf-q').setSelectionRange(S.pfQ.length, S.pfQ.length); };
}

function renderActiveTab() {
  $$('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === S.tab));
  if (S.tab === 'sprites') renderSprites();
  else if (S.tab === 'products') renderProducts();
  else if (S.tab === 'genetics') renderGenetics();
  else if (S.tab === 'perfume') renderPerfumery();
  else renderBrewery();
}

// ---- Boot ----
loadPayload().then(payload => {
  SPR = payload.sprites;
  DATA = payload.data;
  USED_IN = {};
  for (const r of Object.values(DATA.recipes)) {
    for (const k of Object.keys(r.ing)) (USED_IN[k] ||= []).push(r.id);
  }
  $('#hdr-logo').innerHTML = animSvg('cow');
  $('#hdr-ver').textContent = 'v' + DATA.version;
  const totalSpr = Object.keys(SPR.items).length + Object.keys(SPR.animals).length + Object.keys(SPR.machines).length + Object.keys(SPR.ui).length + Object.keys(SPR.people).length + Object.keys(SPR.buildings).length + SPR.farmhouses.length + Object.keys(SPR.vehicles).length;
  $('#hdr-stats').textContent = `${fmt(Object.keys(DATA.items).length)} produits · ${fmt(totalSpr)} sprites · ${Object.keys(DATA.machines).length} ateliers`;
  $$('#tabs button').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; renderActiveTab(); });
  const applyTheme = dark => {
    document.documentElement.classList.toggle('dark', dark);
    $('#theme-btn').textContent = dark ? '☀️' : '🌙';
  };
  const savedTheme = (() => { try { return localStorage.getItem('meuh-codex-theme'); } catch { return null; } })();
  applyTheme(savedTheme ? savedTheme === 'dark' : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  $('#theme-btn').onclick = () => {
    const next = !document.documentElement.classList.contains('dark');
    applyTheme(next);
    try { localStorage.setItem('meuh-codex-theme', next ? 'dark' : 'light'); } catch {}
  };
  $('#loading').classList.add('hidden');
  $('#app').classList.remove('hidden');
  renderActiveTab();
}).catch(err => {
  $('#loading').textContent = 'Erreur de chargement : ' + err.message;
});
</script>
</body>
</html>
