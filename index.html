eilleures, m\xEAme si les merles en mangent la moiti\xE9. On leur laisse\xA0: ils chantent pour nous en \xE9change.",croissant:"Feuilleter la p\xE2te prend toute une matin\xE9e. Ton grand-p\xE8re appelait \xE7a \xAB\xA0mes heures de silence\xA0\xBB. Moi, j\u2019appelais \xE7a \xAB\xA0mes heures sans lui dans la cuisine\xA0\xBB.",quiche:"Une quiche, c\u2019est l\u2019endroit o\xF9 les l\xE9gumes oubli\xE9s au fond du panier retrouvent une deuxi\xE8me chance. Comme les gens, au fond.",brioche:"Pour la f\xEAte du village, on faisait une brioche si grande qu\u2019il fallait deux hommes pour la porter. L\u2019ann\xE9e o\xF9 Marcel l\u2019a fait tomber, on en parle encore.",strawberryCake:"Le fraisier, c\u2019\xE9tait le g\xE2teau de nos fian\xE7ailles. Papi Lucien en a mang\xE9 trois parts avant de faire sa demande. Il disait qu\u2019il lui fallait du courage.",pizza:"Un \xE9t\xE9, des cousins d\u2019Italie nous ont appris la pizza. Ton grand-p\xE8re a voulu y mettre du fromage de ch\xE8vre et des noix. Les cousins ne sont jamais revenus.",peachTart:"Les p\xEAches de vigne, on les cueillait au petit matin, encore fra\xEEches de la nuit. Tu sens ce parfum\xA0? C\u2019est l\u2019\xE9t\xE9 tout entier dans une tarte.",spongeCake:"Le g\xE2teau de Savoie doit \xEAtre si l\xE9ger qu\u2019il pourrait s\u2019envoler. Le mien s\u2019est envol\xE9 une fois\xA0: j\u2019avais oubli\xE9 la fen\xEAtre ouverte et le chat a fait le reste.",blueberryPie:"Les myrtilles se cueillent \xE0 genoux, la bouche bleue. On revenait de la montagne avec plus de myrtilles dans le ventre que dans le panier.",muffins:"Ta tante a rapport\xE9 cette recette d\u2019Angleterre. Je l\u2019ai un peu chang\xE9e. Beaucoup chang\xE9e, m\xEAme. Bon, ce ne sont plus vraiment des muffins.",focaccia:"Il faut enfoncer les doigts dans la p\xE2te, bien profond, comme dans le sable mouill\xE9. C\u2019est la recette pr\xE9f\xE9r\xE9e des enfants\xA0: ils ont le droit de faire des trous.",garlicBread:"Le pain \xE0 l\u2019ail \xE9loigne les vampires, les rhumes et les amoureux. Ton grand-p\xE8re en mangeait avant chaque bal. Je l\u2019ai \xE9pous\xE9 quand m\xEAme.",easterCake:"\xC0 P\xE2ques, on cachait les \u0153ufs et le g\xE2teau. Les enfants trouvaient toujours les \u0153ufs. Le g\xE2teau, c\u2019est le chien qui le trouvait.",pumpkinPie:"La tarte \xE0 la citrouille vient d\u2019Am\xE9rique, d\u2019apr\xE8s Lucie. Moi je dis qu\u2019elle vient de notre potager, puisque c\u2019est l\xE0 qu\u2019on cueille la citrouille.",vanillaFlan:"Une gousse de vanille, \xE7a co\xFBtait une fortune quand j\u2019\xE9tais petite. On la rin\xE7ait et on la r\xE9utilisait trois fois. Le troisi\xE8me flan sentait surtout l\u2019espoir.",buche:"La b\xFBche de No\xEBl, je la d\xE9core avec des champignons en meringue. Ton cousin a cru que c\u2019\xE9taient des vrais et n\u2019en a pas mang\xE9 pendant dix ans.",sauce:"La sauce tomate doit mijoter longtemps, et il faut la go\xFBter souvent. C\u2019est pour \xE7a que la cuisini\xE8re n\u2019a jamais faim \xE0 table.",cornbread:"Le pain de ma\xEFs est jaune comme un soleil d\u2019hiver. Quand il fait gris dehors, j\u2019en fais un\xA0: \xE7a \xE9claire la cuisine.",pie:"Ma premi\xE8re tarte aux pommes, je l\u2019ai rat\xE9e. Ton grand-p\xE8re l\u2019a mang\xE9e quand m\xEAme et a dit qu\u2019elle \xE9tait \xAB\xA0croustillante\xA0\xBB. Elle \xE9tait br\xFBl\xE9e.",jam:"Le jour des confitures, toute la maison sentait le sucre chaud. Les gu\xEApes venaient de trois villages pour nous rendre visite.",soup:"La soupe de citrouille, c\u2019est la soupe des soirs de brouillard. Une louche, une couverture, et on \xE9coute la pluie sur le toit.",salad:"Une salade du jardin se cueille cinq minutes avant le repas, pas une de plus. Apr\xE8s, elle se met \xE0 bouder.",ratatouille:"Chaque l\xE9gume cuit \xE0 part, puis on les marie \xE0 la fin. Comme une famille\xA0: chacun son caract\xE8re, et tout le monde \xE0 la m\xEAme table.",gingerbread:"Le pain d\u2019\xE9pices de ma m\xE8re avait un secret. Elle l\u2019a emport\xE9 avec elle. Je cherche encore. Je crois que c\u2019\xE9tait un peu d\u2019orange.",yogurt:"Le yaourt au miel, c\u2019est le go\xFBter de ceux qui ont \xE9t\xE9 sages. Ou de ceux qui l\u2019ont \xE9t\xE9 presque. Je ne suis pas tr\xE8s s\xE9v\xE8re.",gratin:"Pas de fromage dans le gratin dauphinois\xA0! Ton grand-p\xE8re en mettait en cachette. Nous nous sommes disput\xE9s \xE0 ce sujet pendant cinquante ans.",omelette:"On casse les \u0153ufs d\u2019une main, sans regarder. Il m\u2019a fallu deux cents \u0153ufs pour y arriver. Les poules me regardaient de travers.",peasCarrots:"\xC9cosser les petits pois sur le banc, l\u2019apr\xE8s-midi, en racontant des histoires. Le meilleur moment de l\u2019\xE9t\xE9, et pourtant on travaillait.",grilledFish:"Tonton Marcel jure que ses poissons sont toujours plus gros quand il les raconte que quand il les rapporte. Grill\xE9s, ils r\xE9tr\xE9cissent encore.",mash:"La pur\xE9e maison se fait avec un presse-pur\xE9e et de la patience. Le beurre, c\u2019est pour la patience. On en met beaucoup.",crepes:"\xC0 la Chandeleur, on fait sauter la premi\xE8re cr\xEApe en tenant une pi\xE8ce dans la main. Ton grand-p\xE8re en a coll\xE9 une au plafond. Elle y est rest\xE9e trois jours.",potee:"La pot\xE9e mijote toute la matin\xE9e. \xC0 midi, toute la ferme sait ce qu\u2019on mange, m\xEAme les vaches qui passent la t\xEAte par la fen\xEAtre.",fruitSalad:"Une salade de fruits, c\u2019est l\u2019excuse parfaite pour go\xFBter chaque fruit en coupant. Il en reste toujours moins que pr\xE9vu dans le saladier.",garlicSoup:"La soupe \xE0 l\u2019ail gu\xE9rit tout, d\u2019apr\xE8s mon p\xE8re. Sauf la solitude\xA0: avec l\u2019haleine qu\u2019elle donne, personne ne s\u2019approche.",risotto:"Le risotto, il faut le tourner sans arr\xEAt et ne jamais le quitter des yeux. C\u2019est un plat jaloux.",ricePudding:"Le riz au lait de mon enfance avait une peau sur le dessus. Mon fr\xE8re et moi nous la disputions. C\u2019\xE9tait la meilleure partie.",sushi:"Lucie m\u2019a appris les sushis. J\u2019ai fini par r\xE9ussir \xE0 les rouler. Ton grand-p\xE8re, lui, les a mang\xE9s avec une fourchette, et il \xE9tait content.",stirTofu:"Le tofu, au d\xE9but, je ne savais pas quoi en faire. Maintenant je sais\xA0: il prend le go\xFBt de tout ce qu\u2019on lui donne. Un vrai cam\xE9l\xE9on.",tian:"Le tian, c\u2019est une rosace de l\xE9gumes. Les jours de patience, je fais des spirales parfaites. Les autres jours, des spirales\u2026 artistiques.",caprese:"Tomate, mozzarella, basilic\xA0: trois couleurs, trois ingr\xE9dients, z\xE9ro cuisson. Le plat pr\xE9f\xE9r\xE9 des cuisini\xE8res fatigu\xE9es.",bouillabaisse:"Marcel pr\xE9tend qu\u2019une vraie bouillabaisse demande sept poissons. Il n\u2019en attrape jamais que cinq, alors il en invente deux.",lobsterDish:"Un homard, \xE7a se m\xE9rite. La premi\xE8re fois, il m\u2019a pinc\xE9 le doigt. Depuis, je le regarde droit dans les yeux, et c\u2019est moi qui gagne.",grilledMackerel:"Le maquereau grill\xE9 se mange sur le port, avec les doigts, en regardant les bateaux rentrer. Il a meilleur go\xFBt l\xE0-bas qu\u2019ailleurs.",raclette:"La raclette, c\u2019est le plat o\xF9 chacun s\u2019occupe de son fromage. On parle moins, on mange plus, et personne ne se plaint de la cuisine.",fondue:"Celui qui perd son pain dans la fondue fait la vaisselle. Ton grand-p\xE8re perdait le sien expr\xE8s\xA0: il aimait faire la vaisselle \xE0 c\xF4t\xE9 de moi.",tartiflette:"La tartiflette, c\u2019est un plat de montagne pour des app\xE9tits de montagne. Apr\xE8s, on fait une sieste de montagne.",mushroomOmelette:"Les champignons, je les cueille \xE0 l\u2019aube dans le sous-bois. Je ne dis jamais o\xF9. M\xEAme toi, mon petit, tu ne le sauras qu\u2019\xE0 mes cent ans.",mushroomRisotto:"Le risotto aux champignons sent la for\xEAt d\u2019automne. Ferme les yeux en le mangeant\xA0: tu entendras presque les feuilles craquer.",giantOmelette:"L\u2019omelette g\xE9ante de la f\xEAte de P\xE2ques demandait cent \u0153ufs. Il fallait la retourner \xE0 quatre. Une ann\xE9e, elle est tomb\xE9e dans l\u2019herbe. On l\u2019a mang\xE9e quand m\xEAme.",bananasFlambe:"Tiago m\u2019a montr\xE9 les bananes flamb\xE9es. J\u2019ai mis trop de flamme. Le rideau s\u2019en souvient encore, et moi aussi.",coconutRice:"Le riz au lait de coco, c\u2019est mon riz au lait de toujours, parti en voyage sur l\u2019\xEEle. Il est revenu bronz\xE9.",coconutCurry:"Ma\xEBva m\u2019a appris le curry au coco. Elle compte les \xE9pices sur ses doigts, comme une comptine. Je chante la comptine en cuisinant.",sweetPotatoMash:"La patate douce a le go\xFBt d\u2019une pomme de terre qui aurait pris des vacances au soleil. Je l\u2019\xE9crase avec un peu de beurre sal\xE9, pour la ramener chez nous.",cassavaCakes:"Sur l\u2019\xEEle, les galettes de manioc se partagent au bord de l\u2019eau. Ici, on les partage au bord de la chemin\xE9e. \xC7a marche aussi.",guacamole:"Un avocat bien m\xFBr c\xE8de sous le pouce, sans \xEAtre mou. Comme ton grand-p\xE8re quand je lui demandais de danser.",exoticSalad:"Mangue, ananas, citron vert\xA0: une salade qui sent les vacances. Je la mange en hiver, en fermant les volets et en imaginant la mer.",accras:"Les accras de Ma\xEBva sont plus l\xE9gers que les miens. Elle dit que c\u2019est parce qu\u2019elle les fait en riant. J\u2019essaie de rire, ils restent lourds.",smokedTrout:"Le fumoir de Marcel sent la truite \xE0 trois champs \xE0 la ronde. Les chats du village y font la queue comme \xE0 la boulangerie.",fishSoup:"La soupe de poisson se sert avec des cro\xFBtons, de l\u2019ail et de la rouille. Et beaucoup de serviettes, surtout pour ton grand-p\xE8re.",fishFritters:"Les beignets de poisson, c\u2019est le seul moyen de faire manger du poisson \xE0 ton cousin. Il croit encore que ce sont des beignets de pomme.",smokedEel:"L\u2019anguille fum\xE9e, c\u2019est un go\xFBt d\u2019autrefois. Marcel dit que c\u2019est un poisson qui se croit serpent. Moi je dis que c\u2019est un r\xE9gal qui se croit timide.",carpStew:"La matelote de carpe se faisait au vin, le dimanche, quand le cur\xE9 venait manger. Il revenait souvent, le cur\xE9.",pikeTerrine:"Le brochet a plein d\u2019ar\xEAtes et un mauvais caract\xE8re. En terrine, il devient doux comme un agneau. Il faut savoir parler aux poissons.",juice:"Le jus de pomme du pressoir se boit tout de suite, encore trouble. Le lendemain, il est d\xE9j\xE0 une autre boisson. Il ne faut pas le faire attendre.",carrotJuice:"Le jus de carotte, para\xEEt-il, fait voir dans le noir. Ton grand-p\xE8re en buvait pour retrouver ses lunettes. \xC7a n\u2019a jamais march\xE9.",cider:"Le cidre, c\u2019est l\u2019affaire des grands. Les enfants, eux, avaient droit au jus et au droit de tourner la manivelle du pressoir. Ils pr\xE9f\xE9raient la manivelle.",orangeJuice:"Les oranges ne poussaient pas chez nous quand j\u2019\xE9tais petite. Une orange \xE0 No\xEBl, c\u2019\xE9tait un tr\xE9sor. J\u2019en garde toujours une dans ma poche, au cas o\xF9.",watermelonJuice:"Le jus de past\xE8que, c\u2019est de l\u2019\xE9t\xE9 qu\u2019on peut boire. Il faut juste enlever les p\xE9pins. Ou les cracher le plus loin possible\xA0: c\u2019est plus dr\xF4le.",peachNectar:"Le nectar de p\xEAche se fait avec les p\xEAches trop m\xFBres, celles qui ont trop attendu le soleil. Rien ne se perd dans une ferme.",grapeJuice:"Pendant les vendanges, Margaux donne du jus de raisin aux enfants pour qu\u2019ils ne mangent pas tout le raisin. Ils boivent le jus et mangent le raisin.",blueberryJuice:"Le jus de myrtille tache tout\xA0: les doigts, les dents, les nappes. Je mets une vieille nappe. Ma vieille nappe est enti\xE8rement bleue.",summerPunch:"Le punch de l\u2019\xE9t\xE9 se pr\xE9pare pour la f\xEAte, dans le grand saladier en verre. On y met des fruits, des gla\xE7ons et beaucoup de bonne humeur.",genepiLiqueur:"Le g\xE9n\xE9pi se cueille tout l\xE0-haut, entre les cailloux. Bruno dit que c\u2019est la plante qui a le plus de courage de la montagne. C\u2019est une boisson pour les grands.",pommeau:"Le pommeau vieillit dans le f\xFBt pendant des ann\xE9es, comme moi dans ma cuisine. Nous devenons tous les deux meilleurs, para\xEEt-il.",cloth:"Mon premier tissu \xE9tait trou\xE9 de partout. Je l\u2019ai appel\xE9 \xAB\xA0dentelle\xA0\xBB et je l\u2019ai offert \xE0 ma m\xE8re. Elle l\u2019a mis sur la table pendant trente ans.",angoraYarn:"Le fil angora est si doux qu\u2019on dirait un nuage apprivois\xE9. Les lapins, eux, n\u2019ont pas l\u2019air de savoir qu\u2019ils portent des nuages.",down:"Le duvet vole partout quand on le travaille. Les jours de duvet, toute la cuisine ressemble \xE0 une boule \xE0 neige.",cottonFabric:"La toile de coton est solide et simple. Comme ton grand-p\xE8re. Je lui faisais toutes ses chemises dedans, et il les usait toutes aux coudes.",alpacaYarn:"L\u2019alpaga a l\u2019air de se moquer de tout le monde. Mais sa laine est si chaude qu\u2019on lui pardonne ses airs.",linen:"Le lin, on le cultivait autrefois pour les draps du trousseau. Mes draps de mariage sont encore dans l\u2019armoire. Ils sont plus solides que moi.",coconutRope:"Tiago tresse la corde de coco en chantant. Il dit qu\u2019une corde tress\xE9e sans chanter casse au premier orage. Je chante maintenant aussi.",strawHat:"Le chapeau de paille de ton grand-p\xE8re est accroch\xE9 derri\xE8re la porte. Je ne l\u2019ai jamais rang\xE9. Il prot\xE8ge encore le soleil de l\u2019entr\xE9e.",sweater:"J\u2019ai tricot\xE9 un pull \xE0 ton grand-p\xE8re pour chaque hiver. Le premier avait une manche plus longue que l\u2019autre. C\u2019\xE9tait son pr\xE9f\xE9r\xE9.",tshirt:"Ton cousin a dessin\xE9 une vache sur son t-shirt. Tout le monde a cru que c\u2019\xE9tait un chien. Il dit que c\u2019est de l\u2019art moderne.",scarf:"Une \xE9charpe angora, c\u2019est un c\xE2lin qu\u2019on peut porter toute la journ\xE9e. J\u2019en tricote une \xE0 chaque personne que j\u2019aime. J\u2019en ai tricot\xE9 beaucoup.",pillow:"Les coussins de plumes, il faut les secouer chaque matin. Ton grand-p\xE8re appelait \xE7a \xAB\xA0r\xE9veiller les oies\xA0\xBB.",quilt:"Ma couette est faite de morceaux de toutes les robes de ma vie. Chaque carr\xE9 est un souvenir. Je dors dans mes souvenirs, et je dors bien.",colorSweater:"Le pull color\xE9, c\u2019est le pull des jours gris. On ne peut pas \xEAtre triste dans un pull orange, rouge et bleu. C\u2019est impossible, j\u2019ai essay\xE9.",woolHat:"Le bonnet de laine doit tomber un peu sur les oreilles. Sinon, \xE0 quoi bon\xA0? Les oreilles froides sont les plus malheureuses du corps.",alpacaScarf:"Une \xE9charpe en alpaga, c\u2019est la chose la plus chaude qui existe apr\xE8s une grand-m\xE8re. Et elle ne pose pas de questions sur tes notes.",featherFan:"L\u2019\xE9ventail de plumes de paon, c\u2019\xE9tait la fiert\xE9 de ma tante. Elle s\u2019\xE9ventait m\xEAme en hiver, pour qu\u2019on le remarque.",linenShirt:"La chemise de lin se froisse rien qu\u2019en la regardant. Ton grand-p\xE8re disait que c\u2019\xE9tait la preuve qu\u2019elle \xE9tait vivante.",butter:"Baratter le beurre, c\u2019\xE9tait la corv\xE9e des enfants. On chantait pour aller plus vite. Le beurre ne prenait pas plus vite, mais on chantait mieux.",cream:"La cr\xE8me fra\xEEche se met partout, sauf dans le caf\xE9 de ton grand-p\xE8re. Lui, il la mettait partout, surtout dans le caf\xE9.",cheese:"Mon premier fromage \xE9tait si dur qu\u2019on aurait pu jouer aux boules avec. Ton grand-p\xE8re l\u2019a fait, d\u2019ailleurs. Il a gagn\xE9 la partie.",goatCheese:"Les ch\xE8vres sont t\xEAtues, gourmandes et coquines. Leur fromage, lui, est doux et sage. On se demande d\u2019o\xF9 il tient \xE7a.",soyMilk:"Le lait de soja, c\u2019est Lucie qui m\u2019en a parl\xE9. Les vaches ont eu l\u2019air vex\xE9es. Je les ai rassur\xE9es\xA0: rien ne remplace leur lait.",tofu:"Le tofu, c\u2019est le fromage des haricots. Quand j\u2019ai dit \xE7a \xE0 Ma\xEEtre Anselme, il a failli s\u2019\xE9touffer.",mozzarella:"La mozzarella se file \xE0 la main dans l\u2019eau chaude. On ressort les mains toutes douces. C\u2019est mon soin de beaut\xE9.",camembert:"Le camembert doit couler juste assez. Trop peu, il est vex\xE9\xA0; trop, il s\u2019enfuit de l\u2019assiette.",bleu:"Le bleu des Coteaux a des veines comme une carte de rivi\xE8res. Ma\xEEtre Anselme dit qu\u2019on peut y lire l\u2019avenir. Moi, j\u2019y lis surtout le d\xE9jeuner.",caramel:"Le caramel, il faut le surveiller comme le lait sur le feu, mais en pire. Une seconde de trop et c\u2019est du charbon sucr\xE9.",fruitCandy:"Les bonbons aux fruits, je les mettais dans un bocal tout en haut du buffet. Les enfants ont appris \xE0 grimper tr\xE8s t\xF4t.",nougat:"Le nougat colle aux dents comme un bon souvenir colle au c\u0153ur. Ton grand-p\xE8re y a laiss\xE9 une dent, un No\xEBl. Il a ri quand m\xEAme.",marshmallow:"Les guimauves se grillent au bout d\u2019un b\xE2ton, au-dessus du feu de camp. Les miennes prennent toujours feu. Je les aime comme \xE7a.",candyApple:"La pomme d\u2019amour de la f\xEAte foraine, on la croque et on se casse presque les dents. C\u2019est le prix de l\u2019amour, mon petit.",fruitPaste:"Les p\xE2tes de fruits demandent une heure de cuisson et dix secondes pour dispara\xEEtre. C\u2019est une recette injuste, mais d\xE9licieuse.",yuleLog:"La b\xFBche en confiserie, je la fais avec les enfants. Ils mettent plus de sucre dessus que dans leur bouche. Enfin, presque.",witchCandy:"Les bonbons de la sorci\xE8re, pour Halloween, sont verts et violets. Personne n\u2019ose les go\xFBter le premier. Ils sont pourtant \xE0 la pomme.",sugarEggs:"Les \u0153ufs en sucre de P\xE2ques se cachent dans l\u2019herbe. Il faut les retrouver avant les fourmis. Les fourmis gagnent souvent.",coconutRocks:"Les rochers coco, c\u2019est Ma\xEBva qui m\u2019en a donn\xE9 l\u2019id\xE9e. Ils sont plus doux que les rochers de la plage, et on peut les manger.",guavaPaste:"La p\xE2te de goyave se coupe en petits cubes et se mange avec du fromage, sur l\u2019\xEEle. J\u2019\xE9tais sceptique. J\u2019avais tort.",strawberryIce:"La glace \xE0 la fraise se mange avant qu\u2019elle fonde, ce qui n\u2019est jamais un probl\xE8me avec les enfants.",honeyIce:"La glace au miel, c\u2019est le dessert des abeilles en vacances. Elles viennent toujours la regarder fondre au bord de l\u2019assiette.",melonSorbet:"Le sorbet past\xE8que, c\u2019est le dessert le plus frais de l\u2019\xE9t\xE9. On le mange \xE0 l\u2019ombre du tilleul, en ne bougeant presque pas.",peachSorbet:"Le sorbet \xE0 la p\xEAche a la couleur d\u2019un coucher de soleil. Je le mange au coucher du soleil, pour comparer.",sundae:"Une coupe glac\xE9e, c\u2019est une glace qui a mis ses habits du dimanche\xA0: chantilly, coulis, et la cerise sur le dessus.",blueberryIce:"La glace \xE0 la myrtille rend la langue toute bleue. Les enfants font des concours de langue bleue. Je participe. Je gagne.",vanillaIce:"La glace \xE0 la vanille, on dit que c\u2019est la plus simple. C\u2019est faux\xA0: c\u2019est la plus difficile, parce qu\u2019on ne peut rien cacher derri\xE8re.",mangoSorbet:"Le sorbet \xE0 la mangue vient de l\u2019\xEEle. Il fond plus vite que les autres, comme s\u2019il voulait rentrer chez lui.",coconutIce:"La glace coco a le go\xFBt de la plage, du sable chaud et des vacances. M\xEAme en janvier, au coin du feu.",passionSorbet:"Le fruit de la passion porte bien son nom\xA0: acide, sucr\xE9, et un peu d\xE9routant. Un peu comme une histoire d\u2019amour.",candle:"Les bougies en cire d\u2019abeille sentent le miel quand elles br\xFBlent. Les soirs de coupure d\u2019\xE9lectricit\xE9, toute la maison sentait le go\xFBter.",lavenderSoap:"Le savon \xE0 la lavande, je le mets dans l\u2019armoire \xE0 linge. Les draps sentent l\u2019\xE9t\xE9 m\xEAme en plein hiver. Les mites d\xE9testent \xE7a.",goatSoap:"Le savon au lait de ch\xE8vre est si doux que les ch\xE8vres devraient \xEAtre jalouses. Mais elles ne se lavent jamais, alors elles s\u2019en fichent.",perfume:"Mon eau de lavande, je la fais depuis toujours. Ton grand-p\xE8re disait qu\u2019il me retrouverait les yeux ferm\xE9s, rien qu\u2019\xE0 l\u2019odeur.",lavenderBag:"Les sachets de lavande se glissent sous l\u2019oreiller pour faire de beaux r\xEAves. Je r\xEAve souvent de champs violets.",scentedCandle:"Une bougie parfum\xE9e, c\u2019est un bouquet qu\u2019on allume. Rose en fait des merveilleuses. Les miennes sentent un peu la cuisine. C\u2019est mon style.",waxBalm:"Le baume \xE0 la cire gu\xE9rit les mains ab\xEEm\xE9es par le travail. Toutes les mains de la ferme en ont un pot dans la poche.",oliveSoap:"Le savon \xE0 l\u2019huile d\u2019olive vient du sud, comme les cigales. Quand je me lave les mains avec, j\u2019entends presque chanter.",donkeySoap:"Le savon au lait d\u2019\xE2nesse, c\u2019\xE9tait le secret de beaut\xE9 d\u2019une reine, d\u2019apr\xE8s Rose. Notre \xE2nesse est bien plus modeste que \xE7a.",donkeyCream:"La cr\xE8me au lait d\u2019\xE2nesse adoucit tout, m\xEAme les mauvaises humeurs. J\u2019en mets un peu sur les joues de ton grand-oncle. \xC7a ne marche pas sur lui.",coconutSoap:"Le savon au coco sent les \xEEles. Je me lave les mains avec et je ferme les yeux\xA0: me voil\xE0 en vacances, pour trente secondes.",plank:"Ton grand-p\xE8re a construit la grange planche apr\xE8s planche, pendant trois \xE9t\xE9s. Il disait qu\u2019une planche bien sci\xE9e chante quand on la pose.",beam:"La grosse poutre de la grange porte la date de notre mariage, grav\xE9e au couteau. Elle tient encore le toit. Comme nous, autrefois.",crate:"Les caisses en bois servent \xE0 tout\xA0: \xE0 ranger les pommes, \xE0 s\u2019asseoir, \xE0 monter atteindre le haut du buffet. Les enfants l\u2019ont compris tr\xE8s vite.",nail:"Jules dit qu\u2019un clou bien forg\xE9 tient cent ans. Il y a des clous de son arri\xE8re-grand-p\xE8re dans le vieux portail. Le portail, lui, tombe en morceaux.",tools:"Les outils de ton grand-p\xE8re sont rang\xE9s dans l\u2019ordre, au-dessus de l\u2019\xE9tabli. Chaque outil a son ombre peinte sur le mur, pour savoir o\xF9 le ranger.",horseshoe:"Un fer \xE0 cheval clou\xE9 au-dessus de la porte porte bonheur, pointes vers le haut pour garder la chance. Le n\xF4tre est \xE0 l\u2019envers. \xC7a explique peut-\xEAtre des choses.",brush:"Le pinceau, je m\u2019en sers pour peindre les volets tous les dix ans. Cette ann\xE9e, je les ai peints en bleu. Ton grand-p\xE8re aurait dit \xAB\xA0en vert\xA0\xBB.",forgeLantern:"Jules a forg\xE9 une lanterne pour chaque maison du hameau. Le soir, on dirait des lucioles qui ont d\xE9cid\xE9 de rester.",weathervane:"La girouette du toit est un coq qui tourne avec le vent. Quand il regarde vers la montagne, il va pleuvoir. Il ne se trompe presque jamais.",sunflowerOil:"Les tournesols suivent le soleil toute la journ\xE9e. Leur huile garde un peu de cette lumi\xE8re. Je trouve qu\u2019elle rend les frites plus gaies.",roastedSeeds:"Les graines grill\xE9es se mangent en les d\xE9cortiquant une par une, en papotant sur le banc. On en mange peu, mais on parle beaucoup.",soyOil:"L\u2019huile de soja, c\u2019est l\u2019huile discr\xE8te, qui ne prend pas toute la place. Il en faut aussi, des gens discrets.",oliveOil:"L\u2019huile d\u2019olive d\u2019une premi\xE8re pression pique un peu la gorge. C\u2019est comme \xE7a qu\u2019on reconna\xEEt la bonne, d\u2019apr\xE8s les gens du sud.",coconutOil:"L\u2019huile de coco devient solide quand il fait froid. Chez nous, elle passe l\u2019hiver en bloc et l\u2019\xE9t\xE9 en flaque.",flowerPot:"Mes pots de fleurs ne sont jamais droits. Rose dit qu\u2019ils ont \xAB\xA0du caract\xE8re\xA0\xBB. Les g\xE9raniums, eux, ne disent rien.",clayBowl:"Le bol en terre de mon petit-d\xE9jeuner est f\xEAl\xE9 depuis quarante ans. Il tient avec de la colle et de l\u2019amour. Je ne le changerai jamais.",vase:"In\xE8s m\u2019a appris \xE0 tourner un vase. Mon premier ressemblait \xE0 une poire fatigu\xE9e. Je l\u2019ai gard\xE9\xA0: il fait un tr\xE8s bon pot \xE0 crayons.",paintedVase:"Sur le vase peint, j\u2019ai dessin\xE9 la ferme. Les vaches ressemblent \xE0 des nuages et les nuages \xE0 des vaches. C\u2019est assez joli, en fait.",honeyPot:"Le pot \xE0 miel a toujours une goutte sur le c\xF4t\xE9 qui colle les doigts. Depuis cent ans, aucune grand-m\xE8re n\u2019a r\xE9ussi \xE0 l\u2019\xE9viter.",teaSet:"Le service \xE0 th\xE9 ne sort que pour les grandes occasions. Ou quand Rose vient, ce qui est la m\xEAme chose.",pasta:"Les p\xE2tes fra\xEEches s\xE8chent sur le dossier des chaises, comme du linge. Les jours de p\xE2tes, on mange debout.",lasagna:"Les lasagnes se font en \xE9tages, comme une maison. Le dernier \xE9tage, c\u2019est le fromage gratin\xE9, et c\u2019est le grenier que tout le monde veut.",ravioli:"Fermer les raviolis avec une fourchette, c\u2019\xE9tait le travail des enfants. Certains raviolis ont plus de trous de fourchette que de farce.",garlicPasta:"Les p\xE2tes \xE0 l\u2019ail se mangent entre amoureux, pour que personne n\u2019ait \xE0 se plaindre de l\u2019autre.",redDye:"La teinture rouge vient de la garance, une plante toute simple. Mes mains sont rest\xE9es roses une semaine. Ton grand-p\xE8re m\u2019appelait \xAB\xA0ma rose\xA0\xBB.",yellowDye:"Le jaune, on l\u2019obtient avec des fleurs des champs. On peut teindre un pull avec un pr\xE9 entier. Les abeilles ne sont pas d\u2019accord.",dyedWool:"La laine teinte s\xE8che sur le fil, rouge, jaune et bleue. De loin, on dirait des drapeaux pour une f\xEAte qui n\u2019a pas encore commenc\xE9.",blueDye:"Le bleu est la couleur la plus difficile. Il faut plonger la laine plusieurs fois, et \xE0 chaque fois elle sort verte avant de devenir bleue. C\u2019est de la magie.",goldLocket:"Dans mon m\xE9daillon dor\xE9, il y a une photo de ton grand-p\xE8re \xE0 vingt ans. Il avait des oreilles d\xE9coll\xE9es et un sourire immense. Il les a gard\xE9s toute sa vie.",amethystRing:"L\u2019am\xE9thyste, on la trouve dans la mine, cach\xE9e dans les pierres grises. Comme les gens\xA0: il faut parfois casser la coquille pour voir ce qu\u2019ils ont de beau.",fossilBrooch:"Cette broche a un coquillage vieux de millions d\u2019ann\xE9es. Il \xE9tait l\xE0 bien avant nous et il sera l\xE0 bien apr\xE8s. \xC7a rend humble, une broche.",greenTea:"Le th\xE9 vert ne doit pas bouillir, sinon il devient amer et f\xE2ch\xE9. Il faut lui parler doucement et le laisser infuser tranquille.",lavenderTea:"La tisane \xE0 la lavande, c\u2019est pour les soirs o\xF9 le sommeil se fait attendre. Une tasse, une histoire, et on ne voit plus la fin de l\u2019histoire.",icedTea:"Le th\xE9 glac\xE9 \xE0 la p\xEAche, je le pr\xE9pare le matin et je le cache au frais. \xC0 midi, il a disparu. Je soup\xE7onne fortement les voisins.",milkTea:"Le th\xE9 au lait, c\u2019est le th\xE9 des Anglais et des grands-m\xE8res. Je suis un peu des deux, \xE0 force.",gingerTea:"Le th\xE9 au gingembre r\xE9chauffe de l\u2019int\xE9rieur, comme un feu de chemin\xE9e qu\u2019on aurait aval\xE9. Parfait pour les rhumes et les c\u0153urs froids.",brownSugar:"La cassonade a le go\xFBt du caramel avant m\xEAme d\u2019\xEAtre cuite. Je la saupoudre sur les cr\xEApes, et les cr\xEApes me remercient.",caneSyrup:"Le sirop de canne coule lentement, comme un dimanche apr\xE8s-midi. On a le temps de faire un v\u0153u avant qu\u2019il touche le fond du verre.",cottonCandy:"La barbe \xE0 papa colle aux joues, aux cheveux et aux souvenirs de f\xEAte foraine. On ne peut pas la manger proprement. C\u2019est fait expr\xE8s.",pralines:"Les pralines roses se mettent dans la brioche, pour qu\u2019elle saigne de sucre quand on la coupe. Les gens de Lyon disent que c\u2019est leur id\xE9e. Je les laisse dire.",cannedSardines:"Les sardines en bo\xEEte se gardent des ann\xE9es. Plus elles vieillissent, meilleures elles sont, dit Morgane. Moi je ne les laisse jamais vieillir\xA0: je les mange.",mackerelRillettes:"Les rillettes de maquereau se tartinent sur du pain grill\xE9, face \xE0 la mer. Si on n\u2019a pas la mer, une photo de la mer suffit.",cannedShrimp:"Les crevettes en bocal, c\u2019est la mer qu\u2019on met en conserve pour l\u2019hiver. On ouvre le bocal et on entend presque les mouettes.",peeledTomatoes:"\xC0 la fin de l\u2019\xE9t\xE9, on mettait des tomates en bocaux pour tout l\u2019hiver. La cuisine ressemblait \xE0 une usine de soleil.",mangoChutney:"Le chutney de mangue, c\u2019est sucr\xE9, \xE9pic\xE9 et un peu acide. Ma\xEBva dit que c\u2019est comme moi. Je ne sais pas si c\u2019est un compliment.",lycheeSyrup:"Les litchis au sirop ressemblent \xE0 des perles. On les mange un par un, en les regardant briller dans la cuill\xE8re.",blondBeer:"La bi\xE8re blonde, c\u2019est la boisson des moissonneurs apr\xE8s une journ\xE9e au soleil. Une boisson pour les grands, \xE0 boire avec mod\xE9ration.",amberBeer:"La bi\xE8re ambr\xE9e a la couleur des feuilles d\u2019automne. Ton grand-p\xE8re la buvait en regardant le soleil se coucher sur les champs. C\u2019est pour les grands.",cherryBeer:"La bi\xE8re \xE0 la cerise est rouge comme un rubis. Les grands la boivent pour les f\xEAtes. Les enfants, eux, ont le jus de cerise, et ils sont bien contents.",mead:"L\u2019hydromel, c\u2019est la plus vieille boisson du monde, faite avec du miel. Les abeilles en sont tr\xE8s fi\xE8res. Elle est pour les grands.",darkChoc:"Le chocolat noir, c\u2019est pour les grandes personnes et les enfants courageux. Il faut le laisser fondre sur la langue, sans le croquer.",milkChoc:"Le chocolat au lait, c\u2019est le chocolat des go\xFBters et des consolations. J\u2019en ai toujours un carr\xE9 dans la poche de mon tablier.",hotChoc:"Le chocolat chaud se boit en revenant de la neige, les doigts gel\xE9s autour du bol. C\u2019est la meilleure r\xE9compense apr\xE8s une bataille de boules de neige.",chocBox:"Un ballotin de chocolats, on l\u2019offre et puis on attend qu\u2019on nous en propose un. Ton grand-p\xE8re m\u2019en offrait un chaque ann\xE9e et en mangeait la moiti\xE9.",chocCake:"Le fondant au chocolat doit rester coulant au milieu. Le mien coule souvent un peu trop. On le mange \xE0 la cuill\xE8re, et tout le monde est content.",beaufort:"Le beaufort se fait avec le lait de l\u2019alpage, quand les vaches mangent les fleurs de la montagne. On sent les fleurs dans le fromage, si on \xE9coute bien.",tomme:"La tomme de montagne a une cro\xFBte grise et un c\u0153ur tendre. Comme Bruno, le berger. Ne le lui dis pas, il serait g\xEAn\xE9.",reblochon:"Le reblochon, c\u2019est le fromage de la tartiflette. Mais le manger seul, sur du pain, en regardant la montagne, c\u2019est encore mieux.",comte:"Un comt\xE9 de trois ans a des petits cristaux qui craquent sous la dent. Ma\xEEtre Anselme dit que c\u2019est le fromage qui a des souvenirs.",redWine:"Le vin rouge de Margaux attend dans les tonneaux pendant que nous attendons, nous, qu\u2019il soit pr\xEAt. C\u2019est une boisson pour les grands, et pour les gens patients.",whiteWine:"Le vin blanc se sert frais, avec le poisson de Marcel, pour les grands. Les enfants ont le jus de raisin, qui vient de la m\xEAme vigne.",roseWine:"Le ros\xE9, c\u2019est le vin des repas d\u2019\xE9t\xE9 sous la tonnelle, chez les grands. On le sert avec des tomates et de bons amis.",champagne:"Le champagne, c\u2019est pour les grandes nouvelles et les grandes personnes. Le jour de ta naissance, ton grand-p\xE8re en a ouvert une bouteille. Le bouchon est encore dans mon tiroir.",champagneRose:"Le champagne ros\xE9, c\u2019est le champagne qui rougit d\u2019\xEAtre si \xE9l\xE9gant. Pour les tr\xE8s grandes occasions, et pour les grands.",lavenderWater:"L\u2019eau de lavande de la parfumerie est plus fine que la mienne. Rose dit que c\u2019est le m\xEAme parfum, mais en robe du dimanche.",summerPerfume:"Le parfum d\u2019\xE9t\xE9 sent l\u2019herbe coup\xE9e, les fleurs et la peau chaude. On le met pour se souvenir de l\u2019\xE9t\xE9 quand il pleut.",vanillaPerfume:"Le parfum \xE0 la vanille sent le g\xE2teau qui cuit. Quand j\u2019en mets, les enfants me suivent partout dans la maison.",grandParfum:"Le Grand parfum de Meuh, c\u2019est toute la ferme dans un flacon\xA0: la lavande, le foin, les pommes et un tout petit peu de vache. Rose dit que c\u2019est po\xE9tique.",monoi:"Le mono\xEF, c\u2019est la fleur de tiar\xE9 dans l\u2019huile de coco. Ma\xEBva en met dans ses cheveux. Moi aussi, maintenant. Les poules trouvent que je sens bon.",pineappleJuice:"L\u2019ananas a l\u2019air d\u2019un fruit qui s\u2019est d\xE9guis\xE9 en chevalier, avec son armure et sa couronne. Dedans, il est tout doux.",mangoJuice:"Le jus de mangue est \xE9pais comme du velours. Tiago dit qu\u2019il faut le boire lentement, sinon la mangue est vex\xE9e.",guavaJuice:"La goyave sent tellement fort que toute l\u2019\xEEle sait quand on en ouvre une. Son jus est rose comme un bonbon.",coconutMilk:"Le lait de coco, c\u2019est le lait des \xEEles, sans vache. Les vaches de la ferme trouvent \xE7a tr\xE8s suspect.",bananaSmoothie:"Le smoothie banane-fraise, c\u2019est le petit-d\xE9jeuner que je fais quand tu viens dormir \xE0 la ferme. Avec une paille, sinon ce n\u2019est pas dr\xF4le.",mangoPassion:"Mangue et passion dans le m\xEAme verre, c\u2019est le soleil qui a rencontr\xE9 la pluie d\u2019\xE9t\xE9. \xC7a fait un arc-en-ciel dans la bouche.",lassi:"Le lassi, c\u2019est un yaourt qui a voyag\xE9 jusqu\u2019en Inde et qui est revenu avec une mangue. Ma\xEBva me l\u2019a fait go\xFBter au march\xE9 de l\u2019\xEEle.",limeade:"La limonade au citron vert pique le nez et rafra\xEEchit les id\xE9es. Je la sers aux enfants qui reviennent de courir, tout rouges.",islandCocktail:"Le cocktail des \xEEles se sert dans une noix de coco avec une petite ombrelle. La petite ombrelle, c\u2019est le plus important.",bananaBread:"Le banana bread se fait avec les bananes trop m\xFBres, toutes noires. Ma\xEBva dit que ce sont les meilleures. Elle a raison, et \xE7a m\u2019\xE9tonne encore.",coconutFlan:"Le flan coco tremble dans l\u2019assiette comme s\u2019il avait peur d\u2019\xEAtre mang\xE9. Il a raison d\u2019avoir peur.",pineappleCake:"Le g\xE2teau renvers\xE9 \xE0 l\u2019ananas se fait \xE0 l\u2019envers. On le retourne \xE0 la fin, en retenant son souffle. Quand il sort entier, on applaudit.",limePie:"La tarte au citron vert meringu\xE9e, c\u2019est la tarte au citron qui est partie en vacances. Elle est revenue avec un chapeau de meringue.",blancManger:"Le blanc-manger coco est blanc comme la plage au matin. Ma\xEBva le d\xE9core d\u2019une fleur de tiar\xE9. Il est presque trop joli pour \xEAtre mang\xE9. Presque.",sweetPotatoCake:"Le g\xE2teau de patate douce, je n\u2019y croyais pas. Un g\xE2teau aux patates\xA0! Et puis j\u2019ai go\xFBt\xE9, et j\u2019en ai repris trois fois.",coffee:"Le caf\xE9 de la br\xFBlerie sent si bon que tout le village sait quand Tiago torr\xE9fie. Les voisins arrivent avec leur tasse avant m\xEAme qu\u2019on les appelle.",cafeLatte:"Le caf\xE9 au lait, c\u2019est le petit-d\xE9jeuner de ton grand-p\xE8re pendant soixante ans. Un grand bol, deux tartines, et le journal de la veille.",tiramisu:"Tiramisu veut dire \xAB\xA0remonte-moi le moral\xA0\xBB en italien. \xC7a marche tr\xE8s bien. J\u2019en fais quand quelqu\u2019un a de la peine.",rum:"Le rhum blanc se fait avec la canne \xE0 sucre de l\u2019\xEEle. Tiago dit que c\u2019est le soleil mis en bouteille. Une boisson pour les grands.",arrangedRum:"Le rhum arrang\xE9, on y fait mac\xE9rer des fruits pendant des mois, chez les grands. Les fruits, eux, ne disent rien\xA0: ils attendent leur heure.",coconutPunch:"Le punch coco se sert le soir de la f\xEAte du carnaval, aux grands. Les enfants, eux, ont le lait de coco \xE0 la vanille, et ils dansent plus longtemps."};var k2=()=>n.carnet=n.
