// ---- Utilitaires ----
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const fmt = n => Number(n || 0).toLocaleString('fr-FR');
const fmtDur = s => {
  if (!s) return '—';
  if (s < 60) return s + ' s';
  const m = Math.floor(s / 60), r = s % 60;
  if (m < 60) return r ? `${m} min ${r} s` : `${m} min`;
  const h = Math.floor(m / 60), rm = m % 60;
  return rm ? `${h} h ${rm} min` : `${h} h`;
};
let toastTimer;
function showToast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 1800);
}
async function copyText(t, label = 'Copié !') {
  try { await navigator.clipboard.writeText(t); showToast(label); }
  catch {
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove(); showToast(label);
  }
}

// Décompression gzip native du payload embarqué
async function loadPayload() {
  const bin = atob(DATA_GZ);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const ds = new DecompressionStream('gzip');
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  const text = await new Response(stream).text();
  return JSON.parse(text);
}

// ---- Moteurs SVG fidèles au jeu ----
let SPR, DATA, USED_IN;
const svgWrap = (inner, vb = '0 0 64 64') =>
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}" stroke-linecap="round" stroke-linejoin="round">${inner || ''}</svg>`;
const itemSvg = id => svgWrap(SPR.items[id] || SPR.ui.star || '');
const machSvg = id => svgWrap(SPR.machines[id] || '');
const uiSvg = id => svgWrap(SPR.ui[id] || '');
const animSvg = key => svgWrap(SPR.animVars[key] || SPR.animals[key.split('~')[0]] || '', '0 0 80 80');
const plantSvg = (id, stage) => {
  const it = DATA.items[id];
  const arr = SPR.plants[id];
  if (!it || !arr) return itemSvg(id);
  if (it.type === 'crop') return svgWrap(stage === 0 ? SPR.sprout : arr[stage === 1 ? 0 : 1]);
  return svgWrap(arr[Math.max(0, Math.min(2, stage))]);
};

// Primitives SVG du jeu (kit.js) pour chevaux du Haras & bouteilles d'abbaye
const INK = '#3a2618';
const O = INK;
const P = (d, f, sw = 2.4) => `<path d="${d}" fill="${f}" stroke="${INK}" stroke-width="${sw}"/>`;
const F = (d, f, op = 1) => `<path d="${d}" fill="${f}"${op < 1 ? ` opacity="${op}"` : ''}/>`;
const L = (d, sw = 2.2, c = INK) => `<path d="${d}" fill="none" stroke="${c}" stroke-width="${sw}"/>`;
const C = (x, y, r, f, sw = 2.4) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" stroke="${INK}" stroke-width="${sw}"/>`;
const FC = (x, y, r, f, op = 1) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${f}"${op < 1 ? ` opacity="${op}"` : ''}/>`;
const E = (x, y, rx, ry, f, rot = 0, sw = 2.4) =>
  `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${f}" stroke="${INK}" stroke-width="${sw}"${rot ? ` transform="rotate(${rot} ${x} ${y})"` : ''}/>`;
const FE = (x, y, rx, ry, f, op = 1, rot = 0) =>
  `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${f}"${op < 1 ? ` opacity="${op}"` : ''}${rot ? ` transform="rotate(${rot} ${x} ${y})"` : ''}/>`;
const R = (x, y, w, h, rx, f, sw = 2.4) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${f}" stroke="${INK}" stroke-width="${sw}"/>`;
const SHADOW = (x, y, rx, ry = 3.5) => FE(x, y, rx, ry, INK, 0.14);
const HL = (x, y, rx, ry, rot = -25, op = 0.55) => FE(x, y, rx, ry, '#fff', op, rot);
const subItem = (id, x, y, s) => {
  const inner = SPR.items[id];
  return inner ? `<g transform="translate(${x} ${y}) scale(${s / 64})">${inner}</g>` : '';
};

const dom = p => !!(p[0] || p[1]);

  return c;
}
function crossCoat(a, b) {
  const c = {}, mut = DATA.haras.coat.mut;
  for (const k of Object.keys(DATA.haras.coat.freq)) {
    const pick = p => { const v = !!p[Math.random() < .5 ? 0 : 1]; return Math.random() < mut ? !v : v; };
    c[k] = [pick(a[k]), pick(b[k])];
  }

}
function robeOfCoat(c) {
  const black = dom(c.E), bay = black && dom(c.A);
  const base = !black ? 'alezan' : bay ? (dom(c.Br) ? 'bai' : 'baibrun') : 'noir';
  const cr = (c.Cr[0] ? 1 : 0) + (c.Cr[1] ? 1 : 0);
  if (dom(c.G)) return 'gris';
  if (cr === 2) return 'creme';
  if (dom(c.Rn)) return bay ? 'rouan' : !black ? 'aubere' : 'noir';
  if (dom(c.D) && bay) return 'louvet';

}
function marksOfCoat(c) {
  const m = [], robe = robeOfCoat(c);
  if (!dom(c.belleface)) m.push('belleface');
  else if (dom(c.liste)) m.push('liste');
  else if (dom(c.etoile)) m.push('etoile');
  if (dom(c.balzanes)) m.push('balzanes');
  if (dom(c.pie)) m.push('pie');
  if (dom(c.appaloosa)) m.push('appaloosa');
  if (dom(c.raie) && robe !== 'louvet') m.push('raie');
  if (!dom(c.lave) && ['alezan','palomino','aubere'].includes(robe)) m.push('lave');
  return m;
}

    + F('M19.4 30 Q32 27 44.6 30 L44.6 56 Q44.6 58.6 42 58.6 L22 58.6 Q19.4 58.6 19.4 56Z', c, 0.92)
    + R(20, 34, 24, 18, 4, '#fffaf0', 1.6)
    + L('M22 49 L42 49', 1.4, c)
    + subItem(main, 24, 34, 15)
    + (ings.length > 1 ? ings.slice(1).map(([id], k) => C(23 + k * 18, 33, 3.6, '#fffaf0', 1.2) + subItem(id, 20 + k * 18, 30, 6)).join('') : '')
    + F('M20.5 28 L23 26 L23 54 L20.5 54Z', '#fff', 0.4)
    + P(body, 'none')
    + R(26, 0, 12, 6, 2, aged ? '#8b5a2b' : '#c8453a')
    + (aged ? L('M18 40 L46 40', 1.2, '#d8b070') : '')
    + [0,1,2].map(k => k < (b.stars || 0) ? P(`M${26+k*6} 56.5 l1 2 2.2 .3 -1.6 1.5 .4 2.2 -2 -1 -2 1 .4 -2.2 -1.6 -1.5 2.2 -.3Z`, '#ffd23f', 0.8) : '').join('');
  return svgWrap(inner);
}

// ---- Moteur logique de la Brasserie d'Abbaye (src/systems/brewery.js) ----
function evalBrew(mode, baseKey, hop, ings, barrelId) {
  const A = DATA.abbey;
  const mead = mode === 'mead';
  const cider = mode === 'cider';
  const sake = mode === 'sake';
  const noHop = mead || cider || sake;
  const bd = mead
    ? { name: 'Hydromel', color: DATA.honeyCol[baseKey] || DATA.honeyCol.all, ...(A.meadBases[baseKey] || A.meadBases.all), mead: true, honey: baseKey }
    : cider
      ? { ...(A.ciderBases[baseKey] || A.ciderBases.sweet), cider: true }
      : sake
        ? { ...(A.sakeBases[baseKey] || A.sakeBases.junmai), sake: true }
        : { ...(A.malts[baseKey] || A.malts.maltBlond) };
  const ingFl = id => DATA.genetics.flavors[id] || A.brewExtra[id] || [0,0,0,0,0];
  const noteOf = v => v.indexOf(Math.max(...v));
  const det = k => (k === 0 ? 'le ' : 'l’') + A.notes[k];
  const cap = t => t[0].toUpperCase() + t.slice(1);
  const honeyDe = h => (DATA.honeys[h] ? ' ' + DATA.honeys[h].name.replace(/^Miel /, '') : '');

  const profile = [...bd.taste];
  profile[2] += noHop ? 0 : hop;
  for (const [id, d] of ings) ingFl(id).forEach((v, k) => (profile[k] += v * d));

  const reasons = [];
  let stars = 0, classic = null;
  if (!ings.length) {
    reasons.push('Ajoutez au moins un ingrédient.');
  } else {
    const ip = [0,0,0,0,0];
    for (const [id, d] of ings) ingFl(id).forEach((v, k) => (ip[k] += v * d));
    const order = ip.map((v, k) => [v, k]).sort((x, y) => y[0] - x[0]);
    const [a, b] = [order[0][1], order[1][1]];
    let score = 0;
    if (order[1][0] >= order[0][0] * 0.3 && order[1][0] > 0) {
      const pair = A.pairs[`${Math.min(a,b)}-${Math.max(a,b)}`] || 0;
      if (pair > 0) reasons.push(`${cap(det(a))} et ${det(b)} vont bien ensemble.`);
      if (pair < 0) reasons.push(`${cap(det(a))} et ${det(b)} se battent.`);
      score += pair;
    } else reasons.push(`Une seule note domine : ${A.notes[a]}.`);

    const who = mead ? `L’hydromel${honeyDe(baseKey)}` : cider || sake ? `Le ${bd.name.toLowerCase()}` : `Une ${bd.name.toLowerCase()}`;
    if (!bd.likes.length) reasons.push(`${who} ${bd.text}.`);
    else if (bd.likes.includes(a)) { score += 1; reasons.push(`${who} ${bd.text}.`); }
    else reasons.push(`${who} ${bd.text} : essayez ${mead ? 'un autre miel' : cider ? 'une autre base de verger' : sake ? 'un autre style de saké' : 'un autre malt'}.`);

    const effHop = noHop ? 0 : hop;
    if (effHop === 3 && a === 0) { score -= 1; reasons.push('Trop de houblon pour une bière douce.'); }
    if (effHop === 1 && (a === 2 || a === 3)) reasons.push('Un houblon plus fort irait bien à ce goût.');
    if (effHop === 3 && (a === 2 || a === 3)) { score += 1; reasons.push('Le houblon fort relève ce goût.'); }

    const bases = ings.map(([id]) => id);
    classic = mead
      ? A.meadClassics.find(c => c.any.some(id => bases.includes(id)))
      : cider
        ? A.ciderClassics.find(c => c.any.some(id => bases.includes(id)))
        : sake
          ? A.sakeClassics.find(c => c.any.some(id => bases.includes(id)))
          : A.classics.find(c => c.ings.every(id => bases.includes(id)));
    if (classic && !noHop) {
      reasons.push(classic.text);
      stars = Math.max(0, Math.min(3, score + 2));
    } else {
      if (classic) { reasons.push(classic.text); score += 1; }
      const tops = ings.map(([id]) => noteOf(ingFl(id)));
      let clash = false;
      for (let x = 0; x < tops.length; x++)
        for (let y = x + 1; y < tops.length; y++)
          if ((A.pairs[`${Math.min(tops[x],tops[y])}-${Math.max(tops[x],tops[y])}`] || 0) < 0) clash = true;
      if (clash) { score -= 1; reasons.push('Deux ingrédients ne s’entendent pas.'); }
      else if (ings.length > 1 && new Set(tops).size > 1) { score += 1; reasons.push('Un beau mélange, riche et équilibré.'); }
      stars = Math.max(0, Math.min(3, score));
    }
  }

  // Nom & coût & valeur
  const ingVal = id => id in A.brewExtra ? Math.round((DATA.items[id]?.sell || 0) * 0.2) : (DATA.items[id]?.sell || 0);
  const honeyMult = mead && DATA.honeys[baseKey] ? DATA.honeys[baseKey].mult : 1;
  const costMap = mead
    ? { honey: A.mead.honeyPerBrew }
    : cider
      ? { ...(A.ciderBases[baseKey] || A.ciderBases.sweet).cost }
      : sake
        ? { ...(A.sakeBases[baseKey] || A.sakeBases.junmai).cost }
        : { [baseKey]: A.abbey.maltPerBrew, hop: hop * A.abbey.hopPerDose };
  for (const [id, d] of ings) costMap[id] = (costMap[id] || 0) + d * A.abbey.ingPerDose;
  let totalCost = 0;
  for (const [id, n] of Object.entries(costMap)) {
    const u = id === 'honey' && mead ? Math.round((DATA.items.honey?.sell || 120) * honeyMult) : ingVal(id);
    totalCost += u * n;
  }
  const time = mead
    ? A.mead.baseTime + A.mead.perIng * ings.length
    : cider
      ? A.cider.baseTime + A.cider.perIng * ings.length
      : sake
        ? A.sake.baseTime + A.sake.perIng * ings.length
        : A.abbey.baseTime + A.abbey.perIng * ings.length;
  const baseValue = ings.length ? Math.round((((A.abbey.price * totalCost + 0.1 * time) / A.abbey.bottles) * A.abbey.harmony[stars]) / 5) * 5 : 0;
  const barrel = barrelId ? A.barrels[barrelId] : null;
  const agedMaxValue = barrel ? Math.round((baseValue * barrel.mult * A.cellar.mult[3]) / 5) * 5 : 0;

  let name = '';
  if (ings.length) {
    const list = [...ings].sort((x, y) => y[1] - x[1]).map(([id]) => (DATA.items[id]?.name || id).toLowerCase());
    const what = list.length === 1 ? list[0] : list.length === 2 ? `${list[0]}-${list[1]}` : `${list.slice(0,-1).join(', ')} et ${list[list.length-1]}`;
    if (mead) name = `${classic ? classic.name : 'Hydromel'}${honeyDe(baseKey)} ${what}`;
    else if (cider) name = `${classic ? classic.name : bd.name} ${what}`;
    else if (sake) {
      const dup = classic && list.length === 1 && ((classic.id === 'yuzushu' && ings[0][0] === 'yuzu') || (classic.id === 'umeshuClassic' && ings[0][0] === 'ume'));
      name = `${classic ? classic.name : bd.name} ${dup ? bd.short.toLowerCase() : what}`;
    } else name = `${bd.name} ${what}`;
  }
  return { mead, cider, sake, bd, profile, stars, reasons, classic, costMap, time, baseValue, barrel, agedMaxValue, name };
}

function inspectSprite(cat, id) {
  let title = id, svgStr = '', extra = '';

    const it = DATA.items[id];
    title = it ? it.name : id;
    svgStr = itemSvg(id);
    if (it) extra = `<div class="mt-3 flex flex-wrap gap-2 text-xs">
      <span class="surf px-2 py-1 rounded">Type : ${esc(it.type)}</span>
      ${it.reqLvl ? `<span class="surf px-2 py-1 rounded">Niveau ${it.reqLvl}</span>` : ''}
      ${it.sell ? `<span class="surf px-2 py-1 rounded">Vente : ${fmt(it.sell)} pièces</span>` : ''}
      <button class="btn-sec px-2.5 py-1 rounded cursor-pointer" onclick="inspectProduct('${esc(id)}')">Voir la fiche produit →</button>
    </div>`;
  } else if (cat === 'plants') {
    const it = DATA.items[id];
    title = it ? `${it.name} (${it.seedName || ''})` : id;
    svgStr = plantSvg(id, 2);
    const stages = it?.type === 'tree' ? ['Jeune arbre', 'En fleurs', 'Avec fruits'] : ['Pousse', 'Jeune plant', 'Prêt à récolter'];
    extra = `<div class="mt-4"><div class="text-xs font-semibold mb-2">Stades de pousse</div>
      <div class="grid grid-cols-3 gap-2">${[0,1,2].map(st => `<div class="surf rounded-lg p-2 flex flex-col items-center">
        <div class="w-16 h-16 spr-box">${plantSvg(id, st)}</div><span class="text-xs muted mt-1">${stages[st]}</span>
      </div>`).join('')}</div></div>`;
  } else if (cat === 'animals') {
    const a = DATA.animals[id];
    title = a ? a.name : id;
    svgStr = animSvg(id);
    const fs = DATA.genetics.speciesFeatures[id] || [];
    if (fs.length) {
      extra = `<div class="mt-3 text-xs muted">Traits morphologiques disponibles dans le Générateur Génétique : <b>${fs.map(f => DATA.genetics.features[f].name).join(', ')}</b>.</div>`;
    }
  } else if (cat === 'machines') {
    const m = DATA.machines[id];
    title = m ? m.name : id;
    svgStr = machSvg(id);
    if (m) extra = `<div class="mt-3 text-xs muted">Débloqué au niveau <b>${m.reqLvl}</b></div>`;
  } else if (cat === 'ui') {
    title = `Icône UI · ${id}`;
    svgStr = uiSvg(id);
  } else if (cat === 'people') {
    title = DATA.villagers[id] || id;
    svgStr = svgWrap(SPR.people[id] || '');
  } else if (cat === 'buildings') {
    if (id.startsWith('farmhouse_')) {
      const l = +id.split('_')[1];
      title = `Maison de ferme (niv. ${l})`;
      svgStr = svgWrap(SPR.farmhouses[l]);
    } else {
      title = `Bâtiment · ${id}`;
      svgStr = svgWrap(SPR.buildings[id] || '', '0 -20 100 110');
    }
  } else if (cat === 'vehicles') {
    title = id;
    svgStr = SPR.vehicles[id] || '';
  }
  window.__lastSvg = svgStr;
  openModal(`
    <div class="flex flex-col sm:flex-row gap-4 items-center sm:items-start">
      <div class="w-40 h-40 checker rounded-xl border border-[var(--border,#e2d8c5)] p-3 spr-box shrink-0">${svgStr}</div>
      <div class="flex-1 min-w-0">

        </div>
      </div>
    </div>
  `);
}

function getSpriteEntries(cat) {
  if (cat === 'items') return Object.keys(SPR.items).map(id => ({ id, label: DATA.items[id]?.name || id, svg: () => itemSvg(id) }));
  if (cat === 'plants') return Object.keys(SPR.plants).map(id => ({ id, label: DATA.items[id]?.name || id, svg: () => plantSvg(id, 2) }));
  if (cat === 'animals') return Object.keys(SPR.animals).map(id => ({ id, label: DATA.animals[id]?.name || id, svg: () => animSvg(id) }));
  if (cat === 'machines') return Object.keys(SPR.machines).map(id => ({ id, label: DATA.machines[id]?.name || id, svg: () => machSvg(id) }));
  if (cat === 'ui') return Object.keys(SPR.ui).map(id => ({ id, label: id, svg: () => uiSvg(id) }));
  if (cat === 'people') return Object.keys(SPR.people).map(id => ({ id, label: DATA.villagers[id] || id, svg: () => svgWrap(SPR.people[id]) }));
  if (cat === 'buildings') return [
    ...SPR.farmhouses.map((_, i) => ({ id: 'farmhouse_' + i, label: 'Ferme niv. ' + i, svg: () => svgWrap(SPR.farmhouses[i]) })),
    ...Object.keys(SPR.buildings).map(id => ({ id, label: id, svg: () => svgWrap(SPR.buildings[id], '0 -20 100 110') })),
  ];
  if (cat === 'vehicles') return Object.keys(SPR.vehicles).map(id => ({ id, label: id, svg: () => SPR.vehicles[id] }));
  return [];
}

  `;

  $$('#spr-cats button').forEach(b => b.onclick = () => { S.sprCat = b.dataset.cat; S.sprLimit = 120; renderSprites(); });
  $('#spr-q').oninput = e => { S.sprQ = e.target.value; S.sprLimit = 120; renderSprites(); $('#spr-q').focus(); $('#spr-q').setSelectionRange(S.sprQ.length, S.sprQ.length); };
  const more = $('#spr-more');
  if (more) more.onclick = () => { S.sprLimit += 180; renderSprites(); };
}

// ---- ONGLET 2 : PRODUITS & USINES ----
function renderProducts() {
  const q = norm(S.prodQ);
  const machList = Object.values(DATA.machines).sort((a, b) => a.reqLvl - b.reqLvl || a.name.localeCompare(b.name, 'fr'));
  const rawCount = Object.values(DATA.items).filter(it => !DATA.recipes[it.id]).length;
  const modes = [
    ['machines', `Par usine / atelier (${machList.length})`],
    ['raw', `Matières brutes (${rawCount})`],
    ['special', 'Crus de miel, Cave & Paquets'],
  ];

  let body = '';
  if (S.prodMode === 'machines') {
    const byM = {};
    for (const r of Object.values(DATA.recipes)) {
      if (r.lvl > S.prodMaxLvl) continue;
      const it = DATA.items[r.id];
      if (!it) continue;
      if (q) {
        const hitName = norm(it.name).includes(q) || norm(r.id).includes(q);
        const hitIng = Object.keys(r.ing).some(k => norm(DATA.items[k]?.name || k).includes(q));
        if (!hitName && !hitIng) continue;
      }
      (byM[r.machine] ||= []).push(r);
    }
    const visibleMachs = machList.filter(m => (S.prodMach === 'all' || m.id === S.prodMach) && (byM[m.id]?.length));
    const totalShown = visibleMachs.reduce((a, m) => a + byM[m.id].length, 0);
    const sortRec = (a, b) => S.prodSort === 'price' ? (DATA.items[b.id]?.sell || 0) - (DATA.items[a.id]?.sell || 0)
      : S.prodSort === 'name' ? DATA.items[a.id].name.localeCompare(DATA.items[b.id].name, 'fr')
      : a.lvl - b.lvl || DATA.items[a.id].name.localeCompare(DATA.items[b.id].name, 'fr');

    body = `<div class="text-xs muted mb-3">${totalShown} recettes affichées sur ${visibleMachs.length} atelier${visibleMachs.length > 1 ? 's' : ''}. Cliquez sur un produit pour voir sa fiche complète et où il est utilisé.</div>
    <div class="space-y-4">
      ${visibleMachs.map(m => {
        const list = byM[m.id].sort(sortRec);
        return `<section class="card rounded-xl p-4">
          <div class="flex items-center gap-3 pb-3 mb-3 border-b border-[var(--border,#e2d8c5)]">
            <div class="w-11 h-11 spr-box shrink-0">${machSvg(m.id)}</div>
            <div class="flex-1 min-w-0">
              <h3 class="font-bold text-sm sm:text-base">${esc(m.name)}</h3>
              <div class="text-xs muted">Débloqué niv. ${m.reqLvl} · ${list.length} produit${list.length > 1 ? 's' : ''}</div>
            </div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5">
            ${list.map(r => {
              const it = DATA.items[r.id];
              const cave = DATA.cave.items[r.id];
              return `<button onclick="inspectProduct('${esc(r.id)}')" class="surf hover:shadow rounded-xl p-2.5 flex items-center gap-2.5 text-left cursor-pointer transition">
                <div class="w-12 h-12 spr-box shrink-0">${itemSvg(r.id)}</div>
                <div class="flex-1 min-w-0">
                  <div class="flex items-center justify-between gap-1">
                    <span class="font-semibold text-xs sm:text-sm truncate">${esc(it.name)}</span>
                    ${it.sell ? `<span class="text-xs font-mono shrink-0">${fmt(it.sell)} p.</span>` : ''}
                  </div>
                  <div class="text-[11px] muted">Niv. ${r.lvl} · ${fmtDur(r.time)}${r.out > 1 ? ` · ×${r.out}` : ''}${cave ? ' · Cave' : ''}</div>
                  <div class="flex flex-wrap gap-1 mt-1">
                    ${Object.entries(r.ing).map(([k, n]) => `<span class="card rounded px-1.5 py-0.5 text-[11px] flex items-center gap-1" title="${esc(DATA.items[k]?.name || k)}">
                      <span class="w-3.5 h-3.5 spr-box inline-block">${itemSvg(k)}</span>${n}
                    </span>`).join('')}
                  </div>
                </div>
              </button>`;
            }).join('')}
          </div>
        </section>`;
      }).join('') || '<div class="card rounded-xl p-8 text-center muted text-sm">Aucune recette ne correspond aux filtres.</div>'}
    </div>`;
  } else if (S.prodMode === 'raw') {
    const rawItems = Object.values(DATA.items).filter(i => i.type !== 'artisan');
    const match = i => (!q || norm(i.name).includes(q) || norm(i.id).includes(q)) && (!i.reqLvl || i.reqLvl <= S.prodMaxLvl);
    const groups = [
      ['Cultures — Ferme (plein champ)', rawItems.filter(i => i.type === 'crop' && !i.ghOnly && !i.island)],
      ['Cultures — Serre uniquement', rawItems.filter(i => i.type === 'crop' && i.ghOnly)],
      ['Cultures — Île, Oasis, Grand Nord & Asie', rawItems.filter(i => i.type === 'crop' && i.island)],
      ['Arbres — Verger (ferme)', rawItems.filter(i => i.type === 'tree' && !i.island)],
      ['Arbres — Île, Oasis, Grand Nord & Asie', rawItems.filter(i => i.type === 'tree' && i.island)],
      ['Élevage & Produits spécifiques', rawItems.filter(i => i.type === 'product' && !i.sea)],
      ['Pêche (étang, lagon & pêche en mer)', rawItems.filter(i => i.type === 'fish' || i.type === 'junk' || (i.type === 'product' && i.sea))],
      ['Minerais, gemmes, lingots, bois & matériaux', rawItems.filter(i => ['ore','gem','ingot','material','rare','misc'].includes(i.type))],
    ];
    body = `<div class="space-y-4">
      ${groups.map(([title, list]) => {
        const items = list.filter(match).sort((a,b) => (a.reqLvl||0)-(b.reqLvl||0) || a.name.localeCompare(b.name,'fr'));
        if (!items.length) return '';
        return `<section class="card rounded-xl p-4">
          <h3 class="font-bold text-sm mb-3">${title} <span class="muted font-normal">(${items.length})</span></h3>
          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-2">
            ${items.map(i => `<button onclick="inspectProduct('${esc(i.id)}')" class="surf hover:shadow rounded-lg p-2 flex items-center gap-2 text-left cursor-pointer">
              <div class="w-10 h-10 spr-box shrink-0">${itemSvg(i.id)}</div>
              <div class="min-w-0 text-xs">
                <div class="font-semibold truncate">${esc(i.name)}</div>
                <div class="muted">${i.reqLvl ? `Niv. ${i.reqLvl}` : i.oasis ? 'Oasis' : i.nord ? 'Grand Nord' : i.asie ? 'Terres d’Asie' : i.sea ? 'Mer' : i.type}${i.sell ? ` · ${fmt(i.sell)} p.` : ''}</div>
              </div>
            </button>`).join('')}
          </div>
        </section>`;
      }).join('')}
    </div>`;
  } else {
    const byFam = {};
    for (const [id, fam] of Object.entries(DATA.cave.items)) (byFam[fam] ||= []).push(id);
    body = `<div class="space-y-4">
      <section class="card rounded-xl p-4">
        <h3 class="font-bold text-sm mb-3">Rucher — 23 crus de miel floraux</h3>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2">
          ${Object.entries(DATA.honeys).map(([k, h]) => `<div class="surf rounded-lg p-2.5 flex items-center gap-2.5">
            <span class="w-7 h-7 rounded-full shrink-0 border border-black/20" style="background:${DATA.honeyCol[k] || '#e8a825'}"></span>
            <div class="min-w-0 text-xs"><div class="font-semibold truncate">${esc(h.name)}</div><div class="muted">Multiplicateur ×${h.mult}</div></div>
          </div>`).join('')}
        </div>
      </section>
      <section class="card rounded-xl p-4">
        <h3 class="font-bold text-sm mb-3">Cave d’affinage — 35 produits en 6 familles</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          ${Object.entries(byFam).map(([fam, ids]) => `<div class="surf rounded-lg p-3">
            <div class="text-xs font-bold mb-2">${esc(DATA.cave.families[fam] || fam)} (${ids.length})</div>
            <div class="flex flex-wrap gap-1.5">
              ${ids.map(id => id === 'beer'
                ? `<span class="card rounded px-2 py-1 text-xs flex items-center gap-1"><span class="w-4 h-4 spr-box inline-block">${uiSvg('beer')}</span>Bières d’abbaye</span>`
                : `<button onclick="inspectProduct('${esc(id)}')" class="card rounded px-2 py-1 text-xs flex items-center gap-1 cursor-pointer hover:opacity-80"><span class="w-4 h-4 spr-box inline-block">${itemSvg(id)}</span>${esc(DATA.items[id]?.name || id)}</button>`
              ).join('')}
            </div>
          </div>`).join('')}
        </div>
      </section>
      <section class="card rounded-xl p-4">
        <h3 class="font-bold text-sm mb-3">Paquets &amp; assortiments de la Maison (${DATA.packs.length})</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5">
          ${DATA.packs.map(p => `<div class="surf rounded-lg p-2.5 flex items-center gap-2.5">
            <div class="w-10 h-10 spr-box shrink-0">${p.item ? itemSvg(p.item) : itemSvg('crate')}</div>
            <div class="text-xs"><div class="font-semibold">${esc(p.name)} ${p.bonus ? `<span class="muted">(+${Math.round(p.bonus*100)}%)</span>` : ''}</div><div class="muted">${esc(p.blurb)}</div></div>
          </div>`).join('')}
        </div>
      </section>
    </div>`;
  }

  $('#main').innerHTML = `
    <div class="space-y-4">
      <div class="card rounded-xl p-4 space-y-3">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div class="flex flex-wrap gap-1.5" id="prod-modes">
            ${modes.map(([k, lbl]) => `<button data-m="${k}" class="pill ${S.prodMode === k ? 'active' : ''} text-xs px-3 py-1.5 rounded-full cursor-pointer">${lbl}</button>`).join('')}
          </div>
          ${S.prodMode !== 'special' ? `<input id="prod-q" type="search" value="${esc(S.prodQ)}" placeholder="Nom de produit ou d’ingrédient…" class="surf rounded-lg px-3 py-1.5 text-sm w-full sm:w-64 outline-none" />` : ''}
        </div>
        ${S.prodMode === 'machines' ? `<div class="flex flex-wrap items-center gap-3 text-xs">
          <label class="flex items-center gap-1.5">Usine :
            <select id="prod-mach" class="surf rounded-lg px-2 py-1">
              <option value="all">Toutes les ${machList.length} usines</option>
              ${machList.map(m => `<option value="${m.id}" ${S.prodMach === m.id ? 'selected' : ''}>${esc(m.name)} (niv. ${m.reqLvl})</option>`).join('')}
            </select>
          </label>
          <label class="flex items-center gap-1.5">Tri :
            <select id="prod-sort" class="surf rounded-lg px-2 py-1">
              <option value="lvl" ${S.prodSort === 'lvl' ? 'selected' : ''}>Niveau</option>
              <option value="price" ${S.prodSort === 'price' ? 'selected' : ''}>Prix décroissant</option>
              <option value="name" ${S.prodSort === 'name' ? 'selected' : ''}>Alphabétique</option>
            </select>
          </label>
          <label class="flex items-center gap-2">Niveau max : <b id="prod-lvl-v">${S.prodMaxLvl}</b>
            <input id="prod-lvl" type="range" min="1" max="100" value="${S.prodMaxLvl}" class="w-28" />
          </label>
        </div>` : ''}
      </div>
      ${body}
    </div>
  `;

  $$('#prod-modes button').forEach(b => b.onclick = () => { S.prodMode = b.dataset.m; renderProducts(); });
  const pq = $('#prod-q');
  if (pq) pq.oninput = e => { S.prodQ = e.target.value; renderProducts(); $('#prod-q').focus(); $('#prod-q').setSelectionRange(S.prodQ.length, S.prodQ.length); };
  const pm = $('#prod-mach');
  if (pm) pm.onchange = e => { S.prodMach = e.target.value; renderProducts(); };
  const ps = $('#prod-sort');
  if (ps) ps.onchange = e => { S.prodSort = e.target.value; renderProducts(); };
  const pl = $('#prod-lvl');
  if (pl) pl.oninput = e => { S.prodMaxLvl = +e.target.value; renderProducts(); };
}

// ---- ONGLET 3 : GÉNÉRATEUR GÉNÉTIQUE (+ ROBES DU HARAS) ----
function currentBaseSvg() {
  if (S.genMode === 'plants') return S.genStage === 'item' ? itemSvg(S.genId) : plantSvg(S.genId, +S.genStage);
  if (S.genMode === 'animals') {
    const fs = DATA.genetics.speciesFeatures[S.genId] || [];
    const code = fs.map(f => S.genFeat[f] || 0).join('');
    const key = code && !/^0*$/.test(code) ? `${S.genId}~${code}` : S.genId;
    return animSvg(key);
  }
  return horseSvg({ robe: S.horseRobe, marks: S.horseMarks, stage: S.horseStage, shoes: S.horseShoes, coat: S.horseCoat, gearSet: S.horseGear });
}

function renderGenetics() {
  const LKS = DATA.genetics.looks;
  const plantsList = Object.values(DATA.items).filter(i => i.type === 'crop' || i.type === 'tree').sort((a,b) => a.name.localeCompare(b.name,'fr'));
  const animList = Object.values(DATA.animals).sort((a,b) => a.name.localeCompare(b.name,'fr'));
  if (S.genMode === 'plants' && !DATA.items[S.genId]) S.genId = 'strawberry';
  if (S.genMode === 'animals' && !DATA.animals[S.genId]) S.genId = 'cow';
  if (S.genMode === 'horses' && !S.horseGenome) {
    S.horseParentA = founderCoat(); S.horseParentB = founderCoat();
    S.horseGenome = crossCoat(S.horseParentA, S.horseParentB);
  }

  const baseSvg = currentBaseSvg();
  const lookObj = { size: S.genSize, color: S.genColor, pattern: S.genPattern, finish: S.genFinish, morph: S.genMorph, halo: S.genHalo };
  const wrapped = genWrap(baseSvg, lookObj, S.genMode === 'plants');
  const fs = S.genMode === 'animals' ? (DATA.genetics.speciesFeatures[S.genId] || []) : [];

  // Planche de comparaison
  let cmpCards = [];
  if (S.genCompare === 'color') {
    cmpCards = LKS.color.map((name, i) => ({ name, active: S.genColor === i, click: `setGen('genColor',${i})`, html: genWrap(baseSvg, { ...lookObj, color: i }, S.genMode === 'plants') }));
  } else if (S.genCompare === 'pattern') {
    cmpCards = LKS.pattern.map((name, i) => ({ name, active: S.genPattern === i, click: `setGen('genPattern',${i})`, html: genWrap(baseSvg, { ...lookObj, pattern: i }, S.genMode === 'plants') }));
  } else if (S.genCompare === 'finish') {
    cmpCards = LKS.finish.map((name, i) => ({ name, active: S.genFinish === i, click: `setGen('genFinish',${i})`, html: genWrap(baseSvg, { ...lookObj, finish: i }, S.genMode === 'plants') }));
  } else if (S.genCompare === 'morph' && S.genMode === 'plants' && LKS.morph) {
    cmpCards = LKS.morph.map((name, i) => ({ name, active: S.genMorph === i, click: `setGen('genMorph',${i})`, html: genWrap(baseSvg, { ...lookObj, morph: i }, true) }));
  } else if (S.genCompare === 'size') {
    cmpCards = LKS.size.map((name, i) => ({ name, active: S.genSize === i, click: `setGen('genSize',${i})`, html: genWrap(baseSvg, { ...lookObj, size: i }, S.genMode === 'plants') }));
  } else if (S.genCompare === 'robes' && S.genMode === 'horses') {
    cmpCards = Object.entries(DATA.haras.coat.robes).map(([k, name]) => ({
      name, active: S.horseRobe === k, click: `setGen('horseRobe','${k}')`,
      html: genWrap(horseSvg({ robe: k, marks: S.horseMarks, stage: S.horseStage, shoes: S.horseShoes, coat: S.horseCoat, gearSet: S.horseGear }), lookObj, false),
    }));
  }

  const traitsList = S.genMode === 'plants' ? DATA.genetics.plantTraits : DATA.genetics.animalTraits;
  const speciesFlavors = S.genMode === 'plants' ? DATA.genetics.flavors[S.genId] : null;
  const totalCombos = LKS.size.length * LKS.color.length * LKS.pattern.length * LKS.finish.length * (S.genMode === 'plants' && LKS.morph ? LKS.morph.length : 1) * 2;

  $('#main').innerHTML = `
    <div class="space-y-4">
      <div class="card rounded-xl p-4 flex flex-wrap items-center justify-between gap-2">
        <div class="flex flex-wrap gap-1.5" id="gen-modes">
          <button data-gm="plants" class="pill ${S.genMode === 'plants' ? 'active' : ''} text-xs px-3 py-1.5 rounded-full cursor-pointer">Plantes &amp; Arbres (${plantsList.length})</button>
          <button data-gm="animals" class="pill ${S.genMode === 'animals' ? 'active' : ''} text-xs px-3 py-1.5 rounded-full cursor-pointer">Animaux (${animList.length})</button>
          <button data-gm="horses" class="pill ${S.genMode === 'horses' ? 'active' : ''} text-xs px-3 py-1.5 rounded-full cursor-pointer">Haras — Robes de chevaux (11 robes × 8 marques)</button>
        </div>
        <div class="flex gap-2">
          <button id="gen-rand" class="btn-pri text-xs px-3 py-1.5 rounded-lg cursor-pointer">🎲 Aléatoire</button>
          <button id="gen-reset" class="btn-sec text-xs px-3 py-1.5 rounded-lg cursor-pointer">Réinitialiser</button>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
        <!-- Studio d'aperçu -->
        <div class="lg:col-span-5 card rounded-xl p-5 flex flex-col items-center">
          <div class="w-56 h-56 checker rounded-2xl border border-[var(--border,#e2d8c5)] p-6 flex items-center justify-center overflow-hidden">
            <div class="w-40 h-40">${wrapped}</div>
          </div>
          <div class="mt-3 text-center">
            <div class="font-bold text-base">
              ${S.genMode === 'plants' ? esc(DATA.items[S.genId]?.name) : S.genMode === 'animals' ? esc(DATA.animals[S.genId]?.name) : `Cheval · ${esc(DATA.haras.coat.robes[S.horseRobe])}`}
            </div>
            <div class="text-xs muted mt-0.5">
              ${[LKS.size[S.genSize], LKS.color[S.genColor], LKS.pattern[S.genPattern], S.genFinish ? LKS.finish[S.genFinish] : '', S.genHalo ? 'Auréole dorée' : ''].filter(Boolean).join(' · ')}
            </div>
            ${S.genMode === 'horses' && S.horseMarks.length ? `<div class="text-xs muted mt-0.5">Marques : ${S.horseMarks.map(m => DATA.haras.coat.marks[m]).join(', ')}</div>` : ''}
            <div class="text-[11px] muted mt-1">${fmt(totalCombos)} combinaisons d’apparence par espèce</div>
          </div>

          ${speciesFlavors ? `<div class="w-full mt-4 pt-3 border-t border-[var(--border,#e2d8c5)]">
            <div class="text-xs font-semibold mb-1.5">Profil gustatif de base de l’espèce</div>
            <div class="space-y-1">${DATA.abbey.notes.map((n, i) => `<div class="flex items-center gap-2 text-xs">
              <span class="w-14 capitalize muted">${n}</span>
              <div class="flex-1 h-2 surf rounded-full overflow-hidden"><div class="h-full rounded-full" style="width:${Math.min(100, speciesFlavors[i]*20)}%;background:${DATA.abbey.noteCol[i]}"></div></div>
              <span class="w-4 text-right font-mono">${speciesFlavors[i]}</span>
            </div>`).join('')}</div>
          </div>` : ''}

          ${S.genMode === 'horses' ? `<div class="w-full mt-4 pt-3 border-t border-[var(--border,#e2d8c5)] space-y-2">
            <div class="flex items-center justify-between">
              <span class="text-xs font-semibold">Croisement mendélien du Haras</span>
              <button id="horse-breed" class="btn-sec text-xs px-2.5 py-1 rounded-lg cursor-pointer">Simuler un poulain</button>
            </div>
            <div class="text-[11px] font-mono surf rounded-lg p-2 break-all muted">${esc(geneLetters(S.horseGenome))}</div>
          </div>` : ''}
        </div>

        <!-- Contrôles -->
        <div class="lg:col-span-7 card rounded-xl p-4 space-y-4">
          ${S.genMode === 'plants' ? `<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <label class="text-xs font-semibold block">Espèce (culture ou arbre)
              <select id="gen-species" class="surf rounded-lg px-2.5 py-1.5 text-sm w-full mt-1 font-normal">
                ${plantsList.map(i => `<option value="${i.id}" ${S.genId === i.id ? 'selected' : ''}>${esc(i.name)} (${i.type === 'tree' ? 'arbre' : 'culture'})</option>`).join('')}
              </select>
            </label>
            <div class="text-xs font-semibold">Affichage
              <div class="flex flex-wrap gap-1 mt-1 font-normal">
                ${[['2','Plante mûre'],['1','Jeune'],['0','Pousse'],['item','Récolte']].map(([v,l]) => `<button data-st="${v}" class="pill ${String(S.genStage) === v ? 'active' : ''} text-xs px-2.5 py-1 rounded-lg cursor-pointer">${l}</button>`).join('')}
              </div>
            </div>
          </div>` : ''}

          ${S.genMode === 'animals' ? `<div class="space-y-3">
            <label class="text-xs font-semibold block">Espèce animale
              <select id="gen-species" class="surf rounded-lg px-2.5 py-1.5 text-sm w-full mt-1 font-normal">
                ${animList.map(a => `<option value="${a.id}" ${S.genId === a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}
              </select>
            </label>
            ${fs.length ? `<div class="surf rounded-lg p-3 space-y-2">
              <div class="text-xs font-semibold">Traits morphologiques propres à l’espèce</div>
              <div class="flex flex-wrap gap-3">
                ${fs.map(fk => `<div class="text-xs"><span class="muted mr-1.5">${DATA.genetics.features[fk].name} :</span>
                  ${DATA.genetics.features[fk].list.map((lbl, idx) => `<button data-fk="${fk}" data-fv="${idx}" class="pill ${(S.genFeat[fk]||0) === idx ? 'active' : ''} px-2 py-0.5 rounded-md cursor-pointer mr-1">${lbl}</button>`).join('')}
                </div>`).join('')}
              </div>
            </div>` : '<div class="text-xs muted">Cette espèce n’a pas de trait morphologique supplémentaire (uniquement les gènes d’apparence ci-dessous).</div>'}
          </div>` : ''}

          ${S.genMode === 'horses' ? `<div class="space-y-3 surf rounded-xl p-3">
            <div class="text-xs font-semibold">Robe génétique (11)</div>
            <div class="flex flex-wrap gap-1.5">
              ${Object.entries(DATA.haras.coat.robes).map(([k, lbl]) => `<button data-hr="${k}" class="pill ${S.horseRobe === k ? 'active' : ''} text-xs px-2.5 py-1 rounded-lg cursor-pointer flex items-center gap-1.5">
                <span class="w-3 h-3 rounded-full border border-black/25 inline-block" style="background:${ROBES[k].K}"></span>${lbl}

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 pt-1 text-xs">

              <div><div class="font-semibold mb-1">Équipement (adulte)</div>
                <select id="horse-gear" class="card rounded-lg px-2 py-1 w-full">

                  <button id="horse-coat" class="pill ${S.horseCoat ? 'active' : ''} px-2 py-1 rounded cursor-pointer">Crins longs</button>

            </div>
            <div><span class="font-semibold block mb-1">Motif (${LKS.pattern.length})</span>
              <div class="flex flex-wrap gap-1">${LKS.pattern.map((l, i) => `<button data-gp="${i}" class="pill ${S.genPattern === i ? 'active' : ''} px-2.5 py-1 rounded-lg cursor-pointer">${l}</button>`).join('')}</div>
            </div>
            <div><span class="font-semibold block mb-1">Finition (${LKS.finish.length})</span>
              <div class="flex flex-wrap gap-1">${LKS.finish.map((l, i) => `<button data-gf="${i}" class="pill ${S.genFinish === i ? 'active' : ''} px-2.5 py-1 rounded-lg cursor-pointer">${l}</button>`).join('')}</div>
            </div>
            ${S.genMode === 'plants' && LKS.morph ? `<div><span class="font-semibold block mb-1">Morphologie végétale (${LKS.morph.length})</span>
              <div class="flex flex-wrap gap-1">${LKS.morph.map((l, i) => `<button data-gmorph="${i}" class="pill ${S.genMorph === i ? 'active' : ''} px-2.5 py-1 rounded-lg cursor-pointer">${l}</button>`).join('')}</div>
            </div>` : ''}
            <div class="flex flex-wrap items-center gap-4">
              <div><span class="font-semibold block mb-1">Taille (${LKS.size.length})</span>
                <div class="flex flex-wrap gap-1">${LKS.size.map((l, i) => `<button data-gs="${i}" class="pill ${S.genSize === i ? 'active' : ''} px-2 py-1 rounded-lg cursor-pointer">${l}</button>`).join('')}</div>
              </div>
              <label class="flex items-center gap-2 font-semibold cursor-pointer mt-4">
                <input id="gen-halo" type="checkbox" ${S.genHalo ? 'checked' : ''} class="w-4 h-4" /> ✨ Auréole dorée
              </label>
            </div>
          </div>
        </div>
      </div>

      <!-- Planche comparative -->
      <section class="card rounded-xl p-4 space-y-3">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <h3 class="font-bold text-sm">Planche de variations (cliquez pour appliquer)</h3>
          <div class="flex flex-wrap gap-1.5 text-xs" id="gen-cmp-btns">
            ${[['color',`${LKS.color.length} Couleurs`],['pattern',`${LKS.pattern.length} Motifs`],['finish',`${LKS.finish.length} Finitions`],...(S.genMode === 'plants' && LKS.morph ? [['morph',`${LKS.morph.length} Morphologies`]] : []),['size',`${LKS.size.length} Tailles`], ...(S.genMode === 'horses' ? [['robes','11 Robes']] : [])].map(([k,l]) => `<button data-cmp="${k}" class="pill ${S.genCompare === k ? 'active' : ''} px-2.5 py-1 rounded-full cursor-pointer">${l}</button>`).join('')}

        <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-2.5">

            <span class="text-xs font-medium">${esc(c.name)}</span>
          </button>`).join('')}
        </div>
      </section>

      <!-- Liste des traits génétiques -->
      <section class="card rounded-xl p-4">
        <h3 class="font-bold text-sm mb-2">Traits génétiques transmissibles (${S.genMode === 'plants' ? 'Plantes & arbres' : 'Animaux'})</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2 text-xs">
          ${traitsList.map(t => `<div class="surf rounded-lg p-2">
            <div class="font-semibold">${esc(t.name)} ${t.flavor ? '<span class="muted font-normal">(goût)</span>' : t.extra ? '<span class="muted font-normal">(rare)</span>' : ''}</div>
            ${t.hint ? `<div class="muted text-[11px] mt-0.5">${esc(t.hint)}</div>` : ''}
          </div>`).join('')}
        </div>
      </section>
    </div>
  `;

  window.setGen = (k, v) => { S[k] = v; renderGenetics(); };
  $$('#gen-modes button').forEach(b => b.onclick = () => {
    S.genMode = b.dataset.gm;
    if (S.genMode === 'plants') { S.genId = 'strawberry'; S.genCompare = S.genCompare === 'robes' ? 'color' : S.genCompare; }
    else if (S.genMode === 'animals') { S.genId = 'cow'; S.genFeat = {}; S.genCompare = (S.genCompare === 'robes' || S.genCompare === 'morph') ? 'color' : S.genCompare; }
    else S.genCompare = 'robes';
    renderGenetics();
  });
  const sp = $('#gen-species');
  if (sp) sp.onchange = e => { S.genId = e.target.value; S.genFeat = {}; renderGenetics(); };
  $$('[data-st]').forEach(b => b.onclick = () => { S.genStage = b.dataset.st; renderGenetics(); });
  $$('[data-fk]').forEach(b => b.onclick = () => { S.genFeat[b.dataset.fk] = +b.dataset.fv; renderGenetics(); });
  $$('[data-gc]').forEach(b => b.onclick = () => { S.genColor = +b.dataset.gc; renderGenetics(); });
  $$('[data-gp]').forEach(b => b.onclick = () => { S.genPattern = +b.dataset.gp; renderGenetics(); });
  $$('[data-gf]').forEach(b => b.onclick = () => { S.genFinish = +b.dataset.gf; renderGenetics(); });
  $$('[data-gmorph]').forEach(b => b.onclick = () => { S.genMorph = +b.dataset.gmorph; renderGenetics(); });
  $$('[data-gs]').forEach(b => b.onclick = () => { S.genSize = +b.dataset.gs; renderGenetics(); });
  $('#gen-halo').onchange = e => { S.genHalo = e.target.checked; renderGenetics(); };
  $$('#gen-cmp-btns button').forEach(b => b.onclick = () => { S.genCompare = b.dataset.cmp; renderGenetics(); });

  $$('[data-hr]').forEach(b => b.onclick = () => { S.horseRobe = b.dataset.hr; renderGenetics(); });
  $$('[data-hm]').forEach(b => b.onclick = () => {
    const k = b.dataset.hm;
    S.horseMarks = S.horseMarks.includes(k) ? S.horseMarks.filter(x => x !== k) : [...S.horseMarks, k];
    renderGenetics();
  });
  $$('[data-hst]').forEach(b => b.onclick = () => { S.horseStage = +b.dataset.hst; renderGenetics(); });
  $$('[data-hsh]').forEach(b => b.onclick = () => { S.horseShoes = +b.dataset.hsh; renderGenetics(); });
  const hg = $('#horse-gear'); if (hg) hg.onchange = e => { S.horseGear = e.target.value; renderGenetics(); };
  const hc = $('#horse-coat'); if (hc) hc.onclick = () => { S.horseCoat = S.horseCoat ? 0 : 1; renderGenetics(); };
  const hb = $('#horse-breed');
  if (hb) hb.onclick = () => {
    S.horseParentA = founderCoat(); S.horseParentB = founderCoat();
    S.horseGenome = crossCoat(S.horseParentA, S.horseParentB);
    S.horseRobe = robeOfCoat(S.horseGenome);
    S.horseMarks = marksOfCoat(S.horseGenome);
    renderGenetics();
  };

  $('#gen-rand').onclick = () => {
    S.genSize = Math.floor(Math.random() * LKS.size.length);
    S.genColor = Math.floor(Math.random() * LKS.color.length);
    S.genPattern = Math.floor(Math.random() * LKS.pattern.length);
    S.genFinish = Math.floor(Math.random() * LKS.finish.length);
    S.genMorph = LKS.morph ? Math.floor(Math.random() * LKS.morph.length) : 0;
    S.genHalo = Math.random() < 0.25;
    if (S.genMode === 'animals') {
      for (const fk of fs) S.genFeat[fk] = Math.floor(Math.random() * DATA.genetics.features[fk].list.length);
    } else if (S.genMode === 'horses') {
      S.horseGenome = founderCoat();
      S.horseRobe = robeOfCoat(S.horseGenome);
      S.horseMarks = marksOfCoat(S.horseGenome);
    }
    renderGenetics();
  };
  $('#gen-reset').onclick = () => {
    S.genSize = 1; S.genColor = 0; S.genPattern = 0; S.genFinish = 0; S.genMorph = 0; S.genHalo = false; S.genFeat = {};
    S.horseRobe = 'bai'; S.horseMarks = []; S.horseStage = 2; S.horseShoes = 0; S.horseCoat = 0; S.horseGear = '';
    renderGenetics();
  };
}

// ---- ONGLET 4 : BRASSERIE D'ABBAYE ----
function renderBrewery() {
  const A = DATA.abbey;
  const mead = S.brewMode === 'mead';
  const cider = S.brewMode === 'cider';
  const sake = S.brewMode === 'sake';
  const noHop = mead || cider || sake;
  const maxSlots = mead ? A.mead.maxSlots : 3;
  if (S.brewIngs.length > maxSlots) S.brewIngs = S.brewIngs.slice(0, maxSlots);
  const baseKey = mead ? S.brewHoney : cider ? S.brewCider : sake ? S.brewSake : S.brewMalt;
  const ev = evalBrew(S.brewMode, baseKey, S.brewHop, S.brewIngs, S.brewBarrel);
  const bottleSvg = renderBeerSvg({
    mead,
    cider,
    sake,
    malt: S.brewMalt,
    honey: S.brewHoney,
    ciderKey: S.brewCider,
    sakeKey: S.brewSake,
    ings: S.brewIngs,
    stars: ev.stars,
    aged: !!S.brewBarrel,
  });
  window.__lastBrewSvg = bottleSvg;

  const allIngs = [...A.brewable, ...Object.keys(A.brewExtra)].sort((a,b) => (DATA.items[a]?.name || a).localeCompare(DATA.items[b]?.name || b, 'fr'));
  const q = norm(S.brewQ);
  const filteredIngs = q ? allIngs.filter(id => norm(DATA.items[id]?.name || id).includes(q)) : allIngs;
  const maxNote = Math.max(5, ...ev.profile);
  const classicsList = mead ? A.meadClassics : cider ? A.ciderClassics : sake ? A.sakeClassics : A.classics;
  const honeyTotal = 1 + Object.keys(DATA.honeys).length;

  const basePicker = !noHop ? `
    <div><div class="font-bold mb-1.5">1. Malt de base (4 sacs)</div>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
        ${A.maltIds.map(id => `<button data-malt="${id}" class="pill ${S.brewMalt === id ? 'active' : ''} rounded-lg p-2 flex items-center gap-2 cursor-pointer text-left">
          <span class="w-4 h-4 rounded-full border border-black/30 shrink-0" style="background:${A.malts[id].color}"></span>
          <div><div class="font-semibold">${A.malts[id].name}</div></div>
        </button>`).join('')}
      </div>
      <div class="muted mt-1">${esc(A.malts[S.brewMalt].text)}</div>
    </div>
    <div><div class="font-bold mb-1.5">2. Dose de houblon</div>
      <div class="flex gap-2">
        ${A.hopDoses.map((lbl, idx) => `<button data-hop="${idx+1}" class="pill ${S.brewHop === idx+1 ? 'active' : ''} px-3 py-1.5 rounded-lg cursor-pointer">${lbl} (${(idx+1)*A.abbey.hopPerDose} cônes)</button>`).join('')}
      </div>
    </div>
  ` : mead ? `
    <div><div class="font-bold mb-1.5">1. Miel de base (${A.mead.honeyPerBrew} pots · ${honeyTotal} miels)</div>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-1.5 max-h-40 overflow-y-auto pr-1">
        ${['all', ...Object.keys(DATA.honeys)].map(k => `<button data-honey="${k}" class="pill ${S.brewHoney === k ? 'active' : ''} rounded-lg px-2 py-1.5 flex items-center gap-1.5 cursor-pointer text-left">
          <span class="w-3.5 h-3.5 rounded-full border border-black/25 shrink-0" style="background:${DATA.honeyCol[k] || '#e8a825'}"></span>
          <span class="truncate">${k === 'all' ? 'Toutes fleurs' : esc(DATA.honeys[k].name.replace(/^Miel /, ''))}</span>
        </button>`).join('')}
      </div>
      <div class="muted mt-1">${esc((A.meadBases[S.brewHoney] || A.meadBases.all).text)}</div>
    </div>
  ` : cider ? `
    <div><div class="font-bold mb-1.5">1. Base du verger (sans houblon)</div>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
        ${A.ciderIds.map(id => {
          const cb = A.ciderBases[id];
          const cStr = Object.entries(cb.cost).map(([k, n]) => `${n} ${DATA.items[k]?.name?.toLowerCase() || k}`).join(' + ');
          return `<button data-cider="${id}" class="pill ${S.brewCider === id ? 'active' : ''} rounded-lg p-2 flex items-center gap-2 cursor-pointer text-left">
            <span class="w-4 h-4 rounded-full border border-black/30 shrink-0" style="background:${cb.color}"></span>
            <div class="min-w-0"><div class="font-semibold truncate">${esc(cb.short)}</div><div class="text-[10px] muted truncate">${esc(cStr)}</div></div>
          </button>`;

      </div>
      <div class="muted mt-1">${esc((A.sakeBases[S.brewSake] || A.sakeBases.junmai).text)}</div>
    </div>
  `;

  $('#main').innerHTML = `

          <button data-bm="mead" class="pill ${S.brewMode === 'mead' ? 'active' : ''} text-xs px-3 py-1.5 rounded-full cursor-pointer">Hydromel (${honeyTotal} miels · max 4 ingr.)</button>
          <button data-bm="sake" class="pill ${S.brewMode === 'sake' ? 'active' : ''} text-xs px-3 py-1.5 rounded-full cursor-pointer">Saké (4 styles · max 3 ingr.)</button>

        <div class="flex gap-2">

            <div class="text-xl tracking-widest mt-1">${[1,2,3].map(i => `<span style="color:${i <= ev.stars ? '#e5a417' : 'rgba(128,128,128,.3)'}">★</span>`).join('')}</div>
            ${ev.classic ? `<div class="mt-2 text-xs font-semibold px-3 py-1 rounded-full bg-amber-500/15 border border-amber-500/40 text-amber-700 dark:text-amber-300">Recette classique reconnue : ${esc(ev.classic.name)}</div>` : ''}
            <button onclick="copyText(window.__lastBrewSvg, 'SVG de la bouteille copié !')" class="btn-sec text-xs px-3 py-1 rounded-lg mt-2 cursor-pointer">Copier le SVG</button>
          </div>

          <div class="surf rounded-xl p-3 space-y-1.5 text-xs">
            <div class="font-bold">Notes d’accord</div>
            ${ev.reasons.map(r => `<div class="muted">• ${esc(r)}</div>`).join('')}

          <div class="space-y-1.5">

            ${A.notes.map((n, i) => `<div class="flex items-center gap-2 text-xs">
              <span class="w-14 capitalize muted">${n}</span>
              <div class="flex-1 h-2.5 surf rounded-full overflow-hidden"><div class="h-full rounded-full transition-all" style="width:${Math.round((ev.profile[i]/maxNote)*100)}%;background:${A.noteCol[i]}"></div></div>

              <div class="text-[11px] muted">${ev.barrel ? `Note ${ev.barrel.note} (×${(ev.barrel.mult * A.cellar.mult[3]).toFixed(2)})` : 'Sélectionnez un fût'}</div>

            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-1.5 max-h-64 overflow-y-auto pr-1">
              ${filteredIngs.map(id => {
                const picked = S.brewIngs.some(([x]) => x === id);

                const top = fl.indexOf(Math.max(...fl));
                return `<button data-add="${id}" ${picked || S.brewIngs.length >= maxSlots ? 'disabled' : ''} class="${picked ? 'opacity-45' : 'hover:shadow cursor-pointer'} surf rounded-lg p-1.5 flex items-center gap-1.5 text-left">

                    <div class="font-medium truncate">${esc(DATA.items[id]?.name || id)}</div>

              }).join('')}
            </div>
          </div>
        </div>
      </div>
    </div>
  `;

  $$('#brew-modes button').forEach(b => b.onclick = () => { S.brewMode = b.dataset.bm; renderBrewery(); });
  $$('[data-malt]').forEach(b => b.onclick = () => { S.brewMalt = b.dataset.malt; renderBrewery(); });
  $$('[data-cider]').forEach(b => b.onclick = () => { S.brewCider = b.dataset.cider; renderBrewery(); });
  $$('[data-honey]').forEach(b => b.onclick = () => { S.brewHoney = b.dataset.honey; renderBrewery(); });
  $$('[data-sake]').forEach(b => b.onclick = () => { S.brewSake = b.dataset.sake; renderBrewery(); });
  $$('[data-hop]').forEach(b => b.onclick = () => { S.brewHop = +b.dataset.hop; renderBrewery(); });
  $$('[data-bar]').forEach(b => b.onclick = () => { S.brewBarrel = b.dataset.bar; renderBrewery(); });
  $$('[data-dose]').forEach(b => b.onclick = () => { const [i, v] = b.dataset.dose.split(':').map(Number); S.brewIngs[i][1] = v; renderBrewery(); });
  $$('[data-rm]').forEach(b => b.onclick = () => { S.brewIngs.splice(+b.dataset.rm, 1); renderBrewery(); });
  $$('[data-add]').forEach(b => b.onclick = () => { if (S.brewIngs.length < maxSlots) { S.brewIngs.push([b.dataset.add, 1]); renderBrewery(); } });
  const bq = $('#brew-q');
  if (bq) bq.oninput = e => { S.brewQ = e.target.value; renderBrewery(); $('#brew-q').focus(); $('#brew-q').setSelectionRange(S.brewQ.length, S.brewQ.length); };

  $$('[data-cls]').forEach(b => b.onclick = () => {
    const cid = b.dataset.cls;
    if (S.brewMode === 'beer') {
      const c = A.classics.find(x => x.id === cid);
      if (c) {
        S.brewIngs = c.ings.map(id => [id, 2]);
        if (cid === 'stout') { S.brewMalt = 'maltBlack'; S.brewHop = 3; }
        else if (cid === 'witbier') { S.brewMalt = 'maltBlond'; S.brewHop = 1; }
        else if (cid === 'sahti') { S.brewMalt = 'maltBrown'; S.brewHop = 2; }
        else if (cid === 'kriek') { S.brewMalt = 'maltBlond'; S.brewHop = 1; }
        else if (cid === 'pumpkinAle') { S.brewMalt = 'maltAmber'; S.brewHop = 1; }
      }
    } else {
      const c = classicsList.find(x => x.id === cid);
      if (c) S.brewIngs = [[c.any[0], 2]];
    }
    renderBrewery();
  });

  $('#brew-clear').onclick = () => { S.brewIngs = []; S.brewBarrel = ''; renderBrewery(); };
  $('#brew-rand3').onclick = () => {
    const pool = [...A.brewable, ...Object.keys(A.brewExtra)];
    const pick = arr => arr[Math.floor(Math.random() * arr.length)];
    for (let t = 0; t < 200; t++) {
      const n = 2 + Math.floor(Math.random() * (maxSlots - 1));
      const set = new Set();
      while (set.size < n) set.add(pick(pool));
      const ings = [...set].map(id => [id, 1 + Math.floor(Math.random() * 3)]);
      const m = mead ? pick(Object.keys(DATA.honeys)) : cider ? pick(A.ciderIds) : sake ? pick(A.sakeIds) : pick(A.maltIds);
      const h = noHop ? 0 : 1 + Math.floor(Math.random() * 3);
      if (evalBrew(S.brewMode, m, h, ings, '').stars === 3) {

        else if (sake) S.brewSake = m;
        else { S.brewMalt = m; S.brewHop = h; }
        S.brewIngs = ings;
        renderBrewery();
        return;
      }
    }
    showToast('Essayez à nouveau !');
  };
}

function confBaseObj(baseId) {
  const C = DATA.confiserie;
  if (baseId.startsWith('honey:') || baseId.startsWith('nhoney:')) {
    const isNougat = baseId.startsWith('nhoney:');
    const h = isNougat ? baseId.slice(7) : baseId.slice(6);
    const col = DATA.honeyCol[h] || DATA.honeyCol.all || '#e8b339';
    const hName = h === 'all' ? 'Miel toutes fleurs' : DATA.honeys[h] ? DATA.honeys[h].name : 'Miel de fleur';
    const mb = DATA.abbey.meadBases[h] || DATA.abbey.meadBases.all;
    return isNougat
      ? { id: baseId, kind: 'nougat', name: `Nougat au ${hName}`, short: h === 'all' ? 'Toutes fleurs' : hName.replace(/^Miel (de |d’)/i, ''), cost: { honey: 2, egg: 2, almond: 1 }, col: '#f6edd9', col2: col, likes: mb ? mb.likes : [0, 1, 4], text: mb?.text || 'nougat blanc au miel de fleur', honey: h }
      : { id: baseId, kind: 'caramel', name: `Caramel au ${hName}`, short: h === 'all' ? 'Toutes fleurs' : hName.replace(/^Miel (de |d’)/i, ''), cost: { honey: 2, sugar: 2 }, col, col2: '#a86a18', likes: mb ? mb.likes : [0, 1, 3, 4], text: mb?.text || 'caramel au miel de fleur', honey: h };
  }
  return C.bases[baseId] || C.bases.dark;
}

function evalConf(kind, baseId, ings, mirror) {
  const C = DATA.confiserie;
  const kDef = C.kinds[kind];
  const b = confBaseObj(baseId);
  const fl = id => DATA.genetics.flavors[id] || C.extra[id] || [0,0,0,0,0];
  const topNote = v => v.indexOf(Math.max(...v));
  const reasons = [];
  let stars = 0, classic = null;
  if (!ings.length) {
    reasons.push('Choisissez au moins un ingrédient.');
  } else {
    let score = 1;
    const tops = ings.map(id => topNote(fl(id)));
    if (tops.some(t => b.likes.includes(t))) { score += 1; reasons.push(`Belle affinité avec ${b.short}.`); }
    const bKey = baseId.startsWith('nhoney:') ? 'nougatBlanc' : baseId.startsWith('honey:') ? 'honey' : baseId;
    classic = C.classics.find(c => c.kind === kind && c.bases.includes(bKey) && c.any.some(id => ings.includes(id))) || null;
    if (classic) {
      score += 2;
      reasons.unshift(classic.text);
      stars = Math.max(0, Math.min(3, score));
    } else {
      let clash = false;
      for (let i = 0; i < tops.length; i++)
        for (let j = i + 1; j < tops.length; j++)
          if ((DATA.abbey.pairs[`${Math.min(tops[i],tops[j])}-${Math.max(tops[i],tops[j])}`] || 0) < 0) clash = true;
      if (clash) { score -= 1; reasons.push('Deux notes s’entrechoquent un peu.'); }
      else if (ings.length >= 2 && new Set(tops).size >= 2) { score += 1; reasons.push('Bel équilibre de saveurs !'); }
      stars = Math.max(0, Math.min(3, score));
    }
  }
  const cost = { ...b.cost };
  for (const id of ings) cost[id] = (cost[id] || 0) + 2;
  const valOf = id => id in C.extra ? Math.round((DATA.items[id]?.sell || 0) * 0.35) : (DATA.items[id]?.sell || 0);
  const rawVal = Object.entries(cost).reduce((s, [id, n]) => s + valOf(id) * n, 0);
  const baseVal = Math.max(45, Math.round(((rawVal * 1.48 * C.harmony[stars]) / kDef.batch) * 1.15));
  const finalVal = Math.round(baseVal * C.miniMult[mirror ? 3 : 0]);
  const accentCol = C.noteCol[ings.length ? topNote(fl(ings[0])) : 0] || '#f5c842';
  const main = ings.length ? (DATA.items[ings[0]]?.name || ings[0]).toLowerCase() : '';
  const name = classic ? classic.name : main ? `${kind === 'berlingot' ? 'Berlingots' : b.name} · ${main}` : (kind === 'berlingot' ? 'Berlingots' : b.name);
  const time = kDef.baseTime + kDef.perIng * ings.length;
  return { kDef, b, stars, classic, reasons, cost, baseVal, finalVal, accentCol, name, time };
}

function evalPerfume(head, heart, base, method, conc) {
  const PF = DATA.perfume;
  const m = PF.methods[method] || PF.methods.enfleurage;
  const c = PF.concs[conc] || PF.concs.fraiche;
  const topOf = v => v.indexOf(Math.max(...v));
  const profile = [0, 0, 0, 0, 0];
  for (const [tier, id] of [['head', head], ['heart', heart], ['base', base]]) {
    const nd = PF.notes[id];
    if (!nd) continue;
    const mult = m.tier === tier ? 1.25 : 1;
    nd.v.forEach((x, k) => (profile[k] += Math.round(x * mult)));
  }
  profile[m.facet] += m.boost;
  const classic = PF.classics.find(cl => cl.head.includes(head) && cl.heart.includes(heart) && cl.base.includes(base)) || null;
  const hd = PF.notes[head], cd = PF.notes[heart], bd = PF.notes[base];
  const top = topOf(profile);
  const family = (hd && hd.tag === 'boreal') || (cd && cd.tag === 'boreal') ? 'boreal' : top === 0 ? (hd && hd.tag === 'aromatique' ? 'aromatique' : 'hesperide') : ['hesperide', 'floral', 'boise', 'oriental', 'gourmand'][top];
  const order = profile.map((v, k) => [v, k]).sort((a, b) => b[0] - a[0]);
  const [a, b] = [order[0][1], order[1][1]];
  let score = 0;
  const reasons = [];
  if (classic) { score += 2; reasons.push(classic.text); }
  if (order[1][0] >= order[0][0] * 0.35 && order[1][0] > 0) {
    const pair = PF.pairs[`${Math.min(a, b)}-${Math.max(a, b)}`] || 0;
    if (pair > 0) { score += 1; reasons.push(`${PF.facets[a]} et ${PF.facets[b].toLowerCase()} s’accordent à merveille.`); }
    else if (pair < 0) { score -= 1; reasons.push(`${PF.facets[a]} et ${PF.facets[b].toLowerCase()} se heurtent.`); }
  }
  const tId = m.tier === 'head' ? head : m.tier === 'heart' ? heart : base;
  if (PF.notes[tId] && topOf(PF.notes[tId].v) === m.facet) { score += 1; reasons.push(`La ${m.name.toLowerCase()} sublime l’étage ${m.tier === 'head' ? 'de tête' : m.tier === 'heart' ? 'de cœur' : 'de fond'}.`); }
  const tops = [topOf(hd.v), topOf(cd.v), topOf(bd.v)];
  if (new Set(tops).size === 3) { score += 1; reasons.push('Pyramide riche : trois facettes distinctes.'); }
  const stars = Math.max(0, Math.min(3, score));
  const raw = ((DATA.items[head]?.sell || 40) + (DATA.items[heart]?.sell || 40) + (DATA.items[base]?.sell || 40)) * c.qty;
  const baseVal = (raw * PF.cfg.priceMult + c.stageSec * 0.25) / c.bottles;
  const value = Math.max(25, Math.round((baseVal * m.valMult * c.valMult * PF.cfg.harmony[stars]) / 5) * 5);
  const deepVal = Math.max(25, Math.round((value * 1.54) / 5) * 5);
  const color = pfMixHex(hd?.col, cd?.col, bd?.col);
  const stageSec = Math.round(c.stageSec * m.timeMult);
  const name = classic ? classic.name : `${conc === 'extrait' ? 'Extrait' : conc === 'toilette' ? 'Parfum' : 'Eau'} ${(DATA.items[heart]?.name || heart).toLowerCase()} & ${(DATA.items[base]?.name || base).toLowerCase()}`;
  return { profile, classic, family, stars, reasons, value, deepVal, color, stageSec, totalSec: stageSec * 3, bottles: c.bottles, qty: c.qty, name };
}

function rollCampersBatch() {
  const C0 = DATA.camping || { names: ['Camille', 'Lucien', 'Éloïse', 'Hector', 'Nina', 'Oscar', 'Rosalie', 'Bastien'], origins: ['de Bretagne', 'de Provence', 'de Savoie', 'du Québec'], profiles: ['Randonneur', 'Gourmet', 'Artiste', 'Pêcheur'] };
  const used = new Set();
  const list = [];
  for (let i = 0; i < 8; i++) {
    const seed = Math.floor(Math.random() * 1e9);
    const woman = Math.random() < 0.5;
    const old = Math.random() < 0.2;
    const id = habRandomId(seed, { [woman ? 'female' : 'male']: true, ...(old ? { old: true } : {}), ...(S.charSeason ? { season: S.charSeason } : {}) });
    const avail = C0.names.filter(n => !used.has(n));
    const name = avail.length ? avail[Math.floor(Math.random() * avail.length)] : C0.names[i % C0.names.length];
    used.add(name);
    const origin = C0.origins[Math.floor(Math.random() * C0.origins.length)];
    const profile = C0.profiles[Math.floor(Math.random() * C0.profiles.length)];
    list.push({ id, name, origin, profile });
  }
  S.charCampers = list;
}

  USED_IN = {};
  for (const r of Object.values(DATA.recipes)) {
    for (const k of Object.keys(r.ing)) (USED_IN[k] ||= []).push(r.id);
  }
  $('#hdr-logo').innerHTML = animSvg('cow');
  $('#hdr-ver').textContent = 'v' + DATA.version;
  const totalSpr = Object.keys(SPR.items).length + Object.keys(SPR.animals).length + Object.keys(SPR.machines).length + Object.keys(SPR.ui).length + Object.keys(SPR.people).length + Object.keys(SPR.buildings).length + SPR.farmhouses.length + Object.keys(SPR.vehicles).length;
  $('#hdr-stats').textContent = `${fmt(Object.keys(DATA.items).length)} produits · ${fmt(totalSpr)} sprites · ${Object.keys(DATA.machines).length} ateliers`;
  $$('#tabs button').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; renderActiveTab(); });
  const applyTheme = dark => {
    document.documentElement.classList.toggle('dark', dark);
    $('#theme-btn').textContent = dark ? '☀️' : '🌙';
  };
  const savedTheme = (() => { try { return localStorage.getItem('meuh-codex-theme'); } catch { return null; } })();
  applyTheme(savedTheme ? savedTheme === 'dark' : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  $('#theme-btn').onclick = () => {
    const next = !document.documentElement.classList.contains('dark');
    applyTheme(next);
    try { localStorage.setItem('meuh-codex-theme', next ? 'dark' : 'light'); } catch {}
  };
  $('#loading').classList.add('hidden');
  $('#app').classList.remove('hidden');
  renderActiveTab();
}).catch(err => {
  $('#loading').textContent = 'Erreur de chargement : ' + err.message;
});
</script>
</body>
</html>
